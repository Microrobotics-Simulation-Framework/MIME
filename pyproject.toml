[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mime-engine"
version = "0.2.0"
description = "MIcrorobotics Multiphysics Engine — domain-specific physics for microrobot simulation"
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [
    { name = "Nicholas Ehsan Roy" },
]
keywords = [
    "microrobotics",
    "simulation",
    "multi-physics",
    "jax",
    "differentiable-simulation",
    "lattice-boltzmann",
    "computational-fluid-dynamics",
    "gpu",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "maddening>=0.4.1,<0.5",
    "jax>=0.10,<0.13",
    "jaxlib>=0.10,<0.13",
    "numpy>=1.24",
]

[project.urls]
Homepage      = "https://microrobotica.org/mime/"
Repository    = "https://github.com/Microrobotics-Simulation-Framework/MIME"
Documentation = "https://microrobotica.org/mime/"
Issues        = "https://github.com/Microrobotics-Simulation-Framework/MIME/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist",
]
# NVIDIA GPU support. Without this, JAX runs CPU-only AND every @pytest.mark.gpu
# test SILENTLY SKIPS (tests/conftest.py skips them when no CUDA device is
# present) — a skipped test and a passing test look identical in a summary line.
# The analytical IBM-wall benchmarks (channel/pipe Poiseuille, Womersley) are
# gpu-marked, so without this extra the FVM wall path has NO executable physics
# coverage at all. Install with:  uv pip install -e ".[gpu]"
#
# The plugin version must match jaxlib EXACTLY (both pinned >=0.10,<0.13 above);
# a mismatched plugin fails at import with "assert cuda_versions is not None".
# The [with-cuda] extra bundles the NVIDIA runtime libs (~4 GB) rather than
# relying on a system CUDA install. Verified on an RTX A2000 (compute 8.6,
# driver 595.71.05 / CUDA 13.2): a CUDA-12 build runs fine on a CUDA-13 driver.
gpu = [
    "jax-cuda12-plugin[with-cuda]>=0.10,<0.13",
    "jax-cuda12-pjrt>=0.10,<0.13",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=2.0",
    "sphinxcontrib-bibtex>=2.5",
    "pydata-sphinx-theme>=0.14",
]
ci = [
    "pytest>=7.0",
    "pyyaml>=6.0",
]
viz = [
    "pyvista>=0.42",
]
mesh = [
    # Unstructured/body-fitted mesh I/O (Gmsh .msh reader for the FVM node).
    # Optional: the default install is dependency-light; only users reading
    # external meshes need this. (A future `gmsh-gen` extra can add the gmsh
    # SDK for programmatic helix/vessel geometry generation.)
    "meshio>=5.0",
]
runner = [
    "pyzmq>=25.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mime"]

[tool.hatch.build.targets.sdist]
include = ["src/mime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# CI-fast default: exclude `slow` tests. Run the full suite locally
# with `pytest -m "slow or not slow"` (or `pytest --runslow` if a
# helper plugin is added later).
addopts = "-m 'not slow'"
markers = [
    "verification: MIME-VER-* verification benchmarks",
    "slow: tests too expensive for CI (>30 s on CPU). Run with `pytest -m 'slow or not slow'`.",
    "gpu: tests that require a CUDA GPU (the CPU path NaNs or is impractically slow).",
    "x64: test needs jax_enable_x64=True (tighter precision); scoped per-test by conftest so it does not leak into other tests.",
]
