[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mime-engine"
dynamic = ["version"]
description = "MIcrorobotics Multiphysics Engine — domain-specific physics for microrobot simulation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [
    { name = "Nicholas Ehsan Roy" },
]
keywords = [
    "microrobotics",
    "simulation",
    "multi-physics",
    "jax",
    "differentiable-simulation",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "maddening>=0.4.2,<0.5",
    # MADDENING 0.4.2's own range, no tighter.
    "jax>=0.10,<0.13",
    "openmaterica>=0.1.0.dev3",
    "usd-core>=26.5",
    # TypedDict, ReadOnly and deprecated come from here on every supported Python.
    "typing_extensions>=4.16.0",
    "jaxtyping>=0.3.11",
    # The saved document is YAML, read with the safe loader. MADDENING depends on it too; MIME imports it itself.
    "pyyaml>=6.0",
    # `RunResult.to_mat` writes MATLAB v5 files through scipy.io.savemat. MADDENING depends on it with the same floor;
    # MIME imports it itself.
    "scipy>=1.14",
    # Remote assets are fetched on request through pooch (BSD-3-Clause), which verifies each download's sha256.
    "pooch>=1.8",
    # Where `mime credentials` keeps a token: the user's config directory. pooch already depends on it.
    "platformdirs>=3",
    # A distribution name and a version in a bundle's lock are checked against PEP 503 and PEP 440 before one is printed
    # into a `pip install` command, and `mime env check` evaluates the environment markers of the pinned requirements
    # files with it. pooch already depends on it.
    "packaging>=24",
]

[project.scripts]
mime = "mime.cli:main"

# Where a load finds the entries of a namespace a saved document names: the name is the namespace, the value the
# module whose import registers its entries. A load imports these and nothing the document itself names.
[project.entry-points."mime.entries"]
toy = "mime.testing.toys"

[project.urls]
Homepage      = "https://microrobotica.org/mime/"
Repository    = "https://github.com/Microrobotics-Simulation-Framework/MIME"
Documentation = "https://microrobotica.org/mime/"
Issues        = "https://github.com/Microrobotics-Simulation-Framework/MIME/issues"

[project.optional-dependencies]
# For mime.testing's harnesses, which build on maddening.testing.
verify = [
    "hypothesis>=6.165",
    "maddening[verify]>=0.4.2,<0.5",
]
# JAX's CUDA 12 plugin, PJRT and the nvidia-* libraries, locked with hashes in uv.lock, so that a GPU environment is
# pinned as exactly as a CPU one (`mime/data/env/requirements-cuda12.txt`).
cuda12 = ["jax[cuda12]"]

# Tooling for MIME's own development and CI, never installed by a user (PEP 735). uv installs `dev` by default.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "hypothesis>=6.165",
    # The typing gate's numbers are tied to this release, as MADDENING's and OpenMaterica's are.
    "pyright==1.1.414",
    # The packaging test builds a wheel with the declared backend.
    "hatchling",
    # The pinned requirements files are `uv export`'s output, and its bytes are tied to uv's release: CI's, which
    # tests/env/test_requirements.py holds equal to this pin.
    "uv==0.13.0",
]

[tool.hatch.version]
path = "src/mime/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mime"]

[tool.hatch.build.targets.sdist]
include = ["src/mime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's default list without "build", which would skip tests/build/ without a word.
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]
addopts = ["-ra", "--strict-markers", "-m", "not slow"]
# A JUnit report (`--junitxml`, which every CI lane writes for its durations report) gives each test its file and line.
junit_family = "xunit1"
markers = [
    "slow: too expensive for CI's default lane; run with -m 'slow or not slow'.",
    "gpu: needs a CUDA device; skips without one, and a skip looks like a pass in a summary line.",
]
