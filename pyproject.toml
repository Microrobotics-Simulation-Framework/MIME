[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mime-engine"
dynamic = ["version"]
description = "MIcrorobotics Multiphysics Engine — domain-specific physics for microrobot simulation"
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [
    { name = "Nicholas Ehsan Roy" },
]
keywords = [
    "microrobotics",
    "simulation",
    "multi-physics",
    "jax",
    "differentiable-simulation",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "maddening>=0.4.1,<0.5",
    # MADDENING 0.4.1's own range, no tighter.
    "jax>=0.10,<0.13",
    "openmaterica>=0.1.0.dev3",
    "usd-core>=26.5",
]

[project.urls]
Homepage      = "https://microrobotica.org/mime/"
Repository    = "https://github.com/Microrobotics-Simulation-Framework/MIME"
Documentation = "https://microrobotica.org/mime/"
Issues        = "https://github.com/Microrobotics-Simulation-Framework/MIME/issues"

[project.optional-dependencies]
# For mime.testing's harnesses, which build on maddening.testing.
verify = [
    "hypothesis>=6.165",
    "maddening[verify]>=0.4.1,<0.5",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
]

[tool.hatch.version]
path = "src/mime/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mime"]

[tool.hatch.build.targets.sdist]
include = ["src/mime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not slow"]
markers = [
    "slow: too expensive for CI's default lane; run with -m 'slow or not slow'.",
    "gpu: needs a CUDA device; skips without one, and a skip looks like a pass in a summary line.",
]
