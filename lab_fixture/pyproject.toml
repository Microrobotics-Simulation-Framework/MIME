[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mime-lab-fixture"
version = "0.1.0"
description = "A stand-in for a lab's package: it registers its own MIME entry from outside MIME"
requires-python = ">=3.12"
dependencies = ["mime-engine[verify]"]

# How a saved experiment that uses labx.* finds this package: a load imports this module, and nothing a document names.
[project.entry-points."mime.entries"]
labx = "mime_lab_fixture"

[tool.hatch.build.targets.wheel]
packages = ["src/mime_lab_fixture"]
