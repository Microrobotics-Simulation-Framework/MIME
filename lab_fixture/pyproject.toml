[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mime-lab-fixture"
version = "0.1.0"
description = "A stand-in for a lab's package: it registers its own MIME entry from outside MIME"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["mime-engine[verify]"]

# How a saved experiment that uses labx.* finds this package: a load imports this module, and nothing a document names.
[project.entry-points."mime.entries"]
labx = "mime_lab_fixture"

# Where MIME finds the lab's records (a package's data, read without running anything a record names), and the lab's
# own storage adapter for locations of the scheme labstore.
[project.entry-points."mime.assets"]
labx = "mime_lab_fixture.assets"

[project.entry-points."mime.asset_adapters"]
labstore = "mime_lab_fixture.assets:LabStore"

[tool.hatch.build.targets.wheel]
packages = ["src/mime_lab_fixture"]
