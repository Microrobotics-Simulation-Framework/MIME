name: CI

# Four test lanes and a typing gate. `default` installs the locked PyPI releases on every supported Python and
# blocks. The other three leave the run's conclusion alone (job-level `continue-on-error`: a failure there marks its
# own job red): `openmaterica-main` and `maddening-main` swap one upstream for its `main`, and `usd-core-newest`
# re-resolves usd-core to the newest release. v0.3's branch protection requires `default` on each Python,
# `maddening-main`, `openmaterica-main`, `typecheck` and `confidential` by these jobs' names, so a red one of them blocks
# a merge, and tests/test_ci_wiring.py holds the names and the checks' wiring. Each lane names itself in MIME_CI_LANE,
# and tests/test_ci_lane.py asserts from the installed metadata that it installed what it claims.
# Every lane also builds and installs lab_fixture/, which tests/test_lab_fixture.py and the registry walk require
# under CI. `uv sync` installs the `dev` dependency group (pytest, Hypothesis, pyright, hatchling) by default.
# `typecheck` blocks: pyright, pinned, strict over src/mime at zero errors, on a run that must be trustworthy.
# `confidential` blocks: the confidentiality scan over the tracked tree and its paths, the commits' diffs and messages
# and the branch's name.
# Every lane runs its tests on pytest-xdist workers and writes JUnit XML, and its `Test durations` step writes where
# the time went to the run page and holds MADDENING's budget (scripts/report_test_durations.py, tests/README.md): an
# unlisted test over 5 s gets a warning, and one over 20 s, once re-run alone, fails the job. Each test's JAX tracing,
# lowering and compiling are recorded beside its times (MIME_TEST_JAX_TIMING, tests/_jax_timing.py), and the report is
# uploaded as a run artifact.

on:
  push:
    branches: [main, v0.3]
  pull_request:
    branches: [main, v0.3]
  # Weekly, for usd-core-newest. GitHub runs schedules from the default branch's workflow file only.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      plant_failure:
        description: "Plant a failing canary test in every lane: the control that no lane is silently skipped"
        type: boolean
        default: false
      plant_slow_tests:
        description: "Plant an unlisted 21 s test and an unlisted 6 s test in every lane: the control that the time budget fails the job and warns"
        type: boolean
        default: false

permissions:
  contents: read

env:
  JAX_PLATFORMS: cpu
  UV_VERSION: "0.13.0"
  MIME_CI_PLANT_FAILURE: ${{ inputs.plant_failure && '1' || '0' }}
  MIME_CI_PLANT_SLOW_TESTS: ${{ inputs.plant_slow_tests && '1' || '0' }}

jobs:
  default:
    name: default (Python ${{ matrix.python-version }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      MIME_CI_LANE: default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the locked PyPI releases
        run: uv sync --locked --extra verify
      - name: Build and install the lab fixture package, registered from outside MIME
        run: uv pip install --no-deps ./lab_fixture
      - name: Report what this lane installed
        run: uv run --no-sync python tests/test_ci_lane.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tests
        id: tests
        env:
          MIME_TEST_JAX_TIMING: "1"
        run: uv run --no-sync pytest -m "not slow" -n auto --dist worksteal --junitxml="$RUNNER_TEMP/durations.xml"
      - name: Test durations
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          TITLE: "Test durations: ${{ github.job }}${{ matrix.python-version && format(', Python {0}', matrix.python-version) || '' }}"
        run: >-
          uv run --no-sync python scripts/report_test_durations.py "$RUNNER_TEMP/durations.xml"
          --allowlist tests/duration_allowlist.txt --retry-outliers --cache-mode off --title "$TITLE"
      - name: Upload the test durations
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durations-${{ github.job }}${{ matrix.python-version && format('-python-{0}', matrix.python-version) || '' }}
          path: ${{ runner.temp }}/durations.xml
          if-no-files-found: error
      # Every check of the documentation's sources (src/mime/docs/README.md): the sources' forms, the docs walk and
      # its ledger, the number rule, the citation check over the built pages, then scripts/check_anomalies.py,
      # unchanged. Its summary, each list's length, the entries whose derivative is not exact and the word-numeral
      # warnings among it, goes to the run page, and so does its wall time, the check's budget. The README start list
      # and the none-declared list are held against origin/v0.3's, fetched when the checkout lacks it.
      - name: Docs check
        if: ${{ !cancelled() }}
        run: |
          status=0
          git rev-parse --verify --quiet origin/v0.3 > /dev/null \
            || git fetch --no-tags --depth=1 origin +refs/heads/v0.3:refs/remotes/origin/v0.3
          started=$(date +%s%N)
          uv run --no-sync mime docs check --base origin/v0.3 > "$RUNNER_TEMP/docs-check.txt" 2>&1 || status=$?
          echo "the command's wall time, start-up included: $(( ($(date +%s%N) - started) / 1000000 )) ms" \
            >> "$RUNNER_TEMP/docs-check.txt"
          cat "$RUNNER_TEMP/docs-check.txt"
          { echo "### mime docs check (Python ${{ matrix.python-version }})"; echo '```'
            cat "$RUNNER_TEMP/docs-check.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # The pages, built and never committed (src/mime/docs/README.md), then scanned for a private name or path by the
      # confidentiality script copied here, over the built directory, with the same key and the same fork exception as
      # the tracked tree's scan (the pages hold text found in no tracked file), then uploaded as a run artifact. The scan
      # fails the job and the upload runs only if every step before it passed, which tests/test_ci_docs_artifact.py
      # reads. The build's wall time, start-up included, is the generation budget.
      - name: Build the documentation pages
        run: |
          failed=0
          started=$(date +%s%N)
          uv run --no-sync mime docs build --out "$RUNNER_TEMP/docs-pages" > "$RUNNER_TEMP/docs-build.txt" 2>&1 \
            || failed=$?
          echo "the command's wall time, start-up included: $(( ($(date +%s%N) - started) / 1000000 )) ms" \
            >> "$RUNNER_TEMP/docs-build.txt"
          cat "$RUNNER_TEMP/docs-build.txt"
          { echo "### mime docs build (Python ${{ matrix.python-version }})"; echo '```'
            cat "$RUNNER_TEMP/docs-build.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - name: No private name or path in the built pages
        env:
          CONFIDENTIAL_SCAN_KEY: ${{ secrets.CONFIDENTIAL_SCAN_KEY }}
        run: python3 scripts/check_confidential.py --directory "$RUNNER_TEMP/docs-pages"
      - name: Upload the built pages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-pages-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/docs-pages
          if-no-files-found: error

  openmaterica-main:
    if: github.event_name != 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      MIME_CI_LANE: openmaterica-main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the locked releases, then OpenMaterica from its main
        run: |
          uv sync --locked --extra verify
          uv pip install --reinstall-package openmaterica \
            "openmaterica @ git+https://github.com/OpenMaterica/OpenMaterica@main"
      - name: Build and install the lab fixture package, registered from outside MIME
        run: uv pip install --no-deps ./lab_fixture
      - name: Report what this lane installed
        run: uv run --no-sync python tests/test_ci_lane.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tests
        id: tests
        env:
          MIME_TEST_JAX_TIMING: "1"
        run: uv run --no-sync pytest -m "not slow" -n auto --dist worksteal --junitxml="$RUNNER_TEMP/durations.xml"
      - name: Test durations
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          TITLE: "Test durations: ${{ github.job }}${{ matrix.python-version && format(', Python {0}', matrix.python-version) || '' }}"
        run: >-
          uv run --no-sync python scripts/report_test_durations.py "$RUNNER_TEMP/durations.xml"
          --allowlist tests/duration_allowlist.txt --retry-outliers --cache-mode off --title "$TITLE"
      - name: Upload the test durations
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durations-${{ github.job }}${{ matrix.python-version && format('-python-{0}', matrix.python-version) || '' }}
          path: ${{ runner.temp }}/durations.xml
          if-no-files-found: error

  maddening-main:
    if: github.event_name != 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      MIME_CI_LANE: maddening-main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # MADDENING is private: git reads it with MADDENING_TOKEN (Contents: read), through a URL rewrite, so the
      # install records the plain repository URL and the token reaches no metadata.
      - name: Install the locked releases, then MADDENING from its main
        env:
          MADDENING_TOKEN: ${{ secrets.MADDENING_TOKEN }}
        run: |
          uv sync --locked --extra verify
          rewrite="url.https://x-access-token:${MADDENING_TOKEN}@github.com/Microrobotics-Simulation-Framework/MADDENING"
          git config --global "${rewrite}.insteadOf" https://github.com/Microrobotics-Simulation-Framework/MADDENING
          uv pip install --reinstall-package maddening \
            "maddening[verify] @ git+https://github.com/Microrobotics-Simulation-Framework/MADDENING@main"
          git config --global --remove-section "${rewrite}"
      - name: Build and install the lab fixture package, registered from outside MIME
        run: uv pip install --no-deps ./lab_fixture
      - name: Report what this lane installed
        run: uv run --no-sync python tests/test_ci_lane.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tests
        id: tests
        env:
          MIME_TEST_JAX_TIMING: "1"
        run: uv run --no-sync pytest -m "not slow" -n auto --dist worksteal --junitxml="$RUNNER_TEMP/durations.xml"
      - name: Test durations
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          TITLE: "Test durations: ${{ github.job }}${{ matrix.python-version && format(', Python {0}', matrix.python-version) || '' }}"
        run: >-
          uv run --no-sync python scripts/report_test_durations.py "$RUNNER_TEMP/durations.xml"
          --allowlist tests/duration_allowlist.txt --retry-outliers --cache-mode off --title "$TITLE"
      - name: Upload the test durations
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durations-${{ github.job }}${{ matrix.python-version && format('-python-{0}', matrix.python-version) || '' }}
          path: ${{ runner.temp }}/durations.xml
          if-no-files-found: error

  usd-core-newest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      MIME_CI_LANE: usd-core-newest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the locked releases, with usd-core re-resolved to the newest
        run: uv sync --upgrade-package usd-core --extra verify
      - name: Build and install the lab fixture package, registered from outside MIME
        run: uv pip install --no-deps ./lab_fixture
      - name: Report what this lane installed
        run: uv run --no-sync python tests/test_ci_lane.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Tests
        id: tests
        env:
          MIME_TEST_JAX_TIMING: "1"
        run: uv run --no-sync pytest -m "not slow" -n auto --dist worksteal --junitxml="$RUNNER_TEMP/durations.xml"
      - name: Test durations
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          TITLE: "Test durations: ${{ github.job }}${{ matrix.python-version && format(', Python {0}', matrix.python-version) || '' }}"
        run: >-
          uv run --no-sync python scripts/report_test_durations.py "$RUNNER_TEMP/durations.xml"
          --allowlist tests/duration_allowlist.txt --retry-outliers --cache-mode off --title "$TITLE"
      - name: Upload the test durations
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: durations-${{ github.job }}${{ matrix.python-version && format('-python-{0}', matrix.python-version) || '' }}
          path: ${{ runner.temp }}/durations.xml
          if-no-files-found: error

  # scripts/check_confidential.py, OpenMaterica's scan copied (CONTRIBUTING.md, "Confidentiality"), on the standard
  # library alone: the tracked files and their paths, the diffs and messages of the commits this event brings (on a
  # push, every commit's when the commit before it is unknown), and a pull request's branch name, public from its
  # push. A change into main leaves out v0.3's commits, public already and scanned on their way into v0.3. Without
  # the secret the scan fails, so it cannot pass having checked nothing; a pull request from a fork, which GitHub
  # gives no secrets, is the one exception, told apart by the event's payload: it checks the private paths and warns
  # that the names were not, and the push after its merge scans with the key.
  confidential:
    name: no private name or path
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No private name or path in the tracked files, the commits or the branch's name
        env:
          CONFIDENTIAL_SCAN_KEY: ${{ secrets.CONFIDENTIAL_SCAN_KEY }}
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          TARGET: ${{ github.base_ref || github.ref_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              range="$PUSH_AFTER"
              if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then range="$PUSH_BEFORE..$PUSH_AFTER"; fi ;;
            *) range="" ;;
          esac
          public=""
          if [ "$TARGET" = main ]; then public="origin/v0.3"; fi
          python3 scripts/check_confidential.py ${range:+--messages "$range" --diffs "$range"} \
            ${public:+--public "$public"} ${HEAD_REF:+--ref-name "$HEAD_REF"}

  typecheck:
    name: typecheck (pyright, Python 3.12)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          # The floor, which pyrightconfig.json's pythonVersion also names.
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the locked releases, pyright among them
        run: uv sync --locked --extra verify
      - name: Plant a type error in src/mime (the planted-failure run only)
        if: env.MIME_CI_PLANT_FAILURE == '1'
        run: |
          printf 'planted: int = "a planted type error"\n' > src/mime/_planted_type_error.py
      # scripts/typing_check.py exits 2 when the run cannot be trusted (pyright missing or another release than the
      # pin, an exit code other than 0 or 1, no JSON, too few files analysed, a core import unresolved), 1 on any
      # error, 0 otherwise; either of the first two fails the job.
      - name: pyright, strict over src/mime, at zero errors
        run: |
          set -o pipefail
          uv run --no-sync pyright --version
          uv run --no-sync python scripts/typing_check.py --markdown | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Control, a planted type error in src/mime fails the check
        run: |
          printf 'planted: int = "a planted type error"\n' > src/mime/_planted_type_error.py
          if uv run --no-sync python scripts/typing_check.py; then
            echo "::error::the typing gate passed a planted type error, so it cannot fail"
            exit 1
          fi
          rm src/mime/_planted_type_error.py
      - name: Build the wheel
        run: uv build --wheel
      - name: A consumer's code type-checks against the installed wheel
        run: |
          uv venv "$RUNNER_TEMP/consumer" --python 3.12
          uv pip install --python "$RUNNER_TEMP/consumer/bin/python" dist/*.whl
          mkdir "$RUNNER_TEMP/snippet"
          cp tests/typing/consumer_snippet.py tests/typing/pyrightconfig.json "$RUNNER_TEMP/snippet/"
          cd "$RUNNER_TEMP/snippet"
          uv run --project "$GITHUB_WORKSPACE" --no-sync pyright --pythonpath "$RUNNER_TEMP/consumer/bin/python" consumer_snippet.py
      - name: Control, the snippet is refused once a write into the read-only lock is not ignored
        run: |
          cd "$RUNNER_TEMP/snippet"
          sed 's/  # type: ignore$//' consumer_snippet.py > writes_the_lock.py
          if uv run --project "$GITHUB_WORKSPACE" --no-sync pyright --pythonpath "$RUNNER_TEMP/consumer/bin/python" writes_the_lock.py; then
            echo "::error::pyright accepted a write into the read-only lock, so the snippet's check cannot fail"
            exit 1
          fi
      - name: Control, the snippet is refused once py.typed is gone
        run: |
          rm "$("$RUNNER_TEMP/consumer/bin/python" -c 'import mime, pathlib; print(pathlib.Path(mime.__file__).parent / "py.typed")')"
          cd "$RUNNER_TEMP/snippet"
          if uv run --project "$GITHUB_WORKSPACE" --no-sync pyright --pythonpath "$RUNNER_TEMP/consumer/bin/python" consumer_snippet.py; then
            echo "::error::the snippet type-checked without py.typed, so the check above cannot fail"
            exit 1
          fi
