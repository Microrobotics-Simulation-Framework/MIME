name: Publish to PyPI

# Publishes `mime-engine` to PyPI on every published GitHub Release, a pre-release too, and attaches the release's
# documentation pages to it. Uses PyPI Trusted Publishing (OIDC) — no API token is stored in the repo; the publisher is
# configured at https://pypi.org/manage/account/publishing/ with:
#   project       : mime-engine
#   owner         : Microrobotics-Simulation-Framework
#   repository    : MIME
#   workflow      : publish.yml
#   environment   : pypi
#
# A release's tag must be `v` and the package's version (`src/mime/__init__.py`), and the distributions built from
# it of that version, or nothing is published (scripts/release.py check-tag). A run can also be started by hand from
# the Actions tab (workflow_dispatch), from the release's tag: a run from a branch is refused by the same check.
# tests/test_release_workflow.py reads this file's wiring and runs its steps with their commands stubbed.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for Trusted Publishing OIDC

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build distributions
        run: python -m build

      - name: The tag is v and the package's version, and so is every distribution
        id: tag
        run: python3 scripts/release.py check-tag --ref "$GITHUB_REF" dist/*.whl dist/*.tar.gz

      - name: Sanity-check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      # The release check: no distribution, and not the tag's tree (the GitHub release's source archive, Zenodo's
      # snapshot), holds a file whose terms let no copy be hosted, or a mesh with no record (mime assets audit).
      - name: No file that may not be redistributed in the distributions or the tag's tree
        run: |
          python -m pip install dist/*.whl
          git archive --format=tar -o "$RUNNER_TEMP/tree.tar" HEAD
          mime assets audit dist/*.whl dist/*.tar.gz "$RUNNER_TEMP/tree.tar" \
            --manifest examples/descriptions/ar4/visuals.json

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # The pages `mime docs build` writes, attached to the release as mime-docs-<version>.tar.gz (one folder,
  # mime-docs-<version>/, holding index.md, pages/ and a README.md) with mime-docs-<version>.tar.gz.sha256 beside it.
  # MICROROBOTICA's site renders the release's documentation from the asset and pins its sha256, so the name and the
  # layout are fixed (tests/test_release_workflow.py holds both). They are the tagged commit's own CI pages (the
  # artifact docs-pages-python-3.12, built with the default lane's JUnit reports) when a run of ci.yml on the commit
  # still holds them; otherwise they are built here, in the same locked environment, without the lane's reports, and
  # the asset's README.md says which.
  docs:
    name: Attach the documentation pages to the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # gh release upload
      actions: read     # the tagged commit's CI runs and their artifacts
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      UV_VERSION: "0.13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The pages of the tagged commit's own CI run, if one holds them
        id: ci
        run: >-
          python3 scripts/release.py find-pages --repository "${{ github.repository }}" --commit "${{ github.sha }}"
          --out "$RUNNER_TEMP/docs-pages"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.ci.outputs.source == 'build'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Install the locked PyPI releases, as CI's default lane does
        if: steps.ci.outputs.source == 'build'
        run: |
          uv sync --locked --extra verify
          uv pip install --no-deps ./lab_fixture
      - name: Build the pages here, without the lane's reports
        if: steps.ci.outputs.source == 'build'
        run: uv run --no-sync mime docs build --out "$RUNNER_TEMP/docs-pages"
      - name: No private name or path in the pages
        env:
          CONFIDENTIAL_SCAN_KEY: ${{ secrets.CONFIDENTIAL_SCAN_KEY }}
        run: python3 scripts/check_confidential.py --directory "$RUNNER_TEMP/docs-pages"
      - name: The asset, with a README saying where its pages came from
        env:
          SOURCE: ${{ steps.ci.outputs.source }}
          RUN: ${{ steps.ci.outputs.run }}
          CONCLUSION: ${{ steps.ci.outputs.conclusion }}
        run: >-
          python3 scripts/release.py pack-pages --pages "$RUNNER_TEMP/docs-pages" --version "$VERSION"
          --commit "${{ github.sha }}" --source "$SOURCE" --run "$RUN" --conclusion "$CONCLUSION"
          --out "$RUNNER_TEMP/mime-docs-$VERSION.tar.gz"
      - name: Attach it and its sha256 to the release
        run: >-
          gh release upload "v$VERSION" "$RUNNER_TEMP/mime-docs-$VERSION.tar.gz"
          "$RUNNER_TEMP/mime-docs-$VERSION.tar.gz.sha256" --clobber --repo "${{ github.repository }}"
