    workaround: "Run in double precision (JAX_ENABLE_X64=1) where a run is long or its rate matters, or read rates from the motor's speed rather than from its angle"
    planned_resolution: "Wrap the angle (carry it modulo a turn, with the turns counted apart), or carry it compensated (a Kahan-style sum of the increments) or in double precision; a src change for the maintainer to triage, which changes nothing in 7c2's numbers"
  - anomaly_id: MIME-ANO-125
    title: "On a CPU with two sizes of core, the MRS resistance's last bits depend on which core a process started on"
    description: >
      The MRS rung's force sums, R = M^T (A^-1 M), sum over the body's 3N unknowns. XLA:CPU takes that product, over
      both operands' first axis, through Eigen, which blocks a sum by the L1 data cache it reads off the core it first
      runs on, once per process. On a CPU with two sizes of core (Intel's hybrid parts: on the laptop it was measured
      on, the larger cores have a 48 KB L1d and the smaller 32 KB) a sum of more than 248 terms (more than 82 samples) was added in one block on one
      kind of core and in two on the other, so the resistance took one of two bit patterns per process, about 1e-16
      apart relative, and stayed with it for the process's life. A saved experiment then failed its bitwise reproduction
      in a fresh process (mime verify, the registry walk's round trips): phase 7m-a's review saw mrs_solids (its
      ellipsoid's 297 unknowns) fail 2 of 10 runs. Computed in phase 7m-a's fix round, each in fresh processes with one
      BLAS thread: on v0.3 before 7m-a (4bc1ada), a ball at 1,014 unknowns and FL-9 at 1,701 took the second pattern
      in 7 of 20 unpinned processes, and pinned to the P-cores 4 of 4 took one, to the E-cores 4 of 4 the other; on
      7m-a before the fix, the same and the ellipsoid alike (9 of 20); mrs_solids saved on one kind of core and loaded
      on the other failed 6 of 6. The core's kind decided it, not the CPU count (1, 4, 8 and 16 CPUs alike), the hash
      seed, the sampler, or XLA's flags (multi-threaded Eigen off, fast math off, platform-dependent math off, XNNPACK
      off: each left it). Every sum up to 248 terms matched across the core kinds and every one from 249 differed,
      except at 377 and 384, where Eigen's blocking rule gives both the same blocks; that rule, with those two cache
      sizes, predicts all twelve depths measured (the rule is inference from Eigen's published blocking heuristic; the
      library inside jaxlib was not read). The rung's numbers are right to rounding either way; what failed is the
      promise that a run reproduces bit for bit.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      No value moved beyond rounding (1e-16 relative), so no physical result is wrong. What it breaks is a check: a
      bitwise reproduction (mime verify, a saved folder's round trip) failed on a correct result on a hybrid-core
      machine, which teaches a user to ignore a reproduction failure; and a long or chaotic run can carry the first
      difference far. Where a result is accepted on its bitwise reproduction, it depends on the machine.
    resolution_status: resolved
    affected_versions: ">=0.3.0.dev0"
    resolution_version: "0.3.0.dev1"
    affected_components:
      - "drag (rung mrs), MRSDragNode: mime.nodes.hydro.mrs.resistance's force sums"
    verification:
      - "tests/oracles/test_mrs_force_sums.py::test_every_product_in_the_compiled_mrs_step_sums_at_most_depth_terms"
      - "tests/oracles/test_mrs_force_sums.py::test_every_product_in_the_compiled_resistance_sums_at_most_depth_terms"
      - "tests/oracles/test_mrs_force_sums.py::test_a_sum_no_longer_than_depth_is_the_product_it_was_bit_for_bit"
      - "tests/oracles/test_mrs_force_sums.py::test_a_longer_sum_equals_the_product_to_rounding"
      - "tests/oracles/test_mrs_force_sums.py::test_control_the_product_taken_whole_is_found_by_the_scan"
      - "tests/saved/test_registry_walk.py::test_every_case_round_trips_through_a_fresh_process"
    residual_risk: "CI's runners have one size of core, so no test there can show that two processes' bits differ; the tests hold the cause (no product in the compiled MRS step sums more than 248 terms), and the cure was measured on a hybrid laptop (50 of 50 fresh processes, and 5 pinned to each kind of core, bitwise equal on all three bodies; mrs_solids saved on one kind and loaded on the other 10 of 10). 248 is the block Eigen takes in float64 with AVX2 on a 32 KB L1d (in float32 its block is longer); a CPU whose smaller cores had a smaller L1d, or wider vectors on both kinds, would need a shorter piece. The other products in MIME that contract over both operands' first axis (a chain's links, a 3 x 3 frame) sum a few terms, surveyed and not tested"
    workaround: "Before the fix, pin a process to one kind of core (taskset) where its bits are compared with another's"
    planned_resolution: "Done in phase 7m-a's fix round: mime.nodes.hydro.mrs.force_sums sums over the samples in pieces of at most DEPTH (248) terms, added in order, so a sum of up to 248 terms is the product it was, bit for bit, and a longer one is the same on either kind of core"
  - anomaly_id: MIME-ANO-126
    title: "On a smooth convex body the quasi-uniform sampling's MRS drag is further from the closed form than the polar grid's at the same count"
    description: >
      The sampling suite's spacing metric predicts the MRS matrix's conditioning, not its drag error. At the same count
      and blob 0.5, in float64, the rung's drag on a sphere or an ellipsoid sampled quasi-uniformly (the sphere 0.2.0,
      the ellipsoid 0.1.0) is further from its closed form than on the polar grid the sphere's first version sampled
      by. Each figure is the mean of the diagonal's three entries against the closed form (Stokes's law; Oberbeck's and
      Edwardes's for the ellipsoids, Kim and Karrila's chapter 3), computed in phase 7m-a's review, the grid's first:
      the sphere in translation +2.41% against +3.13% at 128 samples, +1.30% against +1.78% at 338, +0.61% against
      +0.90% at 1,152 and +0.34% against +0.52% at 3,160, in rotation +4.92% against +5.89% at 338; the ellipsoid of
      semi-axes 0.5, 0.7 and 1.1 mm +1.68% against +2.25% at 252 and +0.52% against +0.77% at 1,692 (rotation +6.15%
      against +6.88% at 252); that of 1, 0.6 and 0.25 mm +1.45% against +2.16% at 312 and +0.46% against +0.75% at 2,170.
      The grid's miss is 0.61 to 0.77 times the quasi-uniform sampling's. It is not the grid's symmetry: the ratio is
      the same on the triaxial ellipsoids, turning the quasi-uniform set changes nothing (0.01 points), and Fibonacci
      points, which share no code with the sampler, give the quasi-uniform numbers to 0.03 points. In float32 neither
      loses anything to its conditioning at this blob (both within 1e-6 of float64). On the screw, a body without that
      smoothness, the quasi-uniform sampling is 2.5 times closer to a converged free-space reference (-3.4% against
      -8.5%). The sphere's two-resolution extrapolation still meets Stokes's law within its oracle's 0.5%.

      **Drag 0.4.0 (phase 7m-b) takes the point forces out of the comparison.** On its separated quadrature the
      sphere's drag at the defaults (338 force points, the blob a tenth of their spacing, the quadrature twenty times
      finer) is +0.50% from Stokes's law and +1.45% in rotation, and within the oracle's tolerance of the exact
      regularised drag at its blob (tests/oracles/test_mrs_separated.py): what remains is the regularisation's, which
      the sampling does not set. The comparison above holds for drag 0.3.0's point forces, and for 0.4.0 with
      quadrature_refinement=1.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A smooth body's drag at a coarse spacing is a few tenths of a per cent further from its closed form than it was
      before phase 7m-a, in the conservative direction (more drag), and it converges as the spacing falls. A result
      read at one coarse spacing on a sphere or an ellipsoid carries that error, which a spacing ladder shows.
    resolution_status: open
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "the sphere 0.2.0 and the ellipsoid 0.1.0's sampling (mime.scene.quasi_uniform), read by the MRS rung"
    verification: []
    residual_risk: "Measured on the sphere and two triaxial ellipsoids in free space; the capsule's hemispherical caps and a smooth body near a wall were not measured"
    workaround: "Read a smooth body's drag from a spacing ladder (the two-resolution extrapolation meets Stokes's law within 0.5%), not from one coarse spacing"
    planned_resolution: "Kept as a labelled default of phase 7m-a's fix round (design #195: one sampler for every kind, the sphere the default sampler's only closed-form drag oracle), the maintainer's to overturn; the separated quadrature (phase 7m-b) chooses the defaults again"
  - anomaly_id: MIME-ANO-127
    title: "A quasi-uniform sampling chooses other samples when an experiment is rebuilt at a slightly moved setting, and the MRS resistance steps"
    description: >
      Quasi-uniform sampling's choice is discrete (each sample one of the quadrature's, chosen by farthest points and
      Lloyd's relaxation), so it is not continuous in the kind's settings. On FL-9 at 416 samples (computed in phase
      7m-a's review), its wavenumber moved by 1e-5 of itself chooses again, and the MRS resistance moves by 0.37% of
      its diagonal, a thousand times its smooth change with the choice held (3e-6); within 1e-3 of the wavenumber the
      steps reach 0.42%, and the modulation steps alike. The grid kept from before keeps its count and moves smoothly,
      and the sphere's choice scales with its radius exactly, so it does not step. Within one build the choice is held
      (the MRS node holds it as constructor data, as it holds its counts), so a derivative through the build is the
      discretisation's, and exact.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A study that builds again at moved settings (an optimisation's outer loop, a sweep of rebuilt experiments, a
      difference taken across two builds) sees steps a thousand times the smooth change, which can stall an optimiser
      or read as a sensitivity that is the discretisation's.
    resolution_status: open
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "mime.scene.quasi_uniform; the sphere 0.2.0, the capsule 0.2.0, the screw 0.3.0, the cylinder, the box, the ellipsoid and labx.bead's sampling, read by the MRS rung"
    verification: []
    residual_risk: "Measured on FL-9's wavenumber and modulation at one count; other kinds and settings step alike by the same mechanism, unmeasured"
    workaround: "Take derivatives within one build, through the node's params, where the choice is held; or read a rebuilt study's steps as the discretisation's error"
    planned_resolution: "A design choice for the maintainer before the optimisation pilot (#179): carry one build's choice into another (nothing public does yet; the rebuild-by-difference checks hold it with a test's helper), or a sampler continuous in its settings (Lloyd's steps with an exact projection)"
  - anomaly_id: MIME-ANO-128
    title: "The screw's hull query is an envelope: it overstates the screw's reach, and its farthest point is not on the body"
    description: >
      The screw kind's reach is the cylinder of its crests, which holds the body: exact along its axis and across it,
      and between them beyond the body. On FL-9 it overstates by up to 0.1458 of its enclosing radius (0.623 mm, 48
      degrees from the axis), the supremum over every direction (computed in phase 7m-a's fix round from the section's
      own support turned along the body: tilts by a quarter degree and rolls by half a degree, the worst refined by
      local maximisation, within 1.5e-5 of the size of a 748,370-point quadrature's brute force; the review's grid of
      81 tilts by 360 rolls found 0.1456, the sampling suite's 75 directions 0.138). By tilt from the axis, the worst
      over roll is 0.019 at 5 degrees, 0.057 at 15, 0.110 at 30, 0.145 at 45, 0.134 at 60, 0.087 at 75, 0.035 at 85
      and 0 at 90. The declared `reach_envelope` is 0.16, that supremum with a tenth more. Its gradient, the envelope's
      farthest point, lies 1.1 to 1.7 mm from the body's own farthest point at tilts from 5 to 85 degrees (the review).
      At script A's tube, FL-9 floored may tilt 18.94 degrees by the envelope and 18.95 to 21.56 by its body, by roll.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      As a bound it is conservative: a containment check by it refuses a tilt the body would fit. A contact that
      applied its force at the envelope's farthest point would turn the body about a point off it, by a lever arm
      wrong by up to 1.7 mm on FL-9.
    resolution_status: open
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "the screw kind's reach (mime.scene._screw), Geometry.reach"
    verification:
      - "tests/saved/test_sampling_walk.py::test_every_kind_reaches_as_far_as_its_body_and_no_further"
      - "tests/saved/test_sampling_walk.py::test_every_kinds_own_body_reach_holds_its_body_from_its_samples"
    residual_risk: "The supremum is FL-9's; another screw's settings may overstate by more than the declaration, which the suite checks only on the declared settings"
    workaround: "Take a contact's point from mime.scene.body_reach (the body's own quadrature samples), which never overstates the reach and whose gradient is a sample of the body; use the envelope as a broad-phase bound"
    planned_resolution: "The containment contact (phase 7o) takes body_reach, or an exact support function of the screw"

  - anomaly_id: MIME-ANO-129
    title: "A rigid body with three different inertias gained kinetic energy from its explicit gyroscopic term (rigid_inertial 0.2.0), and an undamped rig went non-finite"
    description: >
      rigid_inertial 0.2.0 took the gyroscopic term -omega x (I omega) as an explicit load, so that Euler's equations
      were integrated by forward Euler: a torque-free body of inertias (1.0, 1.2, 0.8) x 1e-10 kg m^2, spinning at about
      200 rad/s, gained kinetic energy at every step, 2.62 times its energy in a second at a 1 ms step (angular momentum
      1.61 times), 1.53 at 0.5 ms, 1.22 at 0.25 ms and 1.08 at 0.1 ms (computed on the node alone, float64): first
      order in the step. Where nothing damps the body the gain compounds with the rotation (the term is cubic in the
      rate) until it overflows. The live test rigs, a body in a rotating field with no drag, stopped being finite at
      t = 4.435 s in a batch run in float32 (the run's refusal, run.non-finite, first in the body's pose; a live session
      stopped at 4.448 s, the end of the 16-step chunk, with every frame before it equal to the batch run's state bit
      for bit) and at 4.298 s in float64; at a step of 0.5 ms, 0.25 ms and 0.1 ms the same rig stayed finite for 6 s
      with its angular rate bounded near 220 rad/s. Found by two agents (the live session's test, and the review of
      phase 7n), who each took it for the rig's. A body of equal moments is unaffected: the term is exactly zero for it.
      Fixed in rigid_inertial 0.3.0; 0.2.0 stays registered (mime.dynamics.body.KEPT) so that a folder saved with it
      loads and reproduces, and it still gains the energy. The frozen register's scripts (scripts/sim2real) are pinned
      to 0.2.0, as the 7j register's amendment records: its x4.32 transverse-inertia arm moved from 3.20686 to 3.20747
      mm/s (+0.019%) on the first version of the fix, made inside 0.2.0.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A body with a drag resistance is damped implicitly, which hides the gain below the damping; a body whose drag is
      absent or small (a rig in vacuum, a test fixture, a low-viscosity limit) gets a rotation whose energy is wrong
      by an amount that grows with its rate and the step, and a run that ends in NaN is at least visible but one that
      has gained energy and not yet overflowed is not. Every rotating body of unequal inertias was affected, by an
      error first order in the step.
    resolution_status: resolved
    affected_versions: ">=0.3.0.dev0"
    resolution_version: "0.3.0.dev1"
    affected_components:
      - "dynamics rigid_inertial 0.2.0, RigidInertialNode"
      - "dynamics rigid_inertial 0.3.0, RigidInertialMidpointNode"
    verification:
      - "tests/oracles/test_gyroscopic_energy.py::test_a_torque_free_body_keeps_its_energy_and_the_magnitude_of_its_angular_momentum"
      - "tests/oracles/test_gyroscopic_energy.py::test_control_the_term_taken_explicitly_gains_energy_on_every_spin"
      - "tests/oracles/test_gyroscopic_energy.py::test_the_direction_of_the_angular_momentum_drifts_first_order_and_bounded"
      - "tests/oracles/test_gyroscopic_energy.py::test_a_spin_started_near_the_middle_axis_flips_at_the_elliptic_period"
      - "tests/oracles/test_gyroscopic_energy.py::test_control_the_term_taken_explicitly_flips_at_the_wrong_period"
      - "tests/oracles/test_gyroscopic_energy.py::test_an_isotropic_body_steps_as_the_term_explicit_does_bit_for_bit"
      - "tests/oracles/test_gyroscopic_energy.py::test_control_the_jacobian_from_the_world_inertia_moves_an_isotropic_body"
      - "tests/live/test_rigs_finite.py::test_each_rig_runs_ten_seconds_with_every_field_finite"
      - "tests/live/test_rigs_finite.py::test_control_the_gyroscopic_term_taken_explicitly_stops_the_tracked_rig_being_finite"
      - "tests/differential/test_frozen_register_pins.py::test_the_transverse_inertia_arm_reproduces_the_registers_speed"
    residual_risk: "The scheme is one linearised Newton step of the implicit midpoint rule on Euler's equations: second order for the gyroscopic term alone, with no secular drift. It keeps the torque-free body's kinetic energy to 2.3e-4 and the magnitude of its angular momentum to 1.2e-4 at a 1 ms step over a second at 200 rad/s (5.9e-5 and 2.9e-5 at 0.5 ms), and the stable axes neutral; a spin started near the middle axis flips at the elliptic period to second order (the mean spacing of the flips off by 1.1e-4 at 1 ms). The direction of the angular momentum in the world is first order in the step and bounded: it wobbles by 1.99 degrees at 1 ms and 0.99 at 0.5 ms, flat over 20 s, because the pose turns by the rate at the end of the step. With a load the body is still first order, by the resistance and the loads taken at the start of the step. A rotation rate times the step of order one is not resolved and nothing refuses it: the torque-free energy error of the 206 rad/s body grows as its square (2.2e-4 at |omega| dt = 0.2, 1.4e-3 at 0.5, 5.5e-3 at 1, 2.2e-2 at 2, 0.10 at 4, 1.2 at 10), so a run past about 0.5 (the line the entry's limits state, a declaration from that measurement on one body) finishes finite and wrong; the run's non-finite check does not fire there (it did, by overflow, for the explicit term at 3.7). The step's matrix, M/dt + R - K/2, is no longer symmetric for a body of unequal moments (by about |omega| dt/2 times the spread of the moments over their mean, 1% for the screw of the live rigs at 0.5 ms): the held-contact formula needs no symmetry, but a solve that assumes M/dt + R symmetric positive definite (phase 7o's hull contact, which reads the node's mass matrix) does not hold for it. A folder saved with rigid_inertial 0.2.0 and a body of unequal moments keeps the gain"
    workaround: "Use rigid_inertial 0.3.0 (the default); with 0.2.0, a step small enough that the rate times the step is well below one, or a drag resistance on the body"
    planned_resolution: "Done: the gyroscopic term is linearly implicit at the midpoint, (M/dt + R - K/2) dV = F - R V with K its Jacobian in the twist formed in the body frame (zero for an isotropic body, which steps as before bit for bit), as rigid_inertial 0.3.0, with 0.2.0 kept; the rig test holds ten simulated seconds of every live rig. Open, for phase 7o: its hull contact reads the step's matrix as symmetric"

  - anomaly_id: MIME-ANO-130
    title: "On the MRS rung a wall's image is taken at the force points: near the wall the confined resistance can be indefinite, and in the tube the confinement's effect converges more slowly than the free part"
    description: >
      Drag 0.4.0 integrates the free part of the regularised-Stokeslet matrix on the kind's quadrature, finer than the
      force points, and adds a wall's correction at the force points alone, each cell's force placed at its force
      point (the cost of a step is the wall's reads at every pair of force points and the solve). Measured in phase
      7m-b (scripts/default_spacing_table.py, float64, the blob a quarter of the force spacing, the quadrature eight
      times finer): FL-9 on the axis of the walk's 1/4 in tube, its speed per turn in the tube over its speed in free
      space at the same force points is 0.9707 at 206 force points (0.83 mm), 0.9738 at 283, 0.9884 at 416, 0.9979
      at 567, 1.0154 at 957 and 1.0273 at 1,714 (0.3 mm), still rising; over the same counts the free-space speed
      meets the shipped free-space reference within -6.1% to +0.1%. So at the coarse counts a first run takes, the
      tube's own effect on the speed (a few per cent) is mis-estimated by more than its size, and the speed in the
      tube is further from its finest spacing (estimates against a finest, 0.16 mm, still moving: -13.0% at 206 force
      points, -11.3% at the default's 222, about -12% against a fit of the ladder) than the free part is from its
      reference.

      **Near the wall the confined resistance can be indefinite, on the point forces too.** The measure, the node's
      and every number here: the least eigenvalue of the resistance with each row and column scaled by the square
      root of its diagonal entry's magnitude (a congruence, so its sign is the resistance's definiteness). Phase
      7m-b's review mapped FL-9 in the 1/4 in tube at 297 poses (spacings 0.3 to 0.829 mm; the separated quadrature
      at its defaults, under-refined, at blobs 0.1 and 0.5, and drag 0.3.0's point forces; gaps from the wall 0.05 to
      0.8 mm; rolls 0 to 7 pi / 8): 53 were indefinite, every one with the body within half a force spacing of the
      wall (the largest gap exactly half, at 0.6 mm), among them 0.3.0's point forces at every spacing mapped (-7.38
      at 0.4 mm, roll pi / 8). The fix round mapped 96 more between 0.55 and one force spacing, at eight rolls each,
      all definite (least +0.14), and the 1 mm sphere from a tenth of a spacing to one, definite. Within that band
      the sign is not a smooth function of the pose: at 0.4 mm on the defaults, centre offsets of 0.9995, 0.9998 and
      1.0000 mm on the floor give +0.42, -9.38 and -6.53, so a number quoted for a pose there holds for that pose only.
      The surrogate generator's case (FL-9 0.2 mm from the floor at its nearest point, 0.6 mm, blob 0.5, the
      quadrature four times finer) is -6.80, with every read of the table accepted (its own metric, the least
      eigenvalue over the largest entry, gave -0.64); on 0.3.0's point forces at that pose +0.79. Script A's
      experiment on the separated quadrature at the screw's defaults (0.829 mm, 222 force points), resting on the floor
      at the contact's 0.1 mm margin with the field turning from rest, builds (+0.34 at its first step) and its
      resistance turns indefinite at step 10 (t = 5 ms), evaluated at the pose the body had after step 9 (roll 0.024
      rad); unchecked, the drag put energy into the body at steps 10 and 12 and the state stopped being finite at
      step 13 (float32; float64 the same at step 10, and at 15). Even where the floor's resistance was definite the
      default's speed per turn ranged from -1,422 to +691 um, against about 600 at script A's frozen point (0.178 mm).

      **The mechanism, tested.** The review integrated the image over each cell as the free part is (the sum over a
      cell's quadrature points of G(x_m, y_q) w_q), its rebuild of the node's own step matching the node to 3e-15 to
      2e-10 as its control: at 0.4 mm (the floor a quarter of a spacing away) all eight floor rolls became definite
      (+0.74 to +0.77) and the speed 585 to 630 um per turn, the frozen point's; at 0.829 mm (an eighth) three of eight
      stayed indefinite. So the image's one point per cell is the cause from a quarter of a spacing up, and not the
      whole cause at an eighth, where the confined mobility's symmetric part is itself indefinite on nearly every
      setting mapped.

      **The image integrated over each cell, as built (the fix round, design #204).** The wall kind's image is a
      kernel between any targets and any source cells, and the step integrates it over each force point's cell on a
      quadrature wall_refinement times finer than the force spacing, each cell's weights scaled to its free area
      (unscaled, a coarse wall quadrature's cells differ in area from the free part's, and on the axis at 0.829 mm the
      speed per turn read 380 um against 298). FL-9 in the 1/4 in tube at the screw's defaults, float64: on the axis
      at 0.829 mm the speed per turn is 283.8 um with the image at the force points, 299.2 at wall_refinement 2 (on
      FL-9's grid 3, 2,014 points; 2 leaves cells empty), 298.5 at 4 and 297.6 on the whole quadrature (14,488, the
      review's test); at 0.4 mm 308.9, 311.5, 312.5 and the review's 312.1. On the floor 0.1 mm from the wall at
      0.4 mm, a quarter of a spacing: indefinite at one roll of eight with the image at the force points (-2.87),
      definite at all eight at 2 (the least +0.02, the rest +0.62 to +0.78; the speed per turn 564 to 628 um against
      the frozen point's 587 to 624), indefinite at two of the first four rolls at 4 (-1.35, -13.1) and definite at
      all eight on the whole quadrature (the review). At 0.829 mm, an eighth of a spacing: indefinite at two rolls of
      eight at the force points, three at 2, seven at 4 and three on the whole quadrature. So the integration does
      not converge monotonically in the wall's refinement near the wall (4 was worse than 2 and than the whole
      quadrature at both spacings, not explained), and at an eighth of a spacing no refinement measured is definite.
      A step costs 0.13 s at the force points, 1.4 s at 2, 2.6 s at 4 and 8.7 s on the whole quadrature at 0.829 mm,
      and 1.8 s, 27 s and 41 s at 0.4 mm (a 24-thread laptop CPU). The default is 2 for a body a contact holds off the
      wall. The gap bound with the image in place, wall_refinement 2, eight rolls at each gap: indefinite at some roll
      at 0.15, 0.2 and 0.25 force spacings (the largest 0.25 at 0.6 mm, -3.14), definite at every roll at 0.3 and 0.36
      at 0.6 and 0.829 mm. So a held body's default force spacing keeps its closest approach CONFINED_GAP, 0.36, force
      spacings or more from the wall, and a body nothing holds off takes the image at the force points. Definite is not
      accurate there: at 0.829 mm and 0.36 spacings the speed per turn was 411 to 460 um, and at 0.6 mm 455 to 483,
      against about 600 at script A's frozen point.

      **What the node does (phase 7m-b's fix round).** On the separated quadrature with a wall, every step judges its
      resistance before the body takes it: one that is not positive definite where the wall's reads were accepted is
      replaced by NaN, so that the run stops at that step with drag.mrs-indefinite, naming the step, the pose, the
      body's least distance from the wall and a force spacing that clears it (twice that distance), and the drag puts
      no energy in; a step with the body within one force spacing of the wall raises near_wall, and one whose
      resistance drops more than a twentieth of itself to its symmetric part raises asymmetric (0.007 to 0.012 on the
      tube's axis, 0.24 to 0.46 on its floor at 0.829 mm). The build refuses a resistance indefinite at the body's
      starting pose (drag.mrs-resistance) and reports the body's distance from the wall at its start and the spacing
      the experiment's closest approach needs. Drag 0.3.0's point forces, kept for the frozen register and the
      surrogate generator, have no step check; the generator checks each of its cases.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A screw's speed in a tube read at a coarse spacing is off by about a tenth, and the share the wall contributes
      is not resolved; a study that compares confined with free swimming at one coarse spacing reads the wall's
