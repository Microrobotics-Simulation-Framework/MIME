      shallower than the body's deepest, by up to 26 um; at the default 0.1 mm none by 0.5 um. The first fix (#116 at
      b4b6682) started each group from two places, its nearest and the next nearest apart from it, and kept the
      deeper: enough for FL-9, not for every screw the kind admits at a spacing the guard admits. Over 10,000 poses each
