  - anomaly_id: MIME-ANO-138
    title: "In float32 the first build of the screw in a process held the cap samples in float64 and every later build the same samples rounded to float32, so one program took two answers"
    description: >
      The screw's cap patches are sampled from a layout of rings (mime.scene._caps.cap_rings) that the process caches,
      three numpy arrays (the rings' fraction, angle and share) handed to every caller as the same objects. The MRS
      node makes the held part of its resistance once per build, in float64 whatever the run's precision (with a wall,
      the free part's matrix), from the screw's samples converted with x64 on. In float32, the first build in a process
      converted those arrays with x64 on before any step had been traced, and held the float64 samples. The step is
      traced with x64 off, and after that trace a conversion of the same arrays with x64 on, in a later build, came back
      as float32 values: the cap points were 2.0e-7 of themselves from the first build's and the cap weights 3.5e-7, so
      the held matrix of every later build was made from samples rounded to float32. The two matrices are both valid
      discretisations of the same body; the first is the one the code means. A float32 solve carries 1e-7 in the matrix
      to about 1e-5 in the resistance, so the same program built twice in one process differs between its first build
      and the rest from step 0. In float64 there is nothing to round and the builds are the same.

      The mechanism, as far as it was measured (at MIME's level): jnp.asarray with x64 on returned float32 for the same
      ndarray object the traced step had used under x64 off; a copy of it, jax.device_put of it, or jax.clear_caches()
      each gave float64; the cached arrays themselves are unchanged (bytes, dtype, read-only flag). It was not reduced
      to a case without MIME (the builder's and the review's variants all stayed float64), so it is not attributed to
      JAX in general.

      Measured (examples/screw_in_tube.py as written: FL-9 on the axis of the tube in glycerol, 1 Hz, 5 mT, the MRS drag
      with the tube's wall kind, dt 100 ms, 3 s; three fresh processes, three builds each, every history array compared
      byte for byte): in float32, 11 of 28 arrays differ between the first build and the second, first at step 0, the same
      11 and the same sizes in all three processes: the drag's resistance by at most 2.07e-5 (its first entry is 1.878
      N s/m), its asymmetry by 4.7e-8 at step 0, its least eigenvalue by 6.6e-7, the distance swum by 2.9e-11 m; the
      second and third builds are identical in every array. In float64 none differ, in three of three processes. Each
      of these changed alone, with the layout handed out as before, left the first build's difference as it was: a
      trivial jitted call before the first build; the tube's table compiled for the run's dtype before it; the
      compilation cache cold and then warm in a second process; one BLAS thread. The held matrix's inputs (the samples)
      differ between the first and later builds and nothing else does: the table's leaves, the viscosity, the blob and
      the placement are the same bytes in every build. With the cached layout cleared before each build, or handed out
      as copies, every build holds the first build's matrix. The cylinder, whose caps take the same layout
      (mime.scene._solids), was exposed too: a cylinder in the same tube, three builds in a fresh float32 process, 9 of
      28 history arrays differed before the fix (the resistance by 7.75e-6) and none after.

      What the user meets. In a script, the process's first build is run, the experiment is saved, and that run is
      compared with the reference the save wrote (the reference is made on a later build): in float32 with the layout
      as it was, the comparison reports the run moved, on the drag's resistance (by 2.5e-5, first at step 0) and on
      every quantity downstream of it (asymmetry, least eigenvalue, wall gap, the torque, the swim speed, the pose and
      twist); built.verify() on the same object is clean. With the fix both are clean (the last two tests below).

      What it does not do: it does not make mime verify report a difference. Experiment.save and BuiltExperiment.verify
      each run the reference on a graph constructed afresh from an already-built experiment, so each is a later build
      (read: Experiment._fresh_history), and Experiment.load builds once before the user's .build(), so a loaded
      folder's build is never a process's first build (measured, legacy layout, float32 fresh process: the held matrix
      of Experiment.load(folder).build() is the later builds' 739c87ab4635, a script's own first build 7901d110c69a).
      The four arrangements first run for this entry, in float32 in fresh processes (saved from a second build and
      verified by a load in a fresh process; saved from a first build and verified after a discarded build; and two
      same-kind controls), all reproduced the 8 steps bit for bit; they were described as mixing first and later
      builds, and by the above each was a later build against a later build, which is the reason they agree. That
      mime verify is unaffected stands, for that reason.

      Severity: minor. The resistance differs by about 1.1e-5 relative (2.07e-5 on 1.878), about 90 float32 epsilons,
      from inputs that differ by 2 to 3 epsilons (2.0e-7 and 3.5e-7), amplified by the solve's conditioning (about 90
      times). It stays minor because both held matrices are valid discretisations of the same body, the difference is
      three orders under the rung's discretisation error (a few per cent), and the distance swum differs by 2.9e-11 m
      in 3 s: a reproducibility defect, not an accuracy one. It bounds nothing about the rung's accuracy; what it breaks
      is the claim that one program builds to one answer.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      No physical result is wrong: the held matrix of a later build is made from samples rounded to float32 (1e-7 of
      themselves), where the first build's are in float64. What is lost is the build's reproducibility in a process: a
      comparison of two runs of one program at bit level, in float32, depends on how many builds the process had made.
    resolution_status: resolved
    affected_versions: ">=0.3.0.dev1, <0.3.0.dev2"
    resolution_version: "0.3.0.dev2"
    affected_components:
      - "node: MRSDragNode; the held part of the resistance (held_in_body_frame), built from the screw's cap samples"
      - "entry: geometry screw 0.1.0; the cap patches' layout (cap_rings)"
    verification:
      - "tests/oracles/test_mrs_builds_alike.py::test_three_builds_hold_the_same_matrix_in_float32[screw]"
      - "tests/oracles/test_mrs_builds_alike.py::test_three_builds_hold_the_same_matrix_in_float32[cylinder]"
      - "tests/oracles/test_mrs_builds_alike.py::test_control_the_layout_as_one_cached_array_makes_the_first_build_differ_from_the_rest[screw]"
      - "tests/oracles/test_mrs_builds_alike.py::test_control_the_layout_as_one_cached_array_makes_the_first_build_differ_from_the_rest[cylinder]"
      - "tests/oracles/test_mrs_builds_alike.py::test_the_first_build_of_a_process_run_agrees_with_the_reference_it_saves"
      - "tests/oracles/test_mrs_builds_alike.py::test_control_the_first_build_saved_with_the_layout_as_one_cached_array_fails_verify_from_step_0"
    residual_risk: >
      What is measured: the screw on the tube's axis at 2 mm in the tests (a fresh process each) and at 0.7 mm by hand,
      and a cylinder in the same tube, on one machine and one JAX (0.12.0.1). What is not: the mechanism inside JAX,
      beyond the statement above; it was not reduced to a case without MIME.

      The same exposure class (a numpy array the process keeps and hands to both a float64 precompute and a float32
      traced step) was checked in src/mime by reading, not by a proof that nothing else is exposed. The module-level
      numpy arrays are _HERMITE and _LINEAR (core/tables/_compile.py), ODD_IN_ANGLE and ODD_ALONG
      (nodes/hydro/mrs/_tube.py), CANONICAL (surrogates/generator.py) and _ENTRY_AT, _IN_LOWER_TRIANGLE and
      _ON_DIAGONAL (surrogates/_cholesky_mlp.py); the cached functions are cap_rings (this entry) and tube_table_from
      (a Table of float64 arrays that the held matrix's precompute and the step both read), the others returning
      records, bytes, floats or a manifest. Read: every constant above holds small integers or booleans, which are the
      same in float32 and float64, so a stale float32 conversion of one would change no value. Measured, after the fix,
      in a fresh float32 process, three builds, every history array compared byte for byte: the screw in the tube 0 of
      28 differ, script A (the surrogate drag, so the MLP's constants) 0 of 19, the sphere settling in the tube (the
      table and its parity constants) 0 of 27, tutorial A0 0 of 29, a cylinder in the tube 0 of 28 (9 before the
      fix); the control arm, the same probe with the cap layout handed out as it was, shows 9 of 28 differ for the
      screw. No other array was exposed on those programs, so nothing else was changed. Not done: every jnp.asarray of
      a reused numpy object in src/mime, or any program the five above do not run.
    workaround: "Run in float64, or build the experiment once more before the run that is compared (the second build on)"
    planned_resolution: "Done: cap_rings hands every caller its own copies of the cached layout's arrays, so no conversion of them is shared between builds"

  - anomaly_id: MIME-ANO-139
    title: "The uniform rotating field's phase is the present frequency times the time since the start, not the integral of the frequency, so a frequency changed during a run turns the field at the wrong rate and jumps its angle"
    description: >
      UniformRotating 0.1.0 (node UniformRotatingNode) makes the field's angle at step n as 2 pi f_n t_n, the frequency
      commanded at that step times the time since the start (t_n = n dt), not as 2 pi times the integral of the frequency
      over the run. The node's own assumptions say so ("the phase is the present frequency times the time since the
      start, not the integral of a frequency that changes"); nothing in the build or the run refuses or flags a frequency
      that changes. For a frequency that does not change the two are the same: 2 pi f t. For one that does, the field
      turns at 2 pi (f + t df/dt) instead of 2 pi f. A linear ramp from zero (f = k t) turns the field at 2 pi (2 k t),
      twice the commanded rate and twice the commanded angle at every time (arithmetic). A step from f1 to f2 at t_s
      turns the field at the commanded rate before and after, since the rate d/dt (2 pi f t) is 2 pi f where f is constant,
      but moves its angle by 2 pi (f2 - f1) t_s in the step that makes the change, a jump the field does not make at any
      rate, and keeps that offset from the integral for the rest of the run: of 0.8 of a turn for f1 = 1 Hz, f2 = 2 Hz,
      t_s = 0.8 s.

      Measured through the built graph, in float32 (tests below): a controller written for the purpose commands the
      field's frequency each step; the field's direction is read from the recorded flux density. With a constant 1 Hz the
      angle is 2 pi f t to float32's rounding (the control). With a ramp of 2 Hz per second over 1 s, the angle is
      2 pi f(t) t to the same rounding and 2.00 (within 0.5 %) of 2 pi times the sum of the commanded frequency over the
      steps (the integral): 2 turns where 1 was commanded. With a step from 1 to 2 Hz at 0.8 s (the 800th step) the angle
      matches the integral before the step and matches it plus 2 pi (f2 - f1) (799 dt) = 0.799 turn after it, to the same
      rounding; the rates before and after are 1.0000 and 2.0000 Hz.

      Who it touches (read from the declarations and the tree on the development branch): only a frequency that
      changes in a run. The shipped drive is the constant (drives.Constant), the only drive entry; script A, the
      screw in a tube and tutorial A's notebook declare a constant (10 Hz, 1 Hz and the notebook's one number, changed
      between runs); a live session's `set` changes only a live input a controller
      declares, and the one shipped controller, ArmTracking, writes a joint position, not a field's frequency. Script A0
      turns its magnet with a motor, not with this field. So no shipped script or example is affected, and no test experiment
      other than this entry's own, whose result reads the field's angle, commands a changing frequency (tests/build/test_rebind.py and
      tests/build/test_notebook_gaps.py wire a test controller's tick count, which changes every step, to
      field.frequency, but assert on what the controller wrote, not on the field's angle).
      A controller a user or a lab registers that writes a field's frequency (the command's name is `frequency`) is, as
      is a drive added later, and any study that sweeps the frequency inside one run (a ramp to find a step-out
      frequency, for instance). A frequency changed between runs, each run constant, is not.

      Severity: major, by the registry's table ("incorrect results, workaround exists"): the field's angle is wrong by a
      factor of two for a ramp, with no flag and no refusal; the workaround below removes it.

      Resolution (dev2, the drives' phase): UniformRotating 0.2.0 (node IntegratingRotatingNode) turns the field by the
      integral of its frequency, each step's frequency held over the step, for any writer (a drive, a controller). It
      holds the phase in turns as a fraction, a pair of floating numbers (a high part in [0, 1) and the part of it
      below the high part's last place), and each step adds f_n h, the frequency written for the step times the
      timestep, as an exact product of two floating numbers (Dekker's residual of the product, built of partial
      products that are exact because each factor is split in halves by an integer mask) by an error-free sum (Knuth's
      two-sum). A first version of 0.2.0 kept the phase as 2 pi (f_n t_n - C_n) with a correction C_n and claimed its
      rounding did not grow with the run; that is false in float32, where f_n t_n carries a relative rounding of the
      phase's own size (measured against an exact sum of the frequencies written: 4.1e-3 rad at 100 s and 0.13 rad at
      1000 s on a ramp of 0.25 Hz/s from 40 Hz, 2.9e-3 and 2.5e-2 rad at a constant 40 Hz), and the pair replaces it.
      Measured, 1000 s of 0.5 ms steps (2e6 steps, up to 165 000 turns), the field's angle against the exact sum of
      the frequencies written: float32, at every step, at most 2.2e-7 rad (constant 40 Hz), 4.4e-7 rad (the ramp)
      and 4.7e-7 rad (a noisy writer), the same over the first 100 s as over the last (float32's spacing of an angle
      in a turn is 4.8e-7 rad, which the output's cosine and sine round to); float64, below 4e-16 rad, the check's own
      rounding, at 100 s and 1000 s for the three writers. What rounds in a step is one addition into the pair's low
      part, at most about 2e-15 turns in float32, which over N steps is N times as much in the worst case (4e-9 turns
      at 2e6 steps) and less in practice; that bound grows with the run, slowly, where the first version's error was of
      the phase's size. For a frequency that never changes the field is no longer 0.1.0's to the last bit: 0.1.0's
      f t carries the rounding the pair avoids, and script A's field over 200 steps differs from 0.1.0's by 9.6e-7
      rad in float32 and 8.9e-16 rad in float64 (the kept version's rounding, not the pair's). A script that writes
      UniformRotating(...) gets 0.2.0. 0.1.0 stays registered for a folder saved with it (mime.fields.KEPT) and is
      guarded: its build refuses any drive of its frequency but the constant, and a controller that writes it
      (command.held-constant), naming 0.2.0 as the route. With drives.Ramp, which writes each step the ramp's value
      at the step's middle, 0.2.0's field points along 2 pi (f0 t + k t^2 / 2) at every step's end within 1.8e-15 rad
      in float64 and 4.5e-7 rad in float32 (1000 steps of 1 ms, f0 1 Hz, k 2 Hz/s); the tests above, turned round,
      read the ramp's ratio 1 and the step's offset zero.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      The field the body is driven by is not the field commanded, with no sign in the run, for any run whose frequency
