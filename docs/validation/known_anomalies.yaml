  - anomaly_id: MIME-ANO-140
    title: "A folder saved under one count of usable CPUs or of BLAS threads and verified under another was read as the same environment, so verify compared bit for bit and reported outputs moved that only the count had moved"
    description: >
      Two thread counts decide the last bits of a CPU run, and the lock's environment recorded neither.

      The usable CPUs. XLA's CPU backend sizes its thread pools by the process's affinity when JAX first computes, and
      partitions a program's work by it [measured: the tf_XLAEigen, tf_XLACompile and tf_XLAExecute pools held 2, 4, 8
      and 24 threads under taskset -c 0,1, 0-3, 0-7 and none, equal to len(os.sched_getaffinity(0)) and never to
      os.cpu_count(), which said 24 each time; an affinity changed after the first computation left them at 24]. So one
      program computes other bits under another count: the tube demo's 40 states hash to one value in all 9 unpinned
      processes and to another in all 3 pinned to 2 CPUs of one core [measured on the development branch before saved
      form 8 (U3's baseline), laptop CPU, float32].

      The BLAS threads. JAX's CPU LAPACK kernels (jaxlib 0.12.0.1) run on the OpenBLAS that SciPy ships, not on NumPy's
      [read: jaxlib takes its routines from scipy.linalg.cython_lapack; measured: a breakpoint on OpenBLAS's threaded
      dispatcher (exec_blas) hit in SciPy's library, from XLA's threads, while the compiled steps of mrs_point_forces
      ran (8 hits in 4 steps), and 973 times in the tube demo's build and 4 steps]. Its pool is set by
      OPENBLAS_NUM_THREADS, else GOTO_NUM_THREADS, else OMP_NUM_THREADS, and is the affinity's CPU count where none is
      set; MKL_NUM_THREADS does not touch it [measured, by reading the pool through the library's own getter under each
      setting]. A routine split over the pool sums in another order. Setting NumPy's pool and SciPy's apart (both by the
      library's setter, before any use), then hashing every field of 8 steps of float32 history [measured]:
      SciPy's pool at 24 and at 1 gives two hashes in mrs_point_forces and in the tube demo, whichever NumPy's pool is
      (24 or 1); NumPy's pool at 24 and at 1 gives one hash in each of mrs_point_forces, sphere_settling and the tube
      demo, whichever SciPy's is, and sphere_settling gives one hash in all four settings. NumPy's own pool is reached
      at the build (the Gauss-Legendre nodes of the sphere sampler, numpy.polynomial.legendre.leggauss, by eigh: 300
      threaded calls in sphere_settling's build, 420 in the tube demo's) but moved no bit in these three cases;
      script_a and probed_shapes reach no threaded call of either pool [measured, the same breakpoint, 0 hits]. The
      experiments exposed, on this stack and these sizes, are the MRS drag's (mrs_point_forces and the tube demo);
      whether a larger case reaches NumPy's pool in a way that moves bits was not tried. The lock recorded the CPU's
      model and the hash of its flags but neither count: a folder saved at OPENBLAS_NUM_THREADS=24 and verified at 1
      (and the reverse) was read as "environment: the one the lock was written in" and reported 3 outputs moved
      (mrs_point_forces, float32) [measured by the PR's review on the development branch before saved form 8].

      So a folder saved unpinned and verified under taskset -c 0,1 was read as the same environment, verify compared
      bit for bit, and reported 11 outputs moved, exit 1 [measured on the tube folders U3's baseline saved]. The
      outputs had moved only by what the count moves (MIME-ANO-141 sizes it); the comparison was the wrong one.

      Fixed for folders saved in saved form 8: the lock's environment records the usable CPUs (usable_cpus: the
      affinity where the system has one, else os.cpu_count(); None where neither says) and the BLAS threads
      (blas_threads: the pool of SciPy's OpenBLAS, read through its own getter; None where SciPy ships none or the
      library cannot be opened), and a load or verify under another count of either is another environment, so verify
      takes the comparison within the lock's tolerance [measured on the branch: the tube demo saved unpinned and
      verified under taskset -c 0,1 reports "usable_cpus: built under 24, loaded under 2"; mrs_point_forces saved at
      OPENBLAS_NUM_THREADS=1 and verified at 2 reports "blas_threads: built under 1, loaded under 2", and the
      tolerant comparison reports 1 output moved (screw.twist, at most 4.8e-7), exit 1]. That comparison can still
      report outputs moved (MIME-ANO-141), so the false "moved" is not yet gone for these cases; what is fixed is the
      environment's report. A folder of saved form 7 or earlier records neither count and is compared as before, so it
      keeps the false "moved" under another count: 11 outputs for the tube folder of U3's baseline verified at 2 CPUs,
      3 for mrs_point_forces verified at another BLAS count [measured]. Folders of form 8 saved by an earlier head of
      this change record usable_cpus only; none was released.

      Severity: major, by the registry's table ("incorrect results, workaround exists"): verify's verdict is wrong for
      a folder verified under another count, and verifying at the counts it was saved at gives the right one.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      Verify's verdict is what a reader of a saved or published experiment relies on to say it reproduces. Under
      another count it said "moved" in the environment it claimed was the lock's own, so a reproducible experiment
      read as not reproducing, and a reader could not tell the count from a real change. No simulated result is
      wrong: the run and its outputs are what the program computes under that count.
    resolution_status: partially_resolved
    affected_versions: ">=0.3.0.dev1"
    resolution_version: "0.3.0.dev2"
    affected_components:
      - "mime.saved: the lock's environment record and the load's comparison of it"
      - "mime.env: the host record (usable_cpus, blas_threads)"
    verification:
      - "tests/saved/test_save_reference.py::test_a_folder_verified_at_the_count_it_was_saved_at_is_the_same_environment_bit_for_bit"
      - "tests/saved/test_save_reference.py::test_a_folder_verified_at_another_count_is_another_environment"
      - "tests/saved/test_save_reference.py::test_mime_verify_under_another_affinity_in_a_fresh_process_reports_another_environment"
      - "tests/saved/test_save_reference.py::test_a_count_either_side_could_not_read_is_never_the_same"
      - "tests/saved/test_save_reference.py::test_the_lock_records_the_blas_threads_and_a_folder_loaded_at_that_count_is_the_same_environment"
      - "tests/saved/test_save_reference.py::test_a_folder_loaded_at_another_blas_count_is_another_environment"
      - "tests/saved/test_save_reference.py::test_control_the_blas_count_dropped_from_the_comparison_fails_the_test_above"
      - "tests/saved/test_save_reference.py::test_the_mrs_case_saved_at_one_blas_count_reproduces_at_it_and_is_another_environment_at_another"
      - "tests/saved/test_form8.py::test_a_version_seven_folder_loads_and_verifies_by_the_history_scan_and_its_environment_names_no_count"
    residual_risk: >
      The CPU count is read when the lock is written and when it is compared, not when XLA made its pools: a process
      that changes its affinity after JAX's first computation records a count XLA does not use. The BLAS count is
      read when called, so it is the pool's size then; a pool resized between the run and the save (threadpoolctl, the
      library's setter) is recorded as it stands at the save. Measured on Linux only; elsewhere the CPU count is
      os.cpu_count(), which was not compared with what XLA uses there, and the BLAS count is None where SciPy ships no
      OpenBLAS (macOS on Arm, a distribution's own SciPy), which is never the same as anything, so such a platform
      always reads as another environment. NumPy's own BLAS pool is not recorded: it moved no bit in the three cases
      tried, and a case that does move with it only is not caught. A GPU's results do not depend on the CPU count in
      the same way, but both counts are compared there too, as the CPU's model is.
    workaround: "Verify a folder at the counts it was saved at: unpinned where it was saved unpinned, under the same taskset where it was saved pinned, and with the same OPENBLAS_NUM_THREADS (else GOTO_NUM_THREADS or OMP_NUM_THREADS) where one was set; a folder of saved form 8 says which in its environment's usable_cpus and blas_threads"
    planned_resolution: "Done for saved form 8: the lock's environment records usable_cpus and blas_threads and the load compares them. Older folders keep the workaround"

  - anomaly_id: MIME-ANO-141
    title: "Across environments verify holds each element to rtol of itself and an absolute atol of 1e-9, and the differences a thread count makes in the tube demo's twist and drag asymmetry are about 10^-3 of their field's largest element, which the tolerance reports as moved"
    description: >
      Verify compares a rerun with the reference outputs bit for bit in the lock's environment and, in another, with
      np.allclose(saved, rerun, rtol=1e-6, atol=1e-9) element by element [read: verify_history in
      mime/saved/_folder.py, the lock's reference tolerance]. The tolerance of an element is 1e-9 plus 1e-6 of that
      element, not of its field's scale.

      Measured on the tube demo saved on 24 CPUs and rerun by its one-step program under taskset on 2 and on 16 CPUs
      (float32, laptop CPU), the lock's count making it another environment (MIME-ANO-140): 3 outputs reported moved,
      each from step 0. Their differences against the field's largest element (the array's largest absolute value, over
      the 8 steps) are:
        ball.twist, 2 CPUs: largest difference 1.99e-6 of an array whose largest element is 1.04e-3, a ratio of 1.9e-3;
        24 of 48 elements outside the tolerance. 16 CPUs: 1.71e-6, 1.6e-3, 24 of 48.
        the drag's asymmetry, 2 CPUs: 2.18e-8 of 1.95e-5, 1.1e-3; 7 of 8 elements outside. 16 CPUs: 3.1e-8, 1.6e-3, 8 of 8.
        ball.pose, 2 CPUs: 6.3e-9 of 1.0, 6.3e-9; 11 of 56 elements outside.
      The twist and the asymmetry differ by about 10^-3 of their largest element, about 10^4 times a float32 rounding
      unit of it [arithmetic], and at 16 CPUs as at 2. They are not last-bit differences of the large elements carried
      into small ones, as an earlier text of this entry said. The resistance matrices the two runs hold differ by about
      2e-7 of their scale (measured by the same review), so an amplification of that through an ill-conditioned solve
      is a candidate; it was not measured, and the mechanism is not established.

      A scale-relative comparison (each field against its own largest magnitude, this entry's planned resolution, U17)
      at a tolerance like the lock's 1e-6 would still report the twist and the asymmetry moved: 1.6e-3 to 1.9e-3 of
      their largest element is 10^3 times that tolerance. So U17's tolerance must be set from measurement, field by
      field and by the sizes above, and may not be assumed to resolve this case; a reader who reads each moved line
      against its field's scale sees 10^-3, which reads as a change.

      Severity: major, by the registry's table: verify's verdict across environments can say "moved" for an experiment
      that reproduces under another thread count, and the workaround is to verify where the folder was saved.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A false "moved" across environments makes a reproducible experiment read as not reproducing on another machine
      or another CPU count; a reader who trusts the verdict discards a valid result or hunts a change that is not
      there. A real change smaller than the tolerance in a large element is not what this entry is about.
    resolution_status: open
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "mime.saved: verify's comparison across environments (verify_history)"
    residual_risk: >
      Measured on one experiment (the tube demo), one machine, float32, between 24 and 16 and 2 CPUs. The mechanism
      is not established. Other experiments, other precisions and other environments (a GPU, another CPU model) were
      not tried, and the BLAS count's share of these differences was not separated from the CPU count's.
    workaround: "Verify at the counts, and on the machine, the folder was saved on, where the comparison is bit for bit; across environments, read each moved line against its field's scale, and know that the tube demo's twist and drag asymmetry move by about 1e-3 of their largest element between CPU counts"
    planned_resolution: "U17: scale-relative across-environment comparison, with its tolerance set from measurement (this entry's sizes are the starting table), per field"

  - anomaly_id: MIME-ANO-142
    title: "A cached bundle changed in place, with its size and modification time kept, is served as the verified file and survives a fresh download, so based_on and pull refuse it with advice that does not apply"
    description: >
      The asset cache serves a file by the cheap check (cheap_problem in mime/assets/_cache.py): its size is the reference's,
      its '<sha256>.verified' record exists, and the size and modification time the record holds are the file's. A file with a good record
      is never hashed again [read]. A byte changed inside the file (bit rot, or an edit) that keeps the size and restores the
      modification time therefore passes, and is served as the file its sha256 names.

      Measured by the refuting review of PR #184 (U15b), on the pull tests' fake repository (no contact with Zenodo): run
      Experiment.based_on(<DOI>, name="child"), flip one byte in the middle of the cached bundle '<cache>/<sha256>' keeping its
      size and st_mtime_ns, run it again.
        The cache serves the changed file (the bundle request count stays at 1). Reading the bundle's lock raises BadZipFile
        (bad CRC of experiment/mime.lock), so the folder test (_holds_experiment_of) says the folder holds another experiment, and
        pull refuses 'pull.destination' ("exists and is not an empty folder ... this one holds another, so move or rename
        it") while the folder holds the very experiment. 'mime pull <DOI>' into a new place refuses 'bundle.unreadable' with
        "fetch it again, mime pull <doi | url>", which downloads nothing new: it serves the same file.
      Before PR #184 the same was measured with the shortcut disabled: the changed file is downloaded over, its md5 passes, and
      retrieve then finds cheap_problem(ref) is None for that sha256 path and returns the changed file, never installing the
      new bytes. The refusals and the advice were the same. So the entry is the cache's, not that PR's: the PR removes a
      useless download from a path that served the same file.
      A flip inside the archive's checked bytes was refused downstream in every case measured (bundle.unreadable, or
      bundle.manifest for a flip in the header); no changed bundle was used. A flip in the file's unchecked bytes was not
      tried.

      Severity: minor, by the registry's table, for what was measured: a bundle refused with advice that does not apply,
      no result changed, and the workaround is to delete the cached file (and its '.verified' record). The cache's check is
      the same for an asset's file (a mesh, a table); a changed asset served as verified would change a result, and that was
      not measured here.

      Resolved for what was measured (the bundle fetched by its repository's checksum), in two steps [read, and measured by
      the tests named below, on the pull tests' fake repository]: (1) where the caller holds the repository's checksum of
      the file, the cheap check also reads the cached file once and compares its digest with it (cheap_problem(ref,
      checksum), locate(ref, checksum=...), and the lookup in assets.retrieve), so the flipped file no longer passes the
      shortcut and is downloaded; (2) the download, which passed the repository's checksum, is installed over a cached
      file whose full sha256 fails when MIME wrote it (a rename in one step; a file a person placed is refused, as ever),
      where before a cached file that passed the cheap check was never replaced. The review's reproduction now downloads
      the bundle once more (request count 1 to 2) and serves the good file, for based_on and for pull. Cost, warm page
      cache, one thread: locate with no checksum 15 to 19 us at 1, 32 and 900 MB (nothing read); with the caller's md5
      1.0 ms at 1 MB, 34 ms at 32 MB and 1.08 s at 900 MB (one local read of the whole file, about 0.8 GB/s; a cold read is
      bounded by the disk).

      Not resolved: a file whose caller holds no checksum. An asset's reference holds its sha256 and a locate for it is
      the cheap check alone, by design (hashing a file of about nine hundred megabytes on every build is the cost the
      shortcut exists to avoid); a byte flipped in place there, with the size and modification time kept, is served until
      'mime assets check' or 'mime assets fetch' hashes the file. The documentation says what the shortcut guards (size
      and modification time) and what it does not (the bytes).
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A bundle served from the cache with changed bytes was refused downstream on every flip tried, so no wrong experiment was
      run; the harm measured is two refusals whose advice (rename the folder, fetch it again) does not apply and cannot
      succeed. Whether an asset file changed the same way is served and used in a run was not tried; if it is, the result
      would be wrong without a refusal, which is why this is not stated as having no bearing on a result.
    resolution_status: partially_resolved
    affected_versions: ">=0.3.0.dev1"
    resolution_version: "0.3.0.dev2"
    affected_components:
      - "mime.assets: the cache's cheap check (cheap_problem), which a bundle fetched by its repository's checksum and an asset share"
    verification:
      - "tests/sharing/test_cache_changed_in_place.py::test_a_bundle_flipped_in_place_is_downloaded_once_more_and_the_good_file_is_served"
      - "tests/sharing/test_cache_changed_in_place.py::test_pull_of_the_doi_after_a_flip_downloads_once_and_unpacks"
      - "tests/sharing/test_cache_changed_in_place.py::test_the_download_is_installed_atomically_over_the_failing_file"
      - "tests/sharing/test_cache_changed_in_place.py::test_a_flipped_file_a_person_placed_is_refused_and_left_alone"
      - "tests/sharing/test_cache_changed_in_place.py::test_a_bare_url_bundle_flipped_in_place_is_repaired_by_the_download_that_runs_each_time"
      - "tests/sharing/test_cache_changed_in_place.py::test_an_unreadable_cached_bundle_is_refused_with_its_file_and_the_route_never_a_bare_error"
      - "tests/sharing/test_cache_changed_in_place.py::test_control_an_unchanged_bundle_is_served_with_no_request_and_one_read_for_the_checksum"
      - "tests/sharing/test_cache_changed_in_place.py::test_control_an_unchanged_file_with_no_caller_checksum_is_served_with_no_hash_and_no_request"
      - "tests/sharing/test_cache_changed_in_place.py::test_control_a_flipped_file_with_no_caller_checksum_is_served_as_the_entry_states"
      - "tests/sharing/test_cache_changed_in_place.py::test_control_a_checksum_of_an_algorithm_not_here_is_a_problem_never_a_pass"
      - "tests/sharing/test_cache_changed_in_place.py::test_control_with_the_digest_comparison_planted_out_the_flipped_bundle_is_served"
      - "tests/sharing/test_cache_changed_in_place.py::test_control_with_the_replacement_planted_out_the_download_does_not_repair_the_cache"
    residual_risk: >
      Measured on one bundle on the fake repository, for a byte flipped at the start, in the middle and at the end of the
      file, for two bytes, and for the first and last together (the tests named above run each through based_on and pull);
      the digest comparison reads the whole file. A cached asset's file, which the caller holds no checksum for, is still
      served by the cheap check alone (see above): the same change to it was not measured. Whether a changed
      asset is then used by a run, and what it would change, is unknown. A hand-edited '<algorithm>-<digits>.checksum' note
      naming another cached bundle no longer serves that bundle where the caller holds the checksum: the comparison finds
      its bytes are not the ones the checksum names and the right bundle is downloaded [measured by the review of this fix,
      one request more]; it needs write access to the cache directory, where '<sha256>.verified' can already be written
      for an asset's file, which no checksum is compared with [inference]. A cached bundle that cannot be read (its
      permissions) is refused as 'asset.missing' naming the file and the route, never downloaded around [tests above].
      A bundle named by a bare address, downloaded each time, now also repairs a cached file of those bytes that was
      changed in place.
    workaround: "For an asset's file, or a bundle on a version before the fix: run 'mime assets check' (it finds a flipped byte and marks the record) and then 'mime assets fetch'; or delete the cached file '<cache>/<sha256>' and its '<sha256>.verified' record, then pull again; the cache is the directory in MIME_ASSETS_DIR, else the platform's cache directory for mime (assets)"
    planned_resolution: "Done for a bundle fetched by its repository's checksum. What remains is an asset's file, for which the caller holds no checksum but the sha256 the hash costs a full read to compare: whether a warm locate should hash a file under a size, or an asset's use should check it once per process, is a decision on the cost above, not made here"

  - anomaly_id: MIME-ANO-143
    title: "Under jit, the tube wall read's derivative along a rigid motion has the wrong sign for some pairs of force points at exactly equal height, and the pairs it fails on depend on how XLA fuses the program"
    description: >
      The tube wall kind's read takes the pair's axial offset dz (and the sine of its angle) from the points' positions,
      reads the table at |dz| and the folded angle, and signs the odd components from dz >= 0 (pair_block in
      mime/nodes/hydro/mrs/_tube.py: switch.absolute for |dz|, switch.where(dz >= 0, 1, -1) for the sign) [read]. For two force
      points at exactly equal height the true odd components are smooth through dz = 0 with the slope f'(0) times the tangent of
      dz, and in JAX 0.12.0.1 both factors agree at dz = 0 when dz is the same number in both places (the tangent of abs at 0
      is +1 times the input tangent, and the sign test takes dz >= 0): measured eager, jvp and jacfwd of the correction along
      the six rigid motions of the tube demo's 338 force points match central differences to 2e-7 of the column's largest entry,
      ties and all. Inside a jitted program they do not always agree, and the derivative of an odd component of such a pair comes
      out with the opposite sign (error exactly 2.0 of the entry, measured on a two-point case).

      Measured (float64, CPU, JAX 0.12.0.1, the shipped unit_tube_R0.997 table; the tube demo of examples/sphere_settling_tube.py,
      its 338 force points, a frame whose rows are an axis permutation):
      - Whole body, jit(jacfwd) of the correction along the six rigid motions of the points, against central differences,
        relative to the column's largest entry: at the demo's pose 0.4 of the way to the floor (14 off-diagonal pairs at exactly
        equal height, 8 at exactly equal azimuth) translations across the axis 1e-6, 2e-6 and the two rotations about the axes
        across the tube 1.7 and 1.0; at a second pose (centre 0.2 radius off the axis, 14 height ties) rotations 1.2 and 1.5. The
        same points nudged by 1e-9 m (no tie left): rotations 7e-8 to 2e-7. A third pose nudged by 1e-7 m: 6e-8 to 2e-7. The same
        function evaluated eagerly (not jitted) at the first pose: 2e-7 and 2e-8 for the two rotations. The translation along
        the tube's axis moves no pair and has a derivative of zero on both sides (a comparison that cannot discriminate).
      - Two points only (each of the 7 height-tied pairs taken alone, 9 pair-and-rotation cases that move the pair): jitted, 3
        are wrong by exactly 2.0 (pairs 121-149 about both rotations, pair 218-251 about the second); eager, none. A third
        pair (60-65) is right in forward mode and wrong in reverse mode (jax.grad of a weighted sum of the matrix: the sign of
        one rotation's gradient flips), and pair 121-149 is right in reverse mode and wrong in forward mode, so the set of
        failing pairs depends on the program being differentiated.
      - Controls: an optimization barrier on the offset passed to pair_block (a probe patched in the process, caches cleared) makes
        all 9 cases right (largest error 1.25e-8) and a barrier on the sine alone does not (still 3 wrong), which places the
        fault in the offset's computation; the optimized program of a two-point case holds several separate fusions, each with its own
        >= comparison on a value it computes inside itself (4 of them) and one with the absolute value too [measured, the HLO; that
        these are the offset is an inference]. The tangent mechanism first proposed for this (that the computed tangent of |dz| at 0 is 0) is refuted: it is +1 times the input tangent in this JAX, eager.
      - Float32 (11 height-tied pairs, 13 cases): none wrong as shipped (largest error 1.2e-3, the central difference's own
        float32 floor), but with a barrier on the sine alone 8 of 13 are wrong: float32 is exposed to the same fault, and
        is clear here only by the fusion XLA happened to choose.
      The remaining step is an inference and is labelled so: the signs are inconsistent because XLA computes the offset
      (a difference of two dot products) separately for each consumer, with different rounding (the primal offset of a tied
      pair is exactly 0 eagerly and 1e-18 to 1e-17 in the jitted program), so that the sign test and the absolute value see
      two nearly-zero numbers that need not have the same sign. Nothing here measured the rounding inside the fusions.

      Resolved in 0.3.0.dev2, by one value of the sine and of the offset wherever a derivative is taken through them
      (measured on a laptop's CPU, an i7-12850HX, JAX 0.12.0.1, the shipped table). The mechanism, read from the
      optimized HLO of a two-point jitted jvp in float64: XLA rewrites the division of the local coordinates by the
      tube's radius as a multiplication by its reciprocal, and recomputes the offset, local_z(t) k - local_z(s) k,
      inside each fusion that reads it (the sign test, the absolute value's derivative, the table's locating), from the
      same matmul output [read]. That two fusions round that difference differently at a tie (a fused multiply-add in
      one and not in the other) remains an inference, not measured inside the compiler. pair_block alone, given an
      offset of exactly zero as an input, is right jitted in both modes and both precisions [measured], which places
      the fault in the offset's recomputation, not in the table or the fold.

      Two findings widen the reach recorded above [measured]. The angle's fold is exposed the same way (the sine,
      sin_t cos_s - cos_t sin_s, is a difference of products): in jitted reverse mode (jax.jacrev) two of four pairs
      at exactly equal azimuth were wrong in float64 and one in float32. And in reverse mode with a cotangent for each
      entry the read was wrong away from any tie between two samples, through each sample's pair with itself, which
      tube_reads reads and which is a tie in both height and azimuth: at one of the eight two-sample pairs apart of
      this fix's test (pair b), the self-pair block missed by 1.13 of the column's largest entry in both precisions,
      and in the refuting review's own harness (12 random pairs apart, jitted jax.jacrev against the central
      difference in the same precision, run on the tree before the fix) 10 of 12 were wrong, by up to 0.75, in both
      precisions: the self-pair is a tie wherever the samples are, and how many pairs fail is the fusion's, not the
      pair's [measured, the review's harness]; between the same two samples
      with no self-pair (tube_pair_reads) nothing missed; holding the sine alone put it right and holding the offset
      alone did not. Forward mode and a gradient of a weighted sum of the entries were right there, and so was reverse
      mode on three clouds of twelve samples tied in nothing: which programs fail is the fusion's.

      Candidates (Q5), first on two-point probes (five pairs tied in height, four in azimuth, both rotations across the
      tube, jitted jvp and the gradient of the entries weighted by the central difference's signs, float32 and
      float64): the read as shipped was wrong in 8 of 20 height cases in float64 and 4 of 20 in float32, and in 1 of
      16 azimuth cases in float64; |dz| taken as dz times its one sign (one JAX value for both) the same 8, 4 and 1,
      since the fault is XLA's recomputation and not the JAX value; a barrier on the offset alone (in every program,
      or only where a derivative is taken) 0 of 20 at the heights and 1 of 16 at the azimuths; a barrier on both the
      sine and the offset, either way, 0 of 36 in both precisions, and 0 of 36 again under an added barrier on the
      sine. Then the bits, every state field compared with np.array_equal against the shipped program, at 8 usable
      CPUs and OPENBLAS_NUM_THREADS and OMP_NUM_THREADS 4, each arm a fresh process with the candidate patched in
      before its first trace: both barriers on the sine and the offset (in every program, and only where a derivative
      is taken) kept every bit of the tube demo's 40 steps (27 fields; the history scan in both precisions, one-step
      chunks in both) and of the screw in the tube's 30 steps (28 fields, the history scan, both precisions).
      The shipped program run twice was bit for bit, and the control, the offset one unit in the last place up, moved
      10 to 13 of the fields in each of those four. FL-9's hull contact (13 fields, 20 steps, both precisions) kept
      every bit as well, but it attaches no drag and never reads the tube's table (pair_block traced 0 times; the
      control moved nothing): that arm cannot discriminate. The route taken is the barrier only where a derivative is
      taken (held_once in mime/nodes/hydro/mrs/_tube.py: a jax.custom_jvp whose primal is its input and whose rule
      returns the input through an optimization barrier, the tangent unchanged, applied to the sine and to the
      offset), which keeps the run's program by construction (the HLO of a program that takes no derivative is the
      shipped one) where the barrier in every program kept the bits on these rigs by the fusion XLA chose. The tube
      wall kind keeps its version, 0.1.0.

      After the fix (tests/oracles/test_tube_tie_derivative.py, on the laptop's CPU): at five pairs tied in height, four
      in azimuth and eight apart, each read with its self-pairs (tube_reads), both rotations across the tube, jitted in
      forward mode (jvp) and in reverse mode (jacrev), the derivative is within 5.2e-9 (float64) and 2.9e-4 (float32) of
      the central difference, relative to the column's largest entry, against floors of 1e-6 and 3e-3; eager too (a pair
      tied in height); under an added barrier on the sine too. The whole body (the tube demo's 338
      points 0.4 of the way to its floor, 7 pairs of them tied in height, the correction's jit(jacfwd) along the two
      rotations) is within 2.3e-7 and 2.3e-8 against a floor of 1e-5. The read jitted is the program before the fix to
      the last bit, at the ties and off them, and off the ties the forward derivative is the one before the fix to 0
      (float32) and 0.018 (float64) units in the last place. The controls, the same harness with held_once the identity
      (the program before the fix): at the height ties 8 of 20 cases wrong in float64 (forward and reverse) and 4 of 20
      in float32 (reverse), each by 2.0 in the two cross-pair blocks; at the pairs apart, in reverse mode, 1 of 16 (pair
      b, through its self-pair block) in each precision; with the offset held alone, 3 of 48 (float64) and 2 of 48
      (float32) wrong at the azimuth ties and the pairs apart; under the barrier on the sine, 8 of 36 in each precision;
      the whole body 1.67 and 1.01. On CI, 20 of 20 stress runs of the file passed (the fix's pull request, its test code
      as it stands here): every gate within its floor and every control failing the read before the fix, on every run.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A derivative through the tube wall read at a pose with tied force points can have the wrong sign with nothing flagging it,
      so a gradient-based fit, a sensitivity or a controller that differentiates through a body in a tube (a screw's
      orientation, a sphere's rotation about an axis across the tube) would use a wrong direction. Whether any such
      use exists in a safety-relevant path depends on the deployment. The primal values (the resistance, a run) are not
      affected, and no derivative in the repository is known to be evaluated at a tie (see the residual risk).
    resolution_status: resolved
    affected_versions: ">=0.3.0.dev1, <0.3.0.dev2"
    resolution_version: "0.3.0.dev2"
    affected_components:
