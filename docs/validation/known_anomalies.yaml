      - "tests/saved/test_sampling_walk.py::test_every_kinds_own_body_reach_holds_its_body_from_its_samples"
    residual_risk: "The supremum is FL-9's; another screw's settings may overstate by more than the declaration, which the suite checks only on the declared settings"
    workaround: "Take a contact's point from mime.scene.body_reach (the body's own quadrature samples), which never overstates the reach and whose gradient is a sample of the body; use the envelope as a broad-phase bound"
    planned_resolution: "The containment contact (phase 7o) takes body_reach, or an exact support function of the screw. Phase 7o's contact 0.2.0 takes body_reach's points, so the envelope reaches no contact; the envelope itself stays as it is, a conservative bound"
  - anomaly_id: MIME-ANO-129
    title: "A rigid body with three different inertias gained kinetic energy from its explicit gyroscopic term (rigid_inertial 0.2.0), and an undamped rig went non-finite"
    description: >
      rigid_inertial 0.2.0 took the gyroscopic term -omega x (I omega) as an explicit load, so that Euler's equations
      were integrated by forward Euler: a torque-free body of inertias (1.0, 1.2, 0.8) x 1e-10 kg m^2, spinning at about
      200 rad/s, gained kinetic energy at every step, 2.62 times its energy in a second at a 1 ms step (angular momentum
      1.61 times), 1.53 at 0.5 ms, 1.22 at 0.25 ms and 1.08 at 0.1 ms (computed on the node alone, float64): first
      order in the step. Where nothing damps the body the gain compounds with the rotation (the term is cubic in the
      rate) until it overflows. The live test rigs, a body in a rotating field with no drag, stopped being finite at
      t = 4.435 s in a batch run in float32 (the run's refusal, run.non-finite, first in the body's pose; a live session
      stopped at 4.448 s, the end of the 16-step chunk, with every frame before it equal to the batch run's state bit
      for bit) and at 4.298 s in float64; at a step of 0.5 ms, 0.25 ms and 0.1 ms the same rig stayed finite for 6 s
      with its angular rate bounded near 220 rad/s. Found by two agents (the live session's test, and the review of
      phase 7n), who each took it for the rig's. A body of equal moments is unaffected: the term is exactly zero for it.
      Fixed in rigid_inertial 0.3.0; 0.2.0 stays registered (mime.dynamics.body.KEPT) so that a folder saved with it
      loads and reproduces, and it still gains the energy. The frozen register's scripts (scripts/sim2real) are pinned
      to 0.2.0, as the 7j register's amendment records: its x4.32 transverse-inertia arm moved from 3.20686 to 3.20747
      mm/s (+0.019%) on the first version of the fix, made inside 0.2.0.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A body with a drag resistance is damped implicitly, which hides the gain below the damping; a body whose drag is
      absent or small (a rig in vacuum, a test fixture, a low-viscosity limit) gets a rotation whose energy is wrong
      by an amount that grows with its rate and the step, and a run that ends in NaN is at least visible but one that
      has gained energy and not yet overflowed is not. Every rotating body of unequal inertias was affected, by an
      error first order in the step.
    resolution_status: resolved
    affected_versions: ">=0.3.0.dev0"
    resolution_version: "0.3.0.dev1"
    affected_components:
      - "entry: dynamics rigid_inertial 0.2.0"
      - "node: RigidInertialNode"
      - "entry: dynamics rigid_inertial 0.3.0"
      - "node: RigidInertialMidpointNode"
    verification:
      - "tests/oracles/test_gyroscopic_energy.py::test_a_torque_free_body_keeps_its_energy_and_the_magnitude_of_its_angular_momentum"
      - "tests/oracles/test_gyroscopic_energy.py::test_control_the_term_taken_explicitly_gains_energy_on_every_spin"
      - "tests/oracles/test_gyroscopic_energy.py::test_the_direction_of_the_angular_momentum_drifts_first_order_and_bounded"
      - "tests/oracles/test_gyroscopic_energy.py::test_a_spin_started_near_the_middle_axis_flips_at_the_elliptic_period"
      - "tests/oracles/test_gyroscopic_energy.py::test_control_the_term_taken_explicitly_flips_at_the_wrong_period"
      - "tests/oracles/test_gyroscopic_energy.py::test_an_isotropic_body_steps_as_the_term_explicit_does_bit_for_bit"
      - "tests/oracles/test_gyroscopic_energy.py::test_control_the_jacobian_from_the_world_inertia_moves_an_isotropic_body"
      - "tests/live/test_rigs_finite.py::test_each_rig_runs_ten_seconds_with_every_field_finite"
      - "tests/live/test_rigs_finite.py::test_control_the_gyroscopic_term_taken_explicitly_stops_the_tracked_rig_being_finite"
      - "tests/differential/test_frozen_register_pins.py::test_the_transverse_inertia_arm_reproduces_the_registers_speed"
    residual_risk: "The scheme is one linearised Newton step of the implicit midpoint rule on Euler's equations: second order for the gyroscopic term alone, with no secular drift. It keeps the torque-free body's kinetic energy to 2.3e-4 and the magnitude of its angular momentum to 1.2e-4 at a 1 ms step over a second at 200 rad/s (5.9e-5 and 2.9e-5 at 0.5 ms), and the stable axes neutral; a spin started near the middle axis flips at the elliptic period to second order (the mean spacing of the flips off by 1.1e-4 at 1 ms). The direction of the angular momentum in the world is first order in the step and bounded: it wobbles by 1.99 degrees at 1 ms and 0.99 at 0.5 ms, flat over 20 s, because the pose turns by the rate at the end of the step. With a load the body is still first order, by the resistance and the loads taken at the start of the step. A rotation rate times the step of order one is not resolved and nothing refuses it: the torque-free energy error of the 206 rad/s body grows as its square (2.2e-4 at |omega| dt = 0.2, 1.4e-3 at 0.5, 5.5e-3 at 1, 2.2e-2 at 2, 0.10 at 4, 1.2 at 10), so a run past about 0.5 (the line the entry's limits state, a declaration from that measurement on one body) finishes finite and wrong; the run's non-finite check does not fire there (it did, by overflow, for the explicit term at 3.7). The step's matrix, M/dt + R - K/2, is no longer symmetric for a body of unequal moments (by about |omega| dt/2 times the spread of the moments over their mean, 1% for the screw of the live rigs at 0.5 ms): the held-contact formula needs no symmetry, but a solve that assumes M/dt + R symmetric positive definite (phase 7o's hull contact, which reads the node's mass matrix) does not hold for it. A folder saved with rigid_inertial 0.2.0 and a body of unequal moments keeps the gain"
    workaround: "Use rigid_inertial 0.3.0 (the default); with 0.2.0, a step small enough that the rate times the step is well below one, or a drag resistance on the body"
    planned_resolution: "Done: the gyroscopic term is linearly implicit at the midpoint, (M/dt + R - K/2) dV = F - R V with K its Jacobian in the twist formed in the body frame (zero for an isotropic body, which steps as before bit for bit), as rigid_inertial 0.3.0, with 0.2.0 kept; the rig test holds ten simulated seconds of every live rig. Open, for phase 7o: its hull contact reads the step's matrix as symmetric"
  - anomaly_id: MIME-ANO-130
    title: "On the MRS rung a wall's image is taken at the force points: near the wall the confined resistance can be indefinite, and in the tube the confinement's effect converges more slowly than the free part"
    description: >
      Drag 0.4.0 integrates the free part of the regularised-Stokeslet matrix on the kind's quadrature, finer than the
      force points, and adds a wall's correction at the force points alone, each cell's force placed at its force
      point (the cost of a step is the wall's reads at every pair of force points and the solve). Measured in phase
      7m-b (scripts/default_spacing_table.py, float64, the blob a quarter of the force spacing, the quadrature eight
      times finer): FL-9 on the axis of a 1/4 in tube, its speed per turn in the tube over its speed in free
      space at the same force points is 0.9707 at 206 force points (0.83 mm), 0.9738 at 283, 0.9884 at 416, 0.9979
      at 567, 1.0154 at 957 and 1.0273 at 1,714 (0.3 mm), still rising; over the same counts the free-space speed
      meets the shipped free-space reference within -6.1% to +0.1%. So at the coarse counts a first run takes, the
      tube's own effect on the speed (a few per cent) is mis-estimated by more than its size, and the speed in the
      tube is further from its finest spacing (estimates against a finest, 0.16 mm, still moving: -13.0% at 206 force
      points, -11.3% at the default's 222, about -12% against a fit of the ladder) than the free part is from its
      reference.

      **Near the wall the confined resistance can be indefinite, on the point forces too.** The measure, the node's
      and every number here: the least eigenvalue of the resistance with each row and column scaled by the square
      root of its diagonal entry's magnitude (a congruence, so its sign is the resistance's definiteness). Phase
      7m-b's review mapped FL-9 in the 1/4 in tube at 297 poses (spacings 0.3 to 0.829 mm; the separated quadrature
      at its defaults, under-refined, at blobs 0.1 and 0.5, and drag 0.3.0's point forces; gaps from the wall 0.05 to
      0.8 mm; rolls 0 to 7 pi / 8): 53 were indefinite, every one with the body within half a force spacing of the
      wall (the largest gap exactly half, at 0.6 mm), among them 0.3.0's point forces at every spacing mapped (-7.38
      at 0.4 mm, roll pi / 8). The fix round mapped 96 more between 0.55 and one force spacing, at eight rolls each,
      all definite (least +0.14), and the 1 mm sphere from a tenth of a spacing to one, definite. Within that band
      the sign is not a smooth function of the pose: at 0.4 mm on the defaults, centre offsets of 0.9995, 0.9998 and
      1.0000 mm on the floor give +0.42, -9.38 and -6.53, so a number quoted for a pose there holds for that pose only.
      The surrogate generator's case (FL-9 0.2 mm from the floor at its nearest point, 0.6 mm, blob 0.5, the
      quadrature four times finer) is -6.80, with every read of the table accepted (its own metric, the least
      eigenvalue over the largest entry, gave -0.64); on 0.3.0's point forces at that pose +0.79. Script A's
      experiment on the separated quadrature at the screw's defaults (0.829 mm, 222 force points), resting on the floor
      at the contact's 0.1 mm margin with the field turning from rest, builds (+0.34 at its first step) and its
      resistance turns indefinite at step 10 (t = 5 ms), evaluated at the pose the body had after step 9 (roll 0.024
      rad); unchecked, the drag put energy into the body at steps 10 and 12 and the state stopped being finite at
      step 13 (float32; float64 the same at step 10, and at 15). Even where the floor's resistance was definite the
      default's speed per turn ranged from -1,422 to +691 um, against about 600 at script A's frozen point (0.178 mm).

      **The mechanism, tested.** The review integrated the image over each cell as the free part is (the sum over a
      cell's quadrature points of G(x_m, y_q) w_q), its rebuild of the node's own step matching the node to 3e-15 to
      2e-10 as its control: at 0.4 mm (the floor a quarter of a spacing away) all eight floor rolls became definite
      (+0.74 to +0.77) and the speed 585 to 630 um per turn, the frozen point's; at 0.829 mm (an eighth) three of eight
      stayed indefinite. So the image's one point per cell is the cause from a quarter of a spacing up, and not the
      whole cause at an eighth, where the confined mobility's symmetric part is itself indefinite on nearly every
      setting mapped.

      **The image integrated over each cell, as built (the fix round, design #204).** The wall kind's image is a
      kernel between any targets and any source cells, and the step integrates it over each force point's cell on a
      quadrature wall_refinement times finer than the force spacing, each cell's weights scaled to its free area
      (unscaled, a coarse wall quadrature's cells differ in area from the free part's, and on the axis at 0.829 mm the
      speed per turn read 380 um against 298). FL-9 in the 1/4 in tube at the screw's defaults, float64: on the axis
      at 0.829 mm the speed per turn is 283.8 um with the image at the force points, 299.2 at wall_refinement 2 (on
      FL-9's grid 3, 2,014 points; 2 leaves cells empty), 298.5 at 4 and 297.6 on the whole quadrature (14,488, the
      review's test); at 0.4 mm 308.9, 311.5, 312.5 and the review's 312.1. On the floor 0.1 mm from the wall at
      0.4 mm, a quarter of a spacing: indefinite at one roll of eight with the image at the force points (-2.87),
      definite at all eight at 2 (the least +0.02, the rest +0.62 to +0.78; the speed per turn 564 to 628 um against
      the frozen point's 587 to 624), indefinite at two of the first four rolls at 4 (-1.35, -13.1) and definite at
      all eight on the whole quadrature (the review). At 0.829 mm, an eighth of a spacing: indefinite at two rolls of
      eight at the force points, three at 2, seven at 4 and three on the whole quadrature. So the resistance does not
      converge monotonically in the wall's refinement near the wall (4 was worse than 2 and than the whole quadrature
      at both spacings), and at an eighth of a spacing no refinement measured is definite. The node matches a per-cell
      rebuild of its image to 1e-13 at 2 and at 4, so it is not a slip of the assembly. The fix round's re-review
      measured the cause, the problem's conditioning there (FL-9 at 0.829 mm on the floor, an eighth of a spacing, eight
      rolls, the capped image): the integrated image converges with the refinement (the whole image moves 2.4% from 3
      to 4, 1.4% from 4 to 6 and 0.86% from 6 to 8), while the resistance moves over the same steps by 5.7, 4.8 and 9.9
      times itself (max |dR_ij| / sqrt(R_ii R_jj)); at the roll read where it is definite (roll 0, least +0.29), the
      image scaled by 1.001 moves the resistance, in that metric, by 90 to 350 times as much (171 and 348 at
      refinement 3, the integrated part scaled and the whole image; 89 and 172 at 4; 111 and 152 at 8). So there an
      image error of 1% moves the resistance by more than itself, and its sign at one refinement says nothing of the
      next (rolls indefinite of eight, capped: 2 at wall_refinement 2, which is 3 on FL-9's grid, 6 at 4, 3 at 6, 2 at
      8). That is computed at one spacing, one gap and eight rolls; the amplification at INTEGRATED_GAP's 0.36 spacings
      is not measured. It is also why a definite resistance near the wall is not shown accurate, and why the step's
      check and the near-wall flag stay. A step costs 0.13 s at the force points, 1.4 s at 2, 2.6 s at 4 and 8.7 s on the whole quadrature at
      0.829 mm, and 1.8 s, 27 s and 41 s at 0.4 mm (a 24-thread laptop CPU). The gap bound with the image in place,
      wall_refinement 2, eight rolls at each gap: indefinite at some roll at 0.15, 0.2 and 0.25 force spacings (the
      largest 0.25 at 0.6 mm, -3.14), definite at every roll at 0.3 and 0.36 at 0.6 and 0.829 mm. Definite is not
      accurate there: at 0.829 mm and 0.36 spacings the speed per turn was 411 to 460 um, and at 0.6 mm 455 to 483, with
      the image uncapped (capped, below: 407 to 444, 451 to 480, and 526 to 559 at 0.4 mm), against about 600 at script
      A's frozen point.

      **The default for a body a contact holds, by a rule fixed before its measurement (design #210).** Each cell's
      wall points capped at twice the mean, its weights rescaled to its area, so that a budget of the cells nearest the
      wall pays: at 0.4 mm on the floor a step falls from 33 s to 14 s. On the image's scale, at the six settings
      measured (FL-9 at 0.829, 0.4 and 0.277 mm, on the floor and on the axis), the capped image's largest column lay
      within 2.5% of the uncapped one and the whole image within 0.24%, against up to 75% and 12.9% at 0.829 mm, 24% and
      3.1% at 0.4 mm and 12% and 1.5% at 0.277 mm, on the floor, for the image at the force points: estimates from six
      samples, not bounds. On the resistance's scale (max |dR_ij| / sqrt(R_ii R_jj), capped against uncapped; the fix
      round's re-review), the cap moved it by 9e-6 on the axis at 0.829 mm, 1.33 spacings from the wall; by 4.3e-4 and
      1.9e-3 on the floor at 0.4 mm, a quarter of a spacing (rolls 0 and 3), 3 to 5 times its change of the image there;
      and on the floor at 0.829 mm, an eighth of a spacing and outside the opt-in's range, by 8e-4 to 1.8e-2 at seven
      rolls and 0.226 at the eighth, where the resistance is indefinite capped and uncapped (-30.8 and -27.3), the
      conditioning above. The cap flipped no definiteness at the settings in range (0.4 mm, roll 3: +0.0526 capped,
      +0.0528 uncapped). At the opt-in's own gap, 0.36 spacings (0.277 mm), its effect on the resistance is not
      measured. The capped sweep repeats the
      uncapped one (the largest indefinite 0.25 force spacings, -3.35 at 0.6 mm; definite at every roll at 0.3 and 0.36
      at 0.4, 0.6 and 0.829 mm; at 0.36 spacings 407 to 444 um per turn at 0.829 mm, 451 to 480 at 0.6 mm and 526 to
      559 at 0.4 mm), so INTEGRATED_GAP stays 0.36 and the 0.1 mm margin asks 0.277 mm (1,966 force points).
      The rule asked three things there: definite on 8 of 8 floor rolls (it was, +0.74 to +0.77), each speed within
      557.7 to 655.2 um per turn (they were, 584 to 617), and a step at most a third of the point image's 38 s, 12.7 s
      (it was 50 s at every roll; the point image at that spacing took 8 s, and one of its rolls was indefinite, -2.05). Two of the three held, so the capped image is not the default. So a body a contact holds takes the image at the force points at CONFINED_GAP,
      0.55, force spacings or more from the wall, the basis the map above (all 96 poses from 0.55 to one spacing definite, one
      indefinite at exactly 0.5), and the integrated image is written through wall_refinement, at INTEGRATED_GAP. On FL-9
      at the 0.1 mm margin that is 0.181 mm, 4,816 force points: definite on 8 of 8 floor rolls (+0.74 to +0.77), 588 to 625 um per turn, 45 s a
      step and a peak of 13.6 GiB (float64, the same CPU). The rule weighed a step's time alone, not memory: the capped
      image at 0.277 mm takes about 50 s a step and peaks at 4.0 GiB, definite on 8 of 8 floor rolls too, so on a machine
      with 16 GB or less it is the option to write (wall_refinement=2); the build report says so beside its memory.

      **What the node does (phase 7m-b's fix round).** On the separated quadrature with a wall, every step judges its
      resistance before the body takes it: one that is not positive definite where the wall's reads were accepted is
      replaced by NaN, so that the run stops at that step with drag.mrs-indefinite, naming the step, the pose, the
      body's least distance from the wall and a force spacing that clears it (that distance over CONFINED_GAP, or INTEGRATED_GAP with the image integrated), and the drag puts
      no energy in; a step with the body within one force spacing of the wall raises near_wall, and one whose
      resistance drops more than a twentieth of itself to its symmetric part raises asymmetric (0.007 to 0.012 on the
      tube's axis, 0.24 to 0.46 on its floor at 0.829 mm). The build refuses a resistance indefinite at the body's
      starting pose (drag.mrs-resistance) and reports the body's distance from the wall at its start and the spacing
      the experiment's closest approach needs. Drag 0.3.0's point forces, kept for the frozen register and the
      surrogate generator, have no step check; the generator checks each of its cases.

      **Post hoc (decision #223, from the drag 0.4.0 arm of M1 at A, run on Modal on 2026-11-03 at v0.3 5a47ef3); it
      enters no verdict.** With the point image at blob 0.5, the floored speed drifts 16% across the spacing ladder
      (7.12 to 6.12 mm/s from 0.2 to 0.1024 mm). The resistance's asymmetry reaches 0.17 at 0.181 mm and 0.43 at 0.16
      mm; every other image and blob stays at or below 0.046. At blob 0.25, drag 0.4.0's default, the same speeds stay
      within 2.6% (6.10 to 5.95 mm/s). The two blobs, and the two images, close to within 3% by 0.1024 mm. A guard on
      the blob near walls is looked at in dev2.
