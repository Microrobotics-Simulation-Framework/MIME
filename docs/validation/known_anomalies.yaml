  - anomaly_id: MIME-ANO-137
    title: "The magnetic torque reads the field at the centre of mass while the magnetic force acts at the magnet's centroid, so a body with an off-centre magnet in a field that varies in space gains net work round a closed loop of its pose"
    description: >
      Magnetic.Torque 0.1.0 and Magnetic.Force 0.1.0 disagree about where the field acts. Both read the field, and the
      force law its gradient G (G_ij = dB_i/dx_j), at the body's centre of mass x. The force law applies F = G^T m at the
      magnet's centroid, the body's magnet_centre l (turned into the world frame by the body's orientation R, from its
      parts or declared), and so delivers [F; l x F] about the centre of mass; the torque law delivers m x B(x). A point
      dipole at the magnet would carry m x B(x + R l) = m x B(x) + m x (G R l) + higher orders in l, and the pair
      misses m x (G R l), first order in l |G| / |B|. The pair is therefore not the derivative of an energy
      (U = -m . B(x + R l) is), and a body whose pose is turned round a closed loop in a static, non-uniform field
      gains net work, whatever the step. With the field and gradient constant over the loop (the body held at x, which
      is what the laws read), the work of the pair is exactly the loop integral of m . G (axis x l) over the angle, for
      a turn about a fixed axis. For a turn about x, at a point on a dipole source's axis, with the moment and lever at
      right angles, it is m l pi G_xx when m x l points along +x (the moment along y and the lever along z below), minus
      that when l x m does, and zero when they are parallel.

      Measured at one operating point (a re-run of the design pass's red-team script on the development branch's
      magnetic nodes, and the tests below, which build both laws as registered): a source of 10 A m^2 along z at the
      origin, the body 50 mm up its axis, a body moment of 1.68 mA m^2 along y, a lever of 1 mm along z, the pose turned
      once about x with no dynamics. The pair's loop work is 2.5334e-6 J, which is 2.35 % of the loop's summed absolute
      work (the sum over the steps of the absolute work of each step's total), the same at 64, 360, 3600 and 10000 steps
      a turn, and equal to m l pi G_xx to at most 0.27 roundings of the inputs' scale. The control, the same nodes
      fed B and G at the magnet's centroid (the derivative of the energy above), does zero work to rounding (1e-20 J
      against a summed absolute work of 1e-4 J). The tests also turn the body to a general orientation, with a moment and
      lever not along an axis and an oblique axis, and draw cases without a filter: 3,000 unfiltered draws (sources of 1
      to 50 A m^2 at 3 to 20 cm, moments of 0.1 to 10 mA m^2, levers of 0.2 to 2 mm, any directions, any starting
      orientation, any axis) matched the loop integral to at most 1.54 roundings (eps times the inputs' scale
      2 pi |m| (|B| + |l| |G|)), and the control did zero work to at most 1.57 of them. The work scales as m l |G|, the
      term the laws' declared validity ("valid while the field varies little across the body") leaves out, so it is
      inside that validity and small where that holds; on a dipole's axis l |G| / |B| is 3 l / d (arithmetic: 6 % for a
      lever of 1 mm at 50 mm).

      Confirmed on a dynamic closed loop through the build, a measurement on one test rig (not reproduced by a test in
      this entry): a 0.2 g swing with a link 5 cm long, on a dipole's axis, the moment 1.68e-3 A m^2 along body y, the
      magnet's centroid 1 mm along body z, spun at 400 rad/s about x, with both laws and both reactions delivered, in
      float64, at dt 0.5, 0.25 and 0.125 ms. The 0.1.0 read leaves a residual that does not change with dt: -7.25e-7 J
      over 12.38 turns, which is -5.85e-8 J a turn (the sign is that run's energy-balance convention), 0.99 of
      m l pi G_xx (5.91e-8 J) for that rig. A read at the magnet's centroid converges at first order in dt. How to
      detect it: a check of the energy over two time steps sees it only over closed turns; over 0.3 of a turn the
      0.1.0 read also converged at first order, and passed.

      Who it touches (read from the declarations): any body whose magnet sits off its centre of mass, in a field that
      varies in space: a single off-centre magnet derived from parts, or a declared magnet_centre; the magnetic
      family's conformance rig (its probe's magnet is 0.37 mm off the centre of mass, at (2e-4, -1e-4, 3e-4) m) and the
      chain test cases' 0.5 mm body are two. Not script A, whose field is uniform (zero gradient), and not the tutorial
      A0 body, whose magnet_centre is declared at the centre of mass, where l = 0 leaves no lever. Not covered by
      MIME-ANO-100, which is the point dipole source model's near-field fidelity.

      Severity: major, by the registry's table ("incorrect results, workaround exists"). The two laws model one point
      dipole at the magnet's centroid, yet read the field at two different points, so the pair is inconsistent with
      its own model and does net work round a closed loop: an incorrect result, not a validity limit. Its size is
      first order in the lever over the field's length scale, so it is small where the laws' declared validity holds
      (the field varies little across the body), and the workaround below removes it. MIME-ANO-100, the source
      model's near-field limit, is an entry of another kind.

      Resolved in magnetic.torque 0.2.0 and magnetic.force 0.2.0, which read B and G at the magnet's centroid, x + R l
      (a point the field read names fixed in the body, Read.offset, evaluated by a provider that claims
      Capability.BODY_POINTS), so the pair is the derivative of U = -m . B(x + R l): at the operating point above
      their loop work is 6e-18 of the summed absolute work in float64. The magnetic family's suite holds every magnetic
      law to it (its closed-loop case: no net work round closed loops of the pose in a drawn point dipole's field), and
      0.1.0, built through its registered entries, fails it on every draw with a lever in float64 but the geometry that
      leaves it exactly no work, and in float32 on all but the few draws below its resolution (3 of 524 in the draws
      measured; a turn's work averages to -pi (a . G a) a . (l x m), zero where the axis, lever and moment are
      coplanar). Through the build, a free body spun at 400 rad/s on a fixed dipole's axis (the rig above with its
      source fixed), judged at whole turns over three steps by Richardson's limit, 0.1.0 keeps -pi (a . G a) a . (l x m)
      a turn whatever the step and 0.2.0 no part independent of the step; with three steps and the run's own scale the
      judgement also tells them apart at fractions of a turn down to about a twentieth there, and is held at whole
      turns. 0.1.0 of both stays registered (mime.interactions.KEPT), so that a folder saved with it loads and
      reproduces and the frozen sim2real register keeps its torque, and it still carries the defect. With the magnet at
      the centre of mass, or in a uniform field, the two versions compute the same: A0, A0 on its dynamic rungs and
      script A ran the same to the last bit on 0.2.0 as on 0.1.0, in float32 and float64.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      The error is first order in the lever over the field's length scale and sits inside the laws' declared
      validity, so at a body's usual standoff it is small and not a result that misleads. For close-in gradient work
      on a body whose magnet is off its centre of mass (a lever of a millimetre at a centimetre standoff is 30 % in
      l |G| / |B| on a dipole's axis, arithmetic), a closed loop of the body's pose can gain energy from a static field, which no magnet can, and a
