      After the fix: the hold is measured on one CPU (the laptop's) and one JAX (0.12.0.1), in float32 and float64, on
      two-point cases and the tube demo's whole body in forward mode; CI's runners measure it again (the controls must
      fail on each). Not measured: a GPU, other JAX or XLA versions, a whole body's reverse-mode derivative (a
      cotangent for each of a million entries was not run; the two-point cases hold reverse mode, self-pairs
      included), a node's pose gradient through the wall, and the time the barrier adds to a derivative's program
      (none to a run's, whose program is unchanged). Second derivatives: measured in float64 only, where jax.hessian
      of the read at the ties is within 1.7e-2 of the largest entry of a central second difference, against 1.3 to 4
      before the fix [measured, the refuting review's harness]; not measured in float32, and not measurable at this
      read: the float32 Hessian is as far from the float64 one (7.0 of the largest entry at a pair nudged 1e-2 apart,
      0.4 to 3.4 at 1e-4) as at the ties, so that arm is noise and proves nothing either way. The primal inside a
      program that takes a derivative is NOT the plain program's, to the last bit: the tube demo's step (the state
      after 10 steps, a unit tangent on the ball's position across the tube, one CPU, JAX 0.12.0.1), jitted under
      jax.jvp, gives a primal output that differs from the plain jitted step's in 4 of 27 state leaves in float64 and
      5 of 27 in float32 for one step, and in 7 of 27 in both for a 5-step scan [measured]; the pose, twist,
      asymmetry, least eigenvalue and resistance, by up to 5.7e-13 (float64) and 1.5e-3 (float32, the twist over
