  - anomaly_id: MIME-ANO-131
    title: "The contact 0.1.0 holds a body's centre by its extent and never reads its orientation, so a screw that turns across a narrow tube passes through its wall"
    description: >
      Contact 0.1.0's projection keeps the body's centre the extent of its hull about its own axis, plus the margin,
      from the surface, whatever the body's orientation: a sphere of the extent about the centre. A body whose axis
      leaves the tube's reaches past that sphere. Review 7l-c (F1) found it on a screw: FL-9 with its parts'
      inertia, its axial moment the smallest as any real screw's is, under the surrogate drag and a field turning at
      5 Hz in the quarter-inch tube, turns broadside within about half a second (its tilt passes 10 degrees at 0.47 to
      0.49 s and reaches 83 to 107 degrees by 0.6 s) and, at 0.98 mm off the axis, reaches 4.7 mm from it, 1.5 mm
      through the wall, with no flag raised. Script A and A0 escaped it through their isotropic inertia, which keeps
      the axis along the tube's (a tilt of 0.24 degrees). The surrogate's tilt flags (phase 7l-c) report the tilt; the
      contact did not hold it.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A body through the wall is in no state the experiment describes, and every number read from it (its speed, its
      offset, its drag's resistance) is of a body that cannot exist, with nothing in a run to say so before 7l-c's
      flags.
    resolution_status: resolved
    affected_versions: ">=0.3.0.dev0"
    resolution_version: "0.3.0.dev1"
