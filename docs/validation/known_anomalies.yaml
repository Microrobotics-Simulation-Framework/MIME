  - anomaly_id: MIME-ANO-150
    title: "The near-contact margin: below the MRS rung's resolution the near-wall film is neither resolved nor handed to the lubrication, and the effect at script A's margin is unbounded"
    description: >
      The frozen register's entry M2 (with N2, the near-wall film anisotropy, merged into it). Script A holds FL-9 off the
      tube's wall at a contact margin of 0.1 mm, while the MRS rung's default force spacing at A is 0.178 mm: the margin is
      about 0.56 of the spacing [arithmetic]. The rung's image is taken at the force points (MIME-ANO-130), and its
      near-wall resistance is not a thin-film solution; the film below the margin, down to the roughness scale, belongs to
      the lubrication, and the hand-over between the two does not exist in dev1 (Drag.MRS does not accept it; M4 below). The
      register states no regime argument for M2, and the effect on the swim speed at A is neither measured nor bounded: it is
      unknown.

      F0's spike S4, on a sphere near a plane [measured, one geometry], found the coarse MRS's normal entry failing at gaps of
      0.4 to 0.65 spacings and refining barely helping (a threefold finer spacing moved the 5 % edge only from h/a 0.071 to
      0.046). A's margin of 0.56 spacings is inside that band, so a material effect cannot be excluded [inference; the band
      is the sphere's and FL-9's crest is unmeasured]. This is a regime argument that defers; it never rules the effect out.

      F0's decision (the design record's C3, "the frozen register's entries M2, M4 and N4's near-contact part", the
      register's amendment A8): phase W2 of the dev2 plan, the route the lift form (the coarse MRS evaluated at the pose with
      each contact's gap lifted to a hand-over gap, plus the sum over local near-contacts of the thin-film increment between
      the contact's gap and the hand-over gap). The hand-over makes the margin reachable down to the roughness scale.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      It is an unmeasured effect, not a measured small one, and the entry is marked context-dependent for that reason: a
      result at a small gap from a wall (script A's margin, a body filling a lumen) rests on a model that does not resolve
      the film there. Nothing here bounds the size.
    resolution_status: open
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "entry: interaction drag 0.4.0, rung mrs; at gaps below the force spacing"
      - "entry: interaction contact 0.4.0; the margin"
    residual_risk: >
      The size of the effect at A is unmeasured. The sphere's band does not carry over to FL-9's crest, whose cross radius is
      about the force spacing at A (0.178 mm), coarser than any configuration measured.
    workaround: "Treat a result at a gap below about one force spacing from a wall as unbounded in this respect, and read it from a spacing ladder (docs/choosing_spacing.md), not from one coarse spacing."
    planned_resolution: "Open, in phase W2a of the dev2 plan (the lift form's lubrication hand-over, F0's decision C3), in two pull requests. The first (1a) gives drag 0.5.0's mrs rung the hand-over (Drag.MRS(lubrication=), on by default near a plane or a tube) for one point contact a body, gated by the sphere near a plane against its exact solutions at every gap (tests/oracles/test_lubrication.py) and M4's replaced control (MIME-ANO-151); the margin no longer sets the force spacing there, and the roughness of each surface is where the film hands the gap to contact. The second (1b) runs the case that decides this entry: FL-9's several crests against a fine MRS with the cell-integrated image at A's floored gaps in its tube (the 0.1 mm margin), which measures M2's and M4's sign and size. Existing records that name the hand-over, MIME-ANO-114 and MIME-ANO-130, now name this phase."

  - anomaly_id: MIME-ANO-151
    title: "The lubrication is counted twice where the MRS rung already resolves part of the gap: the overlap is positive on the sphere and unmeasured on FL-9, and Drag.MRS cannot take the hand-over"
    description: >
      The frozen register's entry M4. The Lubrication node adds a near-contact resistance on top of a drag that already
      resolves part of the gap, so the two overlap. dev1's bound: switching the lubrication on moves the closed MRS rung's speed
      by -3.8 % and the script A surrogate's by -5.7 %, and the overlap lies between 0 and that term; its sign relative to
      the near-wall flow the drag resolves was unknown in dev1. Drag.MRS refuses lubrication=, and the drag 0.4.0 rung has no
      hand-over, so the register's control for M4 (a lubrication term scaled by 2 must move the speed by the predicted
      amount) cannot run: M4 has no runnable control [read, the register].

      F0's spike S4, on a sphere near a plane [measured, one geometry]: the blend over-counts by 30 to 43 % in every entry at
      A-like gaps, at spacings s/a 0.07 to 0.2, so M4's overlap is positive on the sphere analog [the amendment A8]. At A the
      force spacing (0.178 mm) is about the crest's cross radius, coarser than any configuration measured: FL-9's sign and
      size are unmeasured.

      F0's decision (C3, the register's A8): phase W2 of the dev2 plan, the route the lift form (see MIME-ANO-150), whose
      hand-over replaces the sum of the two with the coarse MRS where it holds and the thin-film increment where it does
      not.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      The overlap is bounded in dev1 only by the lubrication term itself (0 to -3.8 % on the MRS rung, -5.7 % on the surrogate),
      and its sign on FL-9 is not measured; a result that switches the lubrication on near a wall rests on a sum whose
      overlap is not removed.
    resolution_status: open
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "entry: interaction drag 0.4.0, rung mrs; its composition with the lubrication"
    residual_risk: >
      FL-9's sign and size of the overlap are not measured; the sphere's over-count of 30 to 43 % is for spacings s/a 0.07 to
      0.2 on a sphere near a plane.
    workaround: "Keep the lubrication off (the baseline does, and the register's rows for M4 are against that baseline), and read a result with it on as carrying an overlap of unknown sign on a screw."
    planned_resolution: "Open, in phase W2a of the dev2 plan (the lift form, F0's decision C3), with MIME-ANO-150. Its first pull request (1a) makes Drag.MRS take the hand-over (drag 0.5.0), so M4's replaced control runs: the film's term doubled moves the force-free speed by what the resistance and the reported increment predict (tests/oracles/test_lubrication.py, gate 7); and a second lubrication law beside it is refused (lubrication.twice). FL-9's sign and size, measured against a fine MRS in its tube, are the second pull request's (1b). The surrogate's blend (Lubrication(epsilon=...)) is unchanged until the maintainer rules on its retirement."

  - anomaly_id: MIME-ANO-152
    title: "Soft-wall lubrication is not modelled: the wall's compliance changes the film at the contact, and the near-contact part of the register's N4 is deferred to 0.4.0"
    description: >
      The frozen register's entry N4, near-contact part. The tube's PVC wall indents under the body's load. For the change of
      the gap the drag resolves, the register ranks the effect out by an analytic bound: 1 to 80 nm of Hertz indentation for a
      soft PVC of 3 to 50 MPa [inference, rescaled from P-4's silicone numbers with assumed loaded length and modulus], about
      1e-3 of the 0.1 mm margin, so about 0.02 % of the swim speed [arithmetic from the register]. Against the 0.1 to 0.8 um
      lubricating film it is comparable, and soft-wall lubrication, where the film depends on the wall's compliance, is not
      modelled at all: that part is carried by the register into the near-contact physics (MIME-ANO-150) and is not bounded.

      F0's decision (C3, the register's amendment A9): the near-contact part of N4 is placed in 0.4.0, with soft bodies and
      compliant vessels. The general thin-film model takes compliance as the same equation with a deflecting gap [recalled].
      Nothing else in N4 changes: the part that changes the gap stays ranked out by its bound.
    severity: enhancement
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      Blood vessels and other lumens are compliant; a result for a body near a soft wall at a gap of the film's scale rests on a
      model with a rigid wall. The effect at script A's gap is bounded only for the gap the drag resolves, not for the film.
    resolution_status: open
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "entry: interaction drag 0.4.0, rung mrs; at gaps of the lubricating film's scale, with a compliant wall"
    residual_risk: >
      The indentation numbers are a rescaling with assumed loaded length and modulus; a line contact would give a smaller
      value; nothing is measured for a compliant wall at a gap of the film's scale.
    workaround: "Treat a result for a body within the lubricating film's scale of a soft wall as unbounded in this respect; for a rigid-wall experiment (script A's tube as modelled) nothing is needed."
    planned_resolution: "Deferred to 0.4.0 (soft bodies, compliant vessels), where the thin-film model takes a deflecting gap (F0's decision C3, the register's A9). This entry changes no code."

  - anomaly_id: MIME-ANO-153
    title: "The coil array's sign convention is mag_manip's, and ETH's measured Navion_2 data disagree with ETH MSRL's published calibration by a global sign: which side is flipped is not known"
    description: >
      The calibrated multipole's coil field (calibrated_multipole 0.1.0) follows mag_manip's convention, which its
      software oracle pins (tests/oracles/test_calibrated_multipole.py, against mag_manip 3.0.0). The 0.2 line compared
      the same calibration with ETH's measured Navion_2 data, a 121-Hall-sensor validation set, and found a global sign between
      them: a correlation of r = -0.9942 raw and +0.9942 with the field negated, which it read as a clean global flip, not
      a wiring permutation (over all six coil permutations and eight sign patterns, identity with (-1, -1, -1) won at
      1.30 mT, the next best at 13.3 mT) and not a frame rotation (a global flip has determinant -1; a proper rotation
      cannot flip all three comparable components). The same source quotes 2.34 mT RMSE for the flipped comparison in
      another passage; which metric each of the two figures is, it does not record, and neither the measured set's
      reading nor its script is in the 0.2 tree [read: src/mime/nodes/actuation/coil_array_field.py at the tag pre-0.3,
      its field_sign parameter and hazard hints].

      Which side is flipped is not known: a sign-symmetric excitation cannot tell a calibration's
      polarity from the rig's current or sensor convention, and ETH's own validation metric (convex-hull distances over a
      symmetric current box) is invariant under B -> -B, so neither would have been caught. 0.2 carried a field_sign
      parameter, default +1; 0.3 does not carry one: the convention is stated, not a setting. Gradient pull on a field-aligned body is invariant under the flip (F proportional to grad
      |B|^2); the torque on a fixed moment, m x B, flips, and so does which way a permanent-magnet body turns to align.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A result that depends on the direction a fixed moment turns in an eMNS field (torque-mode steering, a permanent
      magnet's alignment) is wrong in sign if the hardware's convention is the other one; a result on gradient pull of a
      field-aligned body is not affected. No software check can tell which: mag_manip agreement pins the convention, not
      the hardware's.
    resolution_status: open
    affected_versions: ">=0.3.0.dev2"
    affected_components:
      - "entry: field_provider calibrated_multipole 0.1.0; its sign convention against hardware"
    residual_risk: >
      The measured comparison's numbers are the 0.2 line's, read from its source, not re-measured here; the measured set
      would be an acceptance test of sign and frame against hardware, not an accuracy claim, and it is not run in 0.3.
    workaround: "Establish the sign convention on your own hardware (a measured field at a known current, read with a sensor of known orientation) before relying on the direction of rotation; nothing is needed for gradient pull on a field-aligned body."
    planned_resolution: "Open: an acceptance test of sign and frame against measured hardware data (the measured Navion_2 campaign, re-read with its script) would settle which side is flipped. This entry changes no code."

  - anomaly_id: MIME-ANO-154
    title: "Below the hand-over gap the thin film's form of the near-contact law over-counts the coupling of rotation and translation against its own size, at every gap: open for every kind but the sphere, whose exact form closes it near a plane and in a tube at sphere-to-tube ratios of 0.22 to 0.34; open for a sphere in a tube above 0.34, where its rolling along the axis misses by -18 % at 0.40 and -25 % at 0.46"
    description: >
      Drag 0.5.0's lubrication hand-over (the lift form: the coarse MRS with the contact opened to the hand-over gap h_m,
      plus the thin film's increment TF(h) - TF(h_m)) holds every entry of a sphere's resistance above a plane within 7 % of
      the exact answer on the scale the entries are judged on (each diagonal against itself, the couplings on
      sqrt(R_tt R_rr): W2a's gate 1, at force spacings of 0.15 and 0.2 radii, gaps 0.002 to 0.3 radii, but the normal at
      0.06 radii at a spacing of 0.2, -6.7 to -7.4 % over orientations). Judged against itself, the coupling is not: the
      translation of a force-free sphere spun on the wall per rotation, U / (a Omega), reads at a force spacing of 0.2
      radii (h_m 0.15) +7.8 %, +28 %, +38 % and +43 % at gaps of 0.15, 0.1, 0.075 and 0.06 radii against the method of
      fundamental solutions (resolved to 2e-4), and +41 %, +34 %, +28 % and +25 % at 0.01, 0.005, 0.002 and 0.001 radii
      against Goldman, Cox and Brenner's lubrication asymptotes (whose own error there is under about 2 %); at a
      spacing of 0.15 radii (h_m 0.1125) +9.6 %, +20 % and +27 % at 0.1, 0.075 and 0.06, and +33 %, +27 %, +23 % and
      +20 % at 0.01 to 0.001. The coarse MRS alone (lubrication=False) reads -12.3 to +1.1 % at 0.06 to 0.15 radii
      [measured: W2a's PR 1a and its fix round, float64, a sphere of 1 mm, blob 0.05, through the drag node].

      The cause, measured: it is the film's form at the hand-over gap, not a defect. Between the contact's gap and h_m
      (0.15 radii) the film's increment carries 0.69 to 0.71 of the exact increment of the force along the wall, 0.82
      to 0.84 of the normal's and 0.73 to 0.75 of the rotation's, and 1.77 to 1.83 times the exact increment of the
      coupling about the centre, the same at 65, 129 and 257 grid nodes; between two gaps below the hand-over gap
      (0.001 to 0.005, 0.002 to 0.01 radii) every entry matches the asymptotes within 4 %, so the singular terms, the
      frame, the arm and the sign are right, and the miss is a constant the film adds at h_m that does not cancel. The
      film's width there, sqrt(2 a h_m), is about half the radius, where the gap is not small against the radius: the
      increment depends at O(1) on how far the film's patch reaches, the coupling most (a small difference of the
      contact's coupling and the arm times the force along the wall). The record's own form, the gap from both
      surfaces' signed distances on a patch of one, two and three times the film's width at h_m, moves the coupling
      at 0.01 radii from +48 % through -13 % to -54 % and puts the normal 7.9 to 14 % off at 0.06: no patch holds every
      entry, so it was not taken.

      Closed for spheres by W2a's PR 1b-i: the near-contact law (mime.nodes.hydro.near_contact) gives a sphere its exact
      increment, the plane's exact remainder from MIME's table of the bispherical solutions (sphere_plane_resistance)
      with the contact's own singular terms (the body's curvature in them), in place of the film. Measured through the
      node at drag 0.5.0's family spacing (a 1 mm sphere, 0.251 radii, h_m 0.188 radii, blob 0.05, float64): above a
      plane the sphere spun on the wall translates within 1.2 % of the exact rate at every gap 0.3 to 0.001 radii
      against the graded MFS, every entry within 2.8 % (the normal, the coarse MRS's own at the hand-over gap); in a
      straight tube at sphere-to-tube ratios 0.22, 0.28 and 0.34, the rolling round the circumference within 3.3 % of
      the plane's rate and along the axis -3.6, -7.0 and -12 % against an independent tube MFS (the plane's form there,
      44 to 57 % round the circumference), every diagonal entry within 4.7 % of the MFS where it resolves the entry. The
      rolling along the axis there, -3.6, -7.0 and -11.9 % of the plane's rate at the family's spacing (-2.7, -5.2 and
      -8.9 % at a spacing of 0.2 radii; gaps of 0.1 to 0.0075 radii; a finer spacing lowers it), is a stated limit, the
      maintainer's decision (design row #360), stated in the validity line and the build report. The tube is closed only
      within 0.22 to 0.34. Above 0.34 it is open: the rolling along the axis misses the tube MFS by
      -18 % of the plane's rate at a ratio of 0.40 and -25 % at 0.46 (the PR's review's tube MFS rows, resolved: levels
      B against C within 0.65 % on that scale; pinned by tests/oracles/test_near_contact.py), round the circumference
      and the normal within 4 % and 6 %; a step there within the opening's band raises handover_tube_ratio, and the
      build report says so. The thin film's form, which every other kind still takes, is unchanged: its numbers above
      are the film's on a sphere given that form.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A body rolling on a wall by hydrodynamics alone (the rolling arm's stage 1) moves by this coupling: at every gap
      below the hand-over gap its speed per rotation is over-counted, by up to 43 % at the window's widest spacing and
      still by a fifth at a thousandth of the radius.
    resolution_status: partially_resolved
    affected_versions: ">=0.3.0.dev2"
    affected_components:
      - "entry: interaction drag 0.5.0, rung mrs; with near_contact in the thin film's form (every kind but the sphere), at every gap below the hand-over gap"
      - "entry: interaction drag 0.5.0, rung mrs; with near_contact in the sphere's form in a tube past a sphere-to-tube ratio of 0.34 (handover_tube_ratio), at every gap within the opening's band"
    verification:
      - "tests/oracles/test_near_contact.py::test_gate2_a_sphere_spun_on_the_plane_translates_at_the_exact_rate_at_every_gap"
      - "tests/oracles/test_near_contact.py::test_gate2_in_a_tube_the_hybrid_rolls_at_the_tube_mfss_rates"
      - "tests/oracles/test_near_contact.py::test_gate1_every_entry_within_its_line_at_every_gap_and_drawn_orientation"
      - "tests/oracles/test_near_contact.py::test_above_the_gated_ratio_the_step_is_flagged_and_the_along_axis_miss_is_the_measured_one"
    residual_risk: >
      For every kind but the sphere: the film's form was measured on a sphere given it, above a plane at four spacings
      (0.1 to 0.2 radii), and the MIME-ANO-154 probes measured it on prolate spheroids lying on a plane, the rolling
      rate up to 86 % off at aspect 2 (238 % in aspect 4's small roll about its long axis) at a hand-over gap of 0.15 of
      the minor semi-axis. Each entry on its own diagonal scale is within 7 % on the sphere, so a result that does not
      rest on the coupling against its own size is less affected. A sphere in a tube is gated at ratios 0.22 to 0.34 and
      measured at 0.40 and 0.46, where the miss along the axis grows with the ratio; past 0.46 it is not measured.
    workaround: "For a sphere near a plane, or in a tube at a sphere-to-tube ratio up to 0.34, none is needed; in a tube above 0.34 none is built: the step raises handover_tube_ratio and the rolling along the axis carries the measured miss (at 0.34 it was -8.9 % at a hand-over gap of 0.15 radii against -12 % at the family's 0.188, so a finer force spacing narrows it there). For another kind's rolling, read the speed per rotation from a ladder of force spacings: the over-count falls with the spacing (at 0.01 radii: +41 % at a spacing of 0.2 radii, +33 % at 0.15, +30 % at 0.133, +23 % at 0.1; in the band at 0.06 radii: +43 %, +27 %, +21 %, +8 %), at a cost that grows with the force points (a step 0.5 s at 0.2, 1.1 s at 0.133, 3.3 s at 0.1 on a runner)."
    planned_resolution: "Resolved for spheres near a plane and in a tube at sphere-to-tube ratios of 0.22 to 0.34 by the near-contact law's sphere form. Open for a sphere in a tube above 0.34 (flagged, handover_tube_ratio), a known limitation: the hybrid's miss along the axis grows with the hand-over gap against the lumen's radius [inference, not measured], so a finer force spacing there, or the tube's own exact remainder in place of the plane's, are the routes, neither built. Open for other kinds, a known limitation: a closed form from the contact's curvatures alone (the elliptic contact's singular terms, which the near-contact seam takes as another form) waits on the maintainer's word on the follow-up probe's spheroids, where it removes the film's failures on the long-axis roll and costs accuracy on tilted bodies; across the alpha releases, a per-body remainder from a fine reference."

  - anomaly_id: MIME-ANO-155
    title: "Reverse mode through MADDENING's run_scan in a shape leaf remakes the MRS rung's held matrix at every backward step: 32 to 660 s for a gradient MIME's chunked run takes in about a minute"
    description: >
      The MRS rung's node holds the body's free part, a matrix made once per build from the body's shape leaves (its
      radius, its kind's numbers, its placement and its blob) and made again from the traced leaves where a derivative
      is taken in one (held_or_made). MIME's own runs make it once a run: a study's derivative and MIME's chunked run
      (chunk_function) take the nodes' run-constants before their chunks, outside the scan. MADDENING's own scan
      (graph.run_scan) has no such seam, so a reverse-mode derivative through it in a shape leaf makes the matrix again
      at every step of the backward pass, and an outer jit around it fails on a host conversion there. Measured on the
      lubrication probe's sphere of 1 mm above a plane (drag 0.5.0's mrs rung with its hand-over, float64, CPU, a
      4-vCPU GitHub runner, 10 steps; probe run 42860822450): the gradient in the radius took 32 to 660 s through
      run_scan at hand-over gaps of 0.15 and 0.075 radii (a third gap, 0.0375 radii, has no reverse-mode figure: its
      reverse arms did not complete in that run), and in the plane's offset, a leaf
      the matrix does not depend on, 1.4 to 8 s; through MIME's chunked run the radius took 3.6 to 62 s (run
      42869205448), six to 31 times the forward run, the matrix's derivative made once a chunk. The values and
      derivatives are the same either way; only the time differs.
    severity: minor
    safety_relevance: not_safety_relevant
    safety_relevance_rationale: >
      No value or derivative changes: the matrix made again at every backward step is the same matrix. A derivative
      through MADDENING's scan in a shape leaf is slow, or fails to compile under an outer jit with an error that says
      so; nothing is returned wrong.
    resolution_status: open
    affected_versions: ">=0.3.0.dev2"
    affected_components:
      - "entry: interaction drag 0.5.0, rung mrs; a reverse-mode derivative in a shape leaf through MADDENING's run_scan, not through MIME's own runs"
    residual_risk: >
      Measured on one sphere at two hand-over gaps; a larger body's matrix costs more to make (it grows as the square
      of the force points), so the gap between the two paths grows with it.
    workaround: "Take the derivative through MIME's own path, Study.gradient or the chunked run (mime.build._maddening.chunk_function), which makes the held matrix once a run, not through graph.run_scan."
    planned_resolution: "Open, MADDENING Ask 51: its scan's run-constant seam extended to a held value that depends on a traced leaf, so that a node's held matrix is made once a run through run_scan as it is through MIME's chunked run. This entry changes no code."

  - anomaly_id: MIME-ANO-156
    title: "The MRS rung's resistance differentiated in a sphere's radius near a wall misses two builds' difference, by a few per cent at half a radius and by a quarter or more nearer, with or without the hand-over"
    description: >
      Drag 0.5.0's mrs rung on a 1 mm sphere at a written force spacing of 0.251 mm (blob 0.05, float64, the node's own
      step): the derivative of the node's resistance in the sphere's radius leaf (shape_radius), by reverse mode, equals
      the central difference of the same build with the leaf moved by a relative 1e-3 to the difference's own
      truncation, and misses the central difference of two builds at a radius 1e-3 larger and smaller. With the
      hand-over off (near_contact=False), above a plane: the normal +0.7, +1.7 and +3.3 % at gaps of 0.5, 0.3 and 0.15
      radii, the couplings of a translation along the wall and a rotation +4.1 to +5.2 % (y's -2.0 % at 0.15), and at
      0.05 radii, a fifth of the spacing, the normal -60 % and a coupling -164 %; in a straight tube at a sphere-to-tube
      ratio of 0.28, the normal -3.0 to -7.2 %, round the circumference's translation -1 to -12 % and its coupling -0.8
      to -33 %, along the axis's coupling +4.2 to +62 % at 0.5 to 0.15 radii. With the hand-over on (its default near a
      wall that opens): above the plane the normal and the coupling within -4.2 and -5.4 %; in the tube the normal +1.8,
      +7.7, +24.5 and +8.1 % at 0.5, 0.3, 0.15 and 0.05 radii, the coupling along the axis -29 % at 0.05 [measured: W2a
      PR 1b-i's fix round, probe run 42980019668, arm radius-off, reproducing its review's runs 42968413012 and
      42972714723]. The near-contact law's own increment matches two builds to 2.3e-6 (tests/oracles/test_near_contact.py's
      gate 13), so the miss is the MRS rung's.

      Not established: what the build holds that depends on the radius and that the leaf does not move. Not the count of
      force points: the three builds hold 338 each [measured, the same arm]. A value the build fixes from the radius
      otherwise (the quadrature's counts, the wall's image cells chosen at the build, a table read at a fixed point) would
      give this [inference]; mime.testing.two_builds_of with run=False compares the two builds' programs, not a value they
      hold, so it cannot see one.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A gradient study or a fit in a sphere's radius near a wall follows the derivative the node returns, which is the
      derivative of one build's resistance and not of the resistance a rebuild at the new radius gives: a descent can stop
      where a rebuild's resistance is not stationary, or step the wrong way where the two differ in sign. Nothing is
      flagged. Forward runs at a fixed radius are not affected.
    resolution_status: open
    affected_versions: ">=0.3.0.dev2"
    affected_components:
      - "entry: interaction drag 0.5.0, rung mrs; a derivative in a sphere's radius near a wall, with the hand-over on or off"
    residual_risk: >
      Measured on one sphere at one force spacing, above a plane and in one tube; other kinds' shape leaves, other
      spacings and the far field are not measured, and whether the drag 0.4.0 mrs rung shares it is not measured.
    workaround: "Take a derivative in a shape leaf near a wall from two builds' difference (the study's own finite-difference route) rather than through the node, or check the node's derivative against one before relying on it."
    planned_resolution: "Open, before a fit or a descent in a shape leaf relies on the MRS rung near a wall: find the held value that depends on the radius (the two builds' force points and quadratures compared first), and make it a leaf or make the two-builds check run the step. This entry changes no code."

  - anomaly_id: MIME-ANO-157
    title: "In float32 below a step of about sqrt(ulp(z) / a), the frictionless hull hold leaves a resting body's twist an approach speed into the wall that its frozen position never takes; on the friction spike's prototype a resistance near the wall turned it into a load"
    description: >
      A body held by its hull (the contact 0.5.0 and 0.4.0, rigid_inertial's hold) resting on the wall under a load
      that accelerates it into the wall at a, in float32: once a step moves its normal coordinate z by less than half an
      ulp (dt |v_n| < ulp(z) / 2), the position stops moving a part of an ulp, delta, above the shrunk wall (the wall's
      place is not on the coordinate's grid), and the hold's allowance max(g, 0) / dt lets the twist approach the wall at
      delta / dt each step, which the position never realises. Below dt* = sqrt(ulp(z) / a) that speed is not removed
      within a step. Measured [W2b's first step, probe run 43000792276]: through the released node (no friction, no
      resistance), a 1 mm sphere on a 3.175 mm tube's floor lands after 1189 steps of 0.1 us where float64 lands after
      142, and carries up to ulp / (2 dt) of normal speed in its twist (1.2 mm/s at 0.1 us; 0.39 mm/s at 0.3 us); in a
      50 mm tube (ulps 16 times as large) it had not landed in 3000 steps at 0.1 us. On the friction spike's prototype of
      the same step with a resistance near the wall (the done case's sphere in glycerol, its squeeze film's R_zz 0.663 N
      s/m), the unrealised approach speed (2.95e-5 m/s, delta / dt) drew R_zz delta / dt from the film, so the contact
      carried 0.29 of the load at 0.36 us and 0.93 at 3.6 us (dt* 3.1 us), and none with the plane 10 mm from the origin.
      The released node's load split under a near-wall resistance, and how far a frictionless trajectory moves with
      it, are not measured (the split above is the prototype's). With friction its bound mu lambda_n would fall with
      it: W2b's frictional hold takes the gap less its rounding band, and at the one operating point measured (the
      spun sphere at 0.36 us, its gate G7) its error is float64's (2.52e-5 against 2.58e-5 of a omega0, the contact
      carrying the whole load). float64's dt* is below 1 ns.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A float32 run at sub-microsecond steps, or one whose body sits far from the world's origin (the threshold grows
      as the square root of the coordinates' size: about 20 us at 5 cm), with a resistance near the wall, reports a
      contact force below the load and a film force above it, and a twist with a normal speed the body does not have.
      Nothing is flagged. float64 runs, and float32 runs at steps above the threshold, are not affected.
    resolution_status: open
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "node: RigidInertialNode; its frictionless hull hold (hull_held), the contact 0.4.0 and 0.5.0, in float32"
    residual_risk: >
      Measured on a sphere through the node and on the spike's prototype with a constant resistance; other kinds, a
      resistance delivered by the MRS rung, and the projection's own pass at such steps are not measured.
    workaround: "Run in float64 at sub-microsecond steps or far from the origin, or keep dt above sqrt(ulp(|x|) / a); the frictional hold takes the gap's rounding band (measured at one operating point, gate G7 of W2b)."
    planned_resolution: "Open: the frictionless hold's allowance less the gap's rounding band, as the frictional hold takes it, moves the released programs' bits, so it waits for a release that may move them (the next minor release's bits review); this entry changes no code."
