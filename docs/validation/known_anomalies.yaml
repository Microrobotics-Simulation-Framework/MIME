      - "tests/oracles/test_tube_tie_derivative.py::test_under_a_barrier_on_the_sine_the_derivative_through_ties_holds"
      - "tests/oracles/test_tube_tie_derivative.py::test_control_under_a_barrier_on_the_sine_the_read_before_the_fix_takes_a_tie_of_the_wrong_sign"
      - "tests/oracles/test_tube_tie_derivative.py::test_the_read_itself_is_the_program_before_the_fix_to_the_last_bit"
