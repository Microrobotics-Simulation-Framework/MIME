  - anomaly_id: MIME-ANO-146
    title: "The arm-tracking controller's home pose reaches the run through the controller's held write and not through params, so a check of the step's parameters does not see it"
    description: >
      mime.control.ArmTracking (arm_tracking 0.1.0) takes its home pose as a DESIGN setting, uses it in the build to find
      the home pose's end-effector frame, and holds the home joint positions as the controller's first write
      (held={"joint_positions": home}) [read]. The graph's step then reads that write as an external input. The home pose
      is not a leaf of the node's params, so a change of it leaves the step's traced program unchanged.

      Found by F0's bake-check spike, on the registry's tracked_rpm case, two builds that differ in the controller's home by
      a relative 1e-6 [measured, float64, one pair of the case's 23]: the step's program was identical (a check that traces
      the step with the params tree as an argument stayed quiet), no leaf moved, and the run moved by 1.3e10 units in the
      last place of the magnetic force's scale over 5 steps. So a check or an override that works on the step's params does
      not reach this value, and a check that traces the step alone cannot see it. What a sweep over the home pose does in
      today's code (whether an override refuses it, ignores it or applies it from the build) was not measured here.

      Detected by lane S's S-F0-1, not fixed: the two-builds check compares the graph's external inputs as well as the
      step, and on this case, with the home moved by a relative 1e-6, 1e-5 and 1e-4, its trace form is quiet, no leaf
      moves, the held inputs move and its run form fires at least four times above its line, so its verdict is
      outside-step [measured, float64]. The controller holds its pose in float32, so a move below about 6e-8 does not
      reach the run. Read: an override of a run whose controller is called on the host is refused (override.callback), and
      each member of a study makes its own law from its own settings, so no merged path runs one member's home for
      another's.

      Partly resolved by lane S's S-F0-3b (settings the compiled step reads are leaves where a study's axis names them),
      and its review found what that leaves open [measured, float64, graph mode, 8 ms]: ``home`` is read only by the
      controller node's start, so in the graph mode it is neither a leaf nor a held input. The two-builds check on two
      graph-mode ``tracked_rpm`` builds with ``home`` moved by a relative 1e-6 and 1e-4 gives the verdict ``quiet`` (the
      trace form not fired, no leaf moved, no held input moved, the run form's ratio 0.0), while the two runs differ by
      3.2e-4 relative in the magnetic force wrench at 1e-4. The same check on the callback build gives ``outside-step``.
      So for a start-only setting in the graph mode the check now says two runs agree that do not, and says it without
      a sign, where it used to report.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      The value is applied at build and moves the run as it should when the experiment is built again. The risk is a
      study, a check or an override that assumes everything that moves a run is a params leaf: it would miss the home pose
      and report that two runs agree when they do not. Whether that matters depends on how a deployment varies the
      controller's settings.
    resolution_status: partially_resolved
    affected_versions: ">=0.3.0.dev1"
    resolution_version: "0.3.0.dev2"
    affected_components:
      - "entry: controller arm_tracking 0.1.0; the home setting and the controller's first write"
    verification:
      - "tests/two_builds/test_outside_step.py::test_a_callback_controllers_setting_is_reported_outside_the_step[1e-06]"
      - "tests/two_builds/test_outside_step.py::test_a_callback_controllers_setting_is_reported_outside_the_step[1e-05]"
      - "tests/two_builds/test_outside_step.py::test_a_callback_controllers_setting_is_reported_outside_the_step[0.0001]"
      - "tests/two_builds/test_outside_step.py::test_control_the_same_controller_built_twice_fires_neither_form"
      - "tests/gradients/test_controller_leaves.py::test_a_sweep_of_a_setting_the_step_reads_is_one_group_one_compile_and_each_member_its_own_build"
      - "tests/gradients/test_controller_leaves.py::test_without_an_axis_the_controller_holds_no_leaf"
      - "tests/gradients/test_controller_leaves.py::test_the_derivative_in_a_controller_setting_is_the_rebuilt_central_difference"
      - "tests/gradients/test_controller_leaves.py::test_a_setting_only_the_start_reads_is_carried_by_each_points_start"
      - "tests/gradients/test_controller_leaves.py::test_control_a_setting_read_through_self_is_refused_exactly"
      - "tests/gradients/test_controller_leaves.py::test_the_tracking_controllers_numbers_read_through_its_context_sweep_as_one_group"
      - "tests/gradients/test_path_and_refusals.py::test_a_callback_controllers_path_is_cut_refused_unless_acknowledged_and_never_silently_zero"
      - "tests/two_builds/test_outside_step.py::test_a_start_only_setting_in_the_graph_mode_is_quiet_to_the_check_while_the_run_moves"
    residual_risk: >
      Open: a setting only the law's start reads (``home``, in the graph mode) is not seen by the two-builds check, which
      says ``quiet`` of two builds whose runs differ by 3.2e-4 relative at a 1e-4 move of ``home``; a study's point
      carries it through each point's start, so a study is right, and a script that compares two builds with the check
      alone is not. One controller was measured; whether another controller's start-only settings reach the run the same
      way is not known. Settings the step reads, as a leaf, are held by tests/gradients/test_controller_leaves.py; the size of the
      effect of ``home`` is the case's, not a bound.
    workaround: "Compare two builds that differ in a controller's start-only setting by their runs (the run form's ratio is blind to it in the graph mode), not by the check's verdict alone; a study's points are right as they are. In the callback mode the check reports it (outside-step)."
    planned_resolution: "Done for the settings the compiled step reads, in lane S's S-F0-3b, which makes a controller's settings leaves where a study's axis names them (controller.<setting>): a sweep of one is one program, an override runs as data, a derivative passes through it, and one read through self is refused exactly (controller.setting-unread). Open for a start-only setting in the graph mode: the two-builds check would need to compare the controller node's initial state and first write as well as its step's parameters, which no PR has done; it is named for the next piece that touches the check. The callback mode stays outside params by design: the law is made on the host from each member's settings, an override is refused (override.callback), a derivative's path through it is cut (refused unless acknowledged, its writes then held as the forward run made them), and the check reports the home pose outside-step. The alternative, every numeric setting of a controller inside the compiled step a leaf whether named or not, went to the maintainer with its cost: A0's graph-mode bits to measure."

  - anomaly_id: MIME-ANO-147
    title: "In reverse mode the MRS rung's held-or-made resistance is made again at every step of the backward loop, about 0.5 s a step on 222 force points, whether or not a setting moved"
    description: >
      Drag 0.4.0 on the separated quadrature holds the body-frame resistance made at build and makes it again in the step
      only where a body setting has moved (mime.nodes.hydro.mrs._quadrature.held_or_made, a conditional with a custom
      JVP) [read]. Its custom JVP computes make's tangent by forward mode through a checkpointed make "so that the reverse
      mode makes the value again from theta" (the docstring), whether or not a setting moved [read]; the cost of that
      choice in a long reverse run is what this entry records.

      Measured by F0's bake-check spike [one agent's evidence, one size, CPU, single-threaded, float64]: FL-9's shell in free
      space at 0.829 mm, 222 force points (a 666-wide dense solve), one body, a jitted lax.scan of the graph's step.
      - Forward: the conditional is hoisted out of the scan's loop by XLA's CPU compiler, unbatched and under vmap: a moved
        setting costs one remake a call (36 to 41 ms), a step's slope 0 within 0.03 ms. Under vmap of 4 a held run pays the
        remake once too (171 ms against 0.9 ms). A control that made the remake loop-variant (the radius plus 1e-300 times
        the pose) put the 666-wide LU inside the loop at 35.0 ms a step.
      - Reverse (the value and gradient of a loss of the final pose in the radius): the LU is inside the backward loop, held
        or moved: 471 ms a step held and 525 ms moved (20 and 40 steps), against 0.50 s for the whole 20- or 40-step gradient
        of a form that makes the resistance once before the scan (its VJP once), which gave the same value and gradient to
        8.8e-16: 19 to 40 times less at those lengths.
      The values are the same; the cost is not. Not measured: a GPU, other sizes, the node with a wall (where the step solves
      the turned free matrix plus the image anyway), the dev2 study layer's batched scan.

      Resolved by lane S's S-F0-1. The held-or-made resistance is the MRS node's run-constant (MimeNode.run_constants):
      MIME's chunked runs (the chunked scan with flags, the batched scan, and chunk_function, the chunk as a pure function
      to differentiate through) make it once per chunk inside the program, before the step loop, and the loop's steps
      read it as given; held_or_made compares the step's leaves with held_from leaves, never the build's values as
      constants. Measured on FL-9's shell in free space at 222 force points, float64: the reverse-mode gradient of a loss
      of the final pose in the radius moved 1 % (so the resistance is made from it), through the chunk, equals the one
      through MADDENING's scan of the step to 1e-12 of its size at 20 steps; in the chunk's compiled program, value and
      gradient, the 666-wide LU sits outside the scan's loops only, and in the per-step form's program it sits inside the
      backward loop (the control). Forward, MIME's chunked scan, MADDENING's scan of the step and the step with the
      build's values as constants give the same arrays bit for bit, in free space and with the tube's wall, float64 and
      float32.
    severity: minor
    safety_relevance: not_safety_relevant
    safety_relevance_rationale: >
      It changes the time and memory of a gradient through a run, not a value: the form that makes the resistance once gave
      the same value and gradient to 8.8e-16 relative in float64. A run that takes too long may not be finished, which does
      not change any output that is produced.
    resolution_status: resolved
    affected_versions: ">=0.3.0.dev1, <0.3.0.dev2"
    resolution_version: "0.3.0.dev2"
    affected_components:
      - "entry: interaction drag 0.4.0, rung mrs; the held or made resistance (held_or_made) in reverse mode"
    verification:
      - "tests/two_builds/test_run_constant_seam.py::test_reverse_mode_through_the_chunk_equals_the_per_step_form"
      - "tests/two_builds/test_run_constant_seam.py::test_the_chunks_lu_sits_outside_its_loops"
      - "tests/two_builds/test_run_constant_seam.py::test_control_the_per_step_forms_lu_sits_inside_its_backward_loop"
      - "tests/two_builds/test_run_constant_seam.py::test_forward_the_seam_the_steps_own_comparison_and_the_literal_one_are_bit_for_bit[free_ball-float64]"
      - "tests/two_builds/test_run_constant_seam.py::test_forward_the_seam_the_steps_own_comparison_and_the_literal_one_are_bit_for_bit[free_ball-float32]"
      - "tests/two_builds/test_run_constant_seam.py::test_forward_the_seam_the_steps_own_comparison_and_the_literal_one_are_bit_for_bit[mrs_tube-float64]"
      - "tests/two_builds/test_run_constant_seam.py::test_forward_the_seam_the_steps_own_comparison_and_the_literal_one_are_bit_for_bit[mrs_tube-float32]"
    residual_risk: >
      What the tests hold is where the LU sits in the compiled program, not the backward time. The time was measured
      twice, by scripts not kept in the repository: the spike's (0.50 s for the whole gradient of the derive-once form,
      against 471 ms a step), and the build's, through the chunk against the per-step form, one CPU, float64, 222 force
      points: 0.30 s and 0.33 s against 5.43 s and 10.24 s at 20 and 40 steps (17.9 and 30.9 times) [measured once]. A gradient
      taken through MADDENING's own scans (its run scan, its history scan, graph.step), which keep the step's own path,
      still makes the resistance again at every backward step; MIME's gradient path (lane S's S-F0-3) goes through the
      chunk. Measured at one size (222 force points), on one CPU.
    workaround: "Differentiate through MIME's chunk, which the chunked runs (the flagged run, a study's batched run) already use, not through MADDENING's scans; the function that gives the chunk as a pure function, mime.build._maddening.chunk_function, is private until lane S's gradient phase names a public one."
    planned_resolution: "Done in lane S's S-F0-1: the run-constant seam; MIME's chunked runs make the resistance once per chunk, before the step loop."

  - anomaly_id: MIME-ANO-148
    title: "Seen on a worktree before the fix of MIME-ANO-138: in float32 the screw's held resistance differs between a process's first build of a document and later builds by 2.4e-10 of its largest entry; whether the head still does it is not measured"
    description: >
      F0's bake-check spike built the registry's mrs_free_space case (a ball, a pill and FL-9's screw, each on drag 0.4.0)
      three times in one float32 process and compared each body's held_in_body_frame leaf: the screw's held value
      differed between the first build and every later one by 2.4e-10 of its largest entry; the ball's and the pill's were
      identical; in float64 all were identical [measured, one case, one process kind]. The spike's worktree is dev1 with the
      P1a spike commits, and its cap_rings returns the cached layout's arrays as the same objects on every call
      (src/mime/scene/_caps.py): it does not carry the change of MIME-ANO-138, which gives every caller its own copies
      [read, compared by hand]. MIME-ANO-138 records the same signature (the screw, float32 only, the first build against
      the rest) with a mechanism that depends on those shared arrays, and is resolved on this branch with tests that hold
      three builds' matrices equal in float32 for the screw and the cylinder (tests/oracles/test_mrs_builds_alike.py).

      So this entry is a candidate duplicate of MIME-ANO-138 that was seen on code without its fix [inference]. It is not
      closed as one because the sizes do not match: MIME-ANO-138 measured the held matrix's inputs differing by 2.0e-7 and
      3.5e-7 and the resistance by 1.1e-5, where the spike measured 2.4e-10 of the held leaf's largest entry, and the
      spike did not run MIME-ANO-138's test or its example on a branch that has the fix. Whether a build on this branch
      still differs between the first and later builds in float32 is therefore not known.

      Measured by lane S's S-F0-1, with the spike's own script, three builds of mrs_free_space in one float32 process
      each: on the spike's worktree the screw's held value differs between the first build and the later ones by 2.35e-10
      of its largest entry; with MIME-ANO-138's change (cap_rings handing out copies) patched into that worktree, by 0; on
      the branch's tip, by 0, by three routes (builds of the experiment, builds of its document, the spike's script)
      [measured]. So it is MIME-ANO-138 seen on code without its fix, and is closed as its duplicate. Why it is so much
      smaller here than MIME-ANO-138's 1.1e-5 (the caps' small share of the coarse screw's samples, and no wall's solve to
      amplify it) is an inference, not measured: MIME-ANO-138's sizes are the samples (2.0e-7, 3.5e-7) and the resistance
      through a tube's solve, the spike's the held free-space resistance relative to its largest entry.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      If it exists on the branch, the same program built twice in one float32 process would take two answers from step 0,
      which breaks the claim that one program builds to one answer; as MIME-ANO-138 measured it, both answers are valid
      discretisations of the same body and the difference is far below the rung's discretisation error. It bounds nothing
      about the rung's accuracy.
    resolution_status: duplicate
    affected_versions: ">=0.3.0.dev1, <0.3.0.dev2"
    affected_components:
      - "node: MRSDragNode; the held part of the resistance (held_in_body_frame), built from the screw's samples"
      - "entry: geometry screw 0.1.0; the cap patches' layout (cap_rings)"
    verification:
      - "tests/oracles/test_mrs_builds_alike.py::test_three_builds_hold_the_same_matrix_in_float32[screw]"
      - "tests/oracles/test_mrs_builds_alike.py::test_control_the_layout_as_one_cached_array_makes_the_first_build_differ_from_the_rest[screw]"
    residual_risk: >
      The free-space case was measured by hand, outside the test suite; MIME-ANO-138's tests hold the screw and the
      cylinder in the tube, and its residual risk (other bodies with a layout the process caches) is this entry's.
    workaround: "None needed: MIME-ANO-138's fix is in."
    planned_resolution: "Closed as a duplicate of MIME-ANO-138, measured in lane S's S-F0-1 (above)."

  - anomaly_id: MIME-ANO-149
    title: "The energy ledger's running sums are kept in the run's dtype, and a float32 sum of a mixed-sign series reaches about 15 units of rounding by 1e5 steps, the floor its balance is judged against"
    description: >
      The ledger (mime.core.ledger.recorded, P1a-1) keeps its running sums in the receiver's state in the run's dtype: the
      work, the hosted and scheme terms, the unattributed work and the step scale, each as state + step [read]. The balance
      over a run is judged against IDENTITY_ULPS (16) units of eps on the run's summed step scale [read]. In float32 a
      running sum of a mixed-sign series loses precision as it grows.

      Measured by F0's open-ports spike, with a synthetic series and one add a step, not on the ledger's own run
      [measured, synthetic]: a float32 running sum of a mixed-sign series reaches 0.02 eps of the summed magnitudes at 1e2 to
      1e3 steps, 3.5 eps at 1e4 and 15 eps at 1e5; a positive series stays under 1 eps. So a float32 run of about 1e5 steps
      reaches the floor of the run's balance (16 eps) from the accumulation alone. The same spike's float32 arm kept the
      per-step identity within 0.23 eps of the step's scale over 1,375 steps, with float32 reductions, so the per-step check
      is not affected; this entry is about the totals and the balance over them.

      Resolved in 0.3.0.dev2, before the ledger's release, by keeping each running sum of a signed series as a pair (the
      work, the hosted and scheme terms, the unattributed work and the two jumps between steps: ``<name>`` and
      ``<name>_low``), renormalised by an error-free sum every step; the step scale, a sum of magnitudes, stays plain.
      Measured here [measured, 1e5 steps, the ledger's own update under a scan, 8 seeds each, units of eps on the summed
      magnitudes S of a sum's terms, CPU, JAX 0.12.0.1]: terms uniform in (-1, 1) about a bias of 0.25 (mixed signs, the
      sum grows) the worst sum drifted 45 in float32 (median 38) as it was kept before and 8e-8 as a pair; about a bias of
      1.0 (every term positive) 107 and 3e-7; about no bias (the sum stays small) 0.32 and 2e-10. In float64 the plain
      sum drifted 52, 83 and 0.42 on the same three series, and the pair 0 (exact): so float64 runs keep the pair too,
      since it changes what they read. **Two corrections to the measurement above**: a positive series does not stay
      under 1 eps here (107 eps on a series of 1e5 terms uniform in (0, 2)), so the step scale, a positive sum, may
      drift likewise (not measured on the ledger's scale, and the floor it sets is 16 eps of it); the original figure
      may have been of a series with a different dynamic range. The line the pair is held to is derived from its
      rounding: one addition into the low part a step, at most eps squared over 2 of S, so N eps^2 S over N steps, 0.012
      eps S in float32 at 1e5 steps; the plain sum fails it on every seed of the growing series by a factor of 150 or
      more in float32.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A float32 run long enough to reach the floor could read as failing its balance for rounding of the accumulation, or
      hide a real gift of about that size under it. The drift is measured on a synthetic series, not on the ledger's records,
      and the ledger's own run was not taken to 1e5 steps in float32.
    resolution_status: resolved
    affected_versions: ">=0.3.0.dev2 (development builds of the branch only; fixed before the release)"
    resolution_version: "0.3.0.dev2"
