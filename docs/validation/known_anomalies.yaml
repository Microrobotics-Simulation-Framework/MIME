      - "entry: interaction drag, rung mrs; formerly the bem rung"
      - "node: MRSDragNode"
    verification:
      - "tests/saved/test_sampling_walk.py::test_every_kind_that_samples_spreads_its_samples_evenly"
      - "tests/saved/test_sampling_walk.py::test_every_kind_that_samples_keeps_the_mrs_matrix_conditioned"
      - "tests/saved/test_sampling_walk.py::test_control_each_kept_version_fails_the_spacing_check_and_no_current_one_does"
      - "tests/saved/test_sampling_walk.py::test_control_the_spheres_quadrature_fails_the_conditioning_bound_at_todays_blob"
      - "tests/oracles/test_mrs_gradients.py::test_check_2_each_leafs_derivative_equals_the_difference_by_rebuilding_and_a_stopped_leaf_fails"
