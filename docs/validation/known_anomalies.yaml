      where 0.3.0's ends 1.36 um past. Around it (the four-start screw on the tube's axis at the tilt its bore admits,
      its spin and the tilt's direction within 0.1 rad of the draw's, its speeds and step drawn; 200 draws), 0.3.0's
      projection left 4 past the shrunk wall, 3 by more than 1 um (up to 4.95 um), and 0.4.0's none (its least gap
