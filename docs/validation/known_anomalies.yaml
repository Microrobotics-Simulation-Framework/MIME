  - anomaly_id: MIME-ANO-124
    title: "A motor's unwrapped single-precision angle turns at a biased rate that grows with the run's length"
    description: >
      Both motors (the kinematic one, MIME-NODE-105, and the dynamic one, MIME-NODE-110) carry their rotor's angle as an
      unwrapped sum, angle = angle + dt * speed, in the run's precision. In float32 each step's sum is rounded to a
      unit in the last place of the angle, which grows as the angle does, while the increment stays fixed (about 0.03
      rad at 10 Hz and 0.5 ms). When the increment rounds the same way every step, as a prescribed speed's does, the
      angle's mean rate is off by up to half a unit over the increment: 5.4e-4 of the rate at 1 Hz over 10 s, 2.6e-4
      at 3 Hz (computed by the review of PR #77, its r5, and reproduced by the reference's own 0.2 motor, which shares
      it), and doubling with each doubling of the angle as its unit does: up to half a percent after a minute at
      1 Hz, a percent after two, in the angle and in everything turned by it (the rotor's frame, the magnet on it, the
      field at the body). The angle's rounding also makes two runs whose increments agree to their
      last bits reach a later time a unit or two of the angle apart (phase 7c2's finding), which moved every
      comparison that read the angle. The rotor's speed (the dynamic motor's spin, the kinematic motor's command) is
      not affected; only the angle and what it turns.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A run's magnet phase and the field it makes at the body follow the motor's angle, so a long run in single
      precision drives the body with a field turning at a rate off by up to a percent or more, with nothing in the run
      to flag it; a result that depends on the field's rate or phase over a long run (a step-out frequency, a phase
      lag) would be biased. A comparison against a reference that shares the bias (the 0.2 line's) does not see it.
    resolution_status: open
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "MIME-NODE-105"
      - "MIME-NODE-110"
      - "entry: dynamics motor, rung kinematic; the angle state"
      - "entry: dynamics motor, rung dynamic; the angle state"
    verification: []
    residual_risk: "Phase 7c2 reads every phase against the angle of the same run and gates the angle's own rounding to a derived bound (a0_dynamic_expected_differences_b.json), so its comparison is not moved by it; nothing bounds the bias in a run that is not compared against an emulation of the same accumulator"
    workaround: "Run in double precision (JAX_ENABLE_X64=1) where a run is long or its rate matters, or read rates from the motor's speed rather than from its angle"
    planned_resolution: "Wrap the angle (carry it modulo a turn, with the turns counted apart), or carry it compensated (a Kahan-style sum of the increments) or in double precision; a src change for the maintainer to triage, which changes nothing in 7c2's numbers"
  - anomaly_id: MIME-ANO-125
    title: "On a CPU with two sizes of core, the MRS resistance's last bits depend on which core a process started on"
    description: >
      The MRS rung's force sums, R = M^T (A^-1 M), sum over the body's 3N unknowns. XLA:CPU takes that product, over
      both operands' first axis, through Eigen, which blocks a sum by the L1 data cache it reads off the core it first
      runs on, once per process. On a CPU with two sizes of core (Intel's hybrid parts: on the laptop it was measured
      on, the larger cores have a 48 KB L1d and the smaller 32 KB) a sum of more than 248 terms (more than 82 samples) was added in one block on one
      kind of core and in two on the other, so the resistance took one of two bit patterns per process, about 1e-16
      apart relative, and stayed with it for the process's life. A saved experiment then failed its bitwise reproduction
      in a fresh process (mime verify, the registry walk's round trips): phase 7m-a's review saw mrs_solids (its
      ellipsoid's 297 unknowns) fail 2 of 10 runs. Computed in phase 7m-a's fix round, each in fresh processes with one
      BLAS thread: on v0.3 before 7m-a (4bc1ada), a ball at 1,014 unknowns and FL-9 at 1,701 took the second pattern
      in 7 of 20 unpinned processes, and pinned to the P-cores 4 of 4 took one, to the E-cores 4 of 4 the other; on
      7m-a before the fix, the same and the ellipsoid alike (9 of 20); mrs_solids saved on one kind of core and loaded
      on the other failed 6 of 6. The core's kind decided it, not the CPU count (1, 4, 8 and 16 CPUs alike), the hash
      seed, the sampler, or XLA's flags (multi-threaded Eigen off, fast math off, platform-dependent math off, XNNPACK
      off: each left it). Every sum up to 248 terms matched across the core kinds and every one from 249 differed,
      except at 377 and 384, where Eigen's blocking rule gives both the same blocks; that rule, with those two cache
      sizes, predicts all twelve depths measured (the rule is inference from Eigen's published blocking heuristic; the
      library inside jaxlib was not read). The rung's numbers are right to rounding either way; what failed is the
      promise that a run reproduces bit for bit.

      **The rft rung (R1, unreleased) took its products whole again.** Its resistance, M^T f, summed the helix's 3n
      unknowns in one product (282 on rft_free_space's helix, 279 on rft_tube's), and with a wall its block-diagonal
      local drag entered B M and B G as dense products as long. The registry walk's round trip of rft_free_space then
      failed on the hybrid laptop by where each process started (the coil's pose 6.8e-21 apart at its first step, on
      #208's branch and on the release branch alone alike). Pinned there, the coil's product taken whole gave one bit
      pattern on the larger cores and another on the smaller, three processes of each; summed by force_sums, one
      pattern on both. Fixed before release: the node sums M^T f by force_sums and takes B M and B G point by point,
      three terms a sum.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      No value moved beyond rounding (1e-16 relative), so no physical result is wrong. What it breaks is a check: a
      bitwise reproduction (mime verify, a saved folder's round trip) failed on a correct result on a hybrid-core
      machine, which teaches a user to ignore a reproduction failure; and a long or chaotic run can carry the first
      difference far. Where a result is accepted on its bitwise reproduction, it depends on the machine.
    resolution_status: resolved
    affected_versions: ">=0.3.0.dev0"
    resolution_version: "0.3.0.dev1"
    affected_components:
      - "entry: interaction drag, rung mrs; mime.nodes.hydro.mrs.resistance's force sums"
      - "node: MRSDragNode"
      - "entry: interaction drag, rung rft; mime.nodes.hydro._rft_drag.RFTDragNode.resistance_at's products"
      - "node: RFTDragNode"
    verification:
      - "tests/oracles/test_mrs_force_sums.py::test_every_product_in_the_compiled_mrs_step_sums_at_most_depth_terms"
      - "tests/oracles/test_mrs_force_sums.py::test_every_product_in_the_compiled_resistance_sums_at_most_depth_terms"
      - "tests/oracles/test_mrs_force_sums.py::test_a_sum_no_longer_than_depth_is_the_product_it_was_bit_for_bit"
      - "tests/oracles/test_mrs_force_sums.py::test_a_longer_sum_equals_the_product_to_rounding"
      - "tests/oracles/test_mrs_force_sums.py::test_control_the_product_taken_whole_is_found_by_the_scan"
      - "tests/oracles/test_mrs_force_sums.py::test_every_product_in_the_compiled_rft_step_sums_at_most_depth_terms"
      - "tests/oracles/test_mrs_force_sums.py::test_control_the_rft_steps_product_taken_whole_is_found_by_the_scan"
      - "tests/saved/test_registry_walk.py::test_every_case_round_trips_through_a_fresh_process"
    residual_risk: "CI's runners have one size of core, so no test there can show that two processes' bits differ; the tests hold the cause (no product in the compiled MRS step sums more than 248 terms), and the cure was measured on a hybrid laptop (50 of 50 fresh processes, and 5 pinned to each kind of core, bitwise equal on all three bodies; mrs_solids saved on one kind and loaded on the other 10 of 10). 248 is the block Eigen takes in float64 with AVX2 on a 32 KB L1d (in float32 its block is longer); a CPU whose smaller cores had a smaller L1d, or wider vectors on both kinds, would need a shorter piece. The other products in MIME that contract over both operands' first axis (a chain's links, a 3 x 3 frame) sum a few terms, surveyed and not tested"
    workaround: "Before the fix, pin a process to one kind of core (taskset) where its bits are compared with another's"
    planned_resolution: "Done in phase 7m-a's fix round: mime.nodes.hydro.mrs.force_sums sums over the samples in pieces of at most DEPTH (248) terms, added in order, so a sum of up to 248 terms is the product it was, bit for bit, and a longer one is the same on either kind of core"
  - anomaly_id: MIME-ANO-126
    title: "On a smooth convex body the quasi-uniform sampling's MRS drag is further from the closed form than the polar grid's at the same count"
    description: >
      The sampling suite's spacing metric predicts the MRS matrix's conditioning, not its drag error. At the same count
      and blob 0.5, in float64, the rung's drag on a sphere or an ellipsoid sampled quasi-uniformly (the sphere 0.2.0,
      the ellipsoid 0.1.0) is further from its closed form than on the polar grid the sphere's first version sampled
      by. Each figure is the mean of the diagonal's three entries against the closed form (Stokes's law; Oberbeck's and
      Edwardes's for the ellipsoids, Kim and Karrila's chapter 3), computed in phase 7m-a's review, the grid's first:
      the sphere in translation +2.41% against +3.13% at 128 samples, +1.30% against +1.78% at 338, +0.61% against
      +0.90% at 1,152 and +0.34% against +0.52% at 3,160, in rotation +4.92% against +5.89% at 338; the ellipsoid of
      semi-axes 0.5, 0.7 and 1.1 mm +1.68% against +2.25% at 252 and +0.52% against +0.77% at 1,692 (rotation +6.15%
      against +6.88% at 252); that of 1, 0.6 and 0.25 mm +1.45% against +2.16% at 312 and +0.46% against +0.75% at 2,170.
      The grid's miss is 0.61 to 0.77 times the quasi-uniform sampling's. It is not the grid's symmetry: the ratio is
      the same on the triaxial ellipsoids, turning the quasi-uniform set changes nothing (0.01 points), and Fibonacci
      points, which share no code with the sampler, give the quasi-uniform numbers to 0.03 points. In float32 neither
      loses anything to its conditioning at this blob (both within 1e-6 of float64). On the screw, a body without that
      smoothness, the quasi-uniform sampling is 2.5 times closer to a converged free-space reference (-3.4% against
      -8.5%). The sphere's two-resolution extrapolation still meets Stokes's law within its oracle's 0.5%.

      **Drag 0.4.0 (phase 7m-b) takes the point forces out of the comparison.** On its separated quadrature the
      sphere's drag at the defaults (338 force points, the blob a tenth of their spacing, the quadrature twenty times
      finer) is +0.50% from Stokes's law and +1.45% in rotation, and within the oracle's tolerance of the exact
      regularised drag at its blob (tests/oracles/test_mrs_separated.py): what remains is the regularisation's, which
      the sampling does not set. The comparison above holds for drag 0.3.0's point forces, and for 0.4.0 with
      quadrature_refinement=1.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A smooth body's drag at a coarse spacing is a few tenths of a per cent further from its closed form than it was
      before phase 7m-a, in the conservative direction (more drag), and it converges as the spacing falls. A result
      read at one coarse spacing on a sphere or an ellipsoid carries that error, which a spacing ladder shows.
    resolution_status: open
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "entry: geometry sphere 0.2.0; its sampling (mime.scene.quasi_uniform), read by the MRS rung"
      - "entry: geometry ellipsoid 0.1.0; its sampling (mime.scene.quasi_uniform), read by the MRS rung"
    verification: []
    residual_risk: "Measured on the sphere and two triaxial ellipsoids in free space; the capsule's hemispherical caps and a smooth body near a wall were not measured"
    workaround: "Read a smooth body's drag from a spacing ladder (the two-resolution extrapolation meets Stokes's law within 0.5%), not from one coarse spacing"
    planned_resolution: "Kept as a labelled default of phase 7m-a's fix round (design #195: one sampler for every kind, the sphere the default sampler's only closed-form drag oracle), the maintainer's to overturn; the separated quadrature (phase 7m-b) chooses the defaults again"
  - anomaly_id: MIME-ANO-127
    title: "A quasi-uniform sampling chooses other samples when an experiment is rebuilt at a slightly moved setting, and the MRS resistance steps"
    description: >
      Quasi-uniform sampling's choice is discrete (each sample one of the quadrature's, chosen by farthest points and
      Lloyd's relaxation), so it is not continuous in the kind's settings. On FL-9 at 416 samples (computed in phase
      7m-a's review), its wavenumber moved by 1e-5 of itself chooses again, and the MRS resistance moves by 0.37% of
      its diagonal, a thousand times its smooth change with the choice held (3e-6); within 1e-3 of the wavenumber the
      steps reach 0.42%, and the modulation steps alike. The grid kept from before keeps its count and moves smoothly,
      and the sphere's choice scales with its radius exactly, so it does not step. Within one build the choice is held
      (the MRS node holds it as constructor data, as it holds its counts), so a derivative through the build is the
      discretisation's, and exact.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A study that builds again at moved settings (an optimisation's outer loop, a sweep of rebuilt experiments, a
      difference taken across two builds) sees steps a thousand times the smooth change, which can stall an optimiser
      or read as a sensitivity that is the discretisation's.
    resolution_status: open
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "entry: geometry sphere 0.2.0; its sampling (mime.scene.quasi_uniform), read by the MRS rung"
      - "entry: geometry capsule 0.2.0; its sampling (mime.scene.quasi_uniform), read by the MRS rung"
      - "entry: geometry screw 0.3.0; its sampling (mime.scene.quasi_uniform), read by the MRS rung"
      - "entry: geometry cylinder; its sampling (mime.scene.quasi_uniform), read by the MRS rung"
      - "entry: geometry box; its sampling (mime.scene.quasi_uniform), read by the MRS rung"
      - "entry: geometry ellipsoid; its sampling (mime.scene.quasi_uniform), read by the MRS rung"
      - "entry: geometry labx.bead; the lab fixture's kind, its sampling (mime.scene.quasi_uniform), read by the MRS rung"
    verification: []
    residual_risk: "Measured on FL-9's wavenumber and modulation at one count; other kinds and settings step alike by the same mechanism, unmeasured"
