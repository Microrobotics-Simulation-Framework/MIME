      The contact 0.3.0's projection after the step ran two passes: the first chose each group's point at the pose the
      step ended at and moved the body by the least change of pose that takes each back to the shrunk wall; the
      second held the same points of the body at the pose the first left. A group can hold several of the body's
      local deepest points (a screw's rim and the crest pass beside it), and a turn moves them unequally, so the
      first pass's turn could leave past the margin the one its group did not hold, first order in the turn, where
      the second pass, holding the first's points, saw nothing. Hypothesis found it on CI (run 41674916914, attempt
      2, the maddening-main lane; it reproduces bit for bit on the default lane's locked install): the four-start
      screw at the most twist the kind admits (wavenumber 4, modulation 0.25), turned on the tube's axis to the tilt
      its bore admits by its samples (0.39 rad), its body 36 um past the wall shrunk by the margin at both ends by its
      own surface, moving across the tube at 1.56 cm/s, no load, dt 0.19 ms. The first pass turned it back by 12.6
      mrad holding the rim at one end (35.2 um past before it, 0.24 um inside after); the crest pass 0.26 mm in from
      that rim, in the same group, stood 28.6 um past before the turn (6.6 um shallower than the rim, so the group
      held the rim) and 1.44 um past after it; the second pass's points were all inside and it moved nothing. The
      step ended 1.36 um past the shrunk wall (its dense quadrature), against the property's 1 um, and the next step
      took it back inside. The wall itself was never reached. No flag rose.
