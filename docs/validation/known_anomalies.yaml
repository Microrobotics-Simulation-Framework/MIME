  - anomaly_id: MIME-ANO-112
    title: "The drag surrogate's resistance is about the end of the body's axis, and is applied about its centre of mass"
    description: >
      The Cholesky MLP drag surrogate (weights mlp_cholesky_weights_v2.npz,
      sha256 ac1fca5c...0a345) was trained on MRS resistances whose torques
      are taken about the origin of the body's mesh, which de Jongh's Eq. 1
      places at one end of the body's axis (zeta from 0 to L:
      scripts/generate_training_fill_v3.py, _confined_R_hybrid, and
      dejongh_geometry.py at the tag pre-0.3). The surrogate's resistance is
      therefore about that end, L/2 from the body's centre. The 0.2 line's
      MLPResistanceNode delivered it as the drag about the body's centre of
      mass, unshifted, and 0.3.0.dev1's port (Drag.Surrogate, phase 4c1)
      does the same, so that script A's frozen reference applies. Evidence,
      in the MRS values the surrogate was checked against (FL-9, the 1/4"
      tube, offsets 0.20 to 0.30 of the radius) and in the surrogate's own
      output: the force across the axis from a rotation across it is L/(2R)
      = 2.39 times the translational resistance (2.40 measured); moving the
      reference by L/2 along the axis, towards the body's centre, takes that
      coupling from about 1600 to 2400 (non-dimensional) to under 1% of that
      in the MRS values (under 10% in the surrogate's), and moving it the
      other way doubles it (the control; tests/oracles/test_drag.py). Found
      reading the training code for phase 4c1's port.

      Resolved in 0.3.0.dev1: drag 0.2.0 (phase 4c3) moves the surrogate's
      resistance to the centre of mass, R_C = T^T R_P T with T = [[I, [d]x],
      [0, I]] and d = L/2 along the body's axis from the end zeta = 0 to the
      centre. The helix's axis is the body's x axis, zeta running along +x;
      the canonical frame's axis is the tube's on the side the body's x axis
      points to, so a body turned end for end gets the half turn of its
      resistance. Tested: the cross-axis coupling collapses below 10% of the
      end's (the opposite shift doubles it), R_C stays symmetric positive
      definite, the axial block is unchanged to 1e-12, the differential
      against the port holds with the shift off and differs by exactly the
      declared shift with it on. A declared change for script A, predicted
      before it was measured: A's speed falls 7.80% against its frozen
      reference, to 3.2086 mm/s, on its float64 prediction to 2.5e-16. The
      0.2 line keeps the defect.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      Moving the reference point along the axis leaves the coupling between
      the axial force and the spin about the axis unchanged, so a body
      turning about the tube's axis swims at the same speed; it adds a
      spurious coupling between motion across the tube and tilting, which
      changes a body's lateral motion, wobble and response to off-axis loads
      (gravity on the floored body), and the sign of that coupling with the
      direction the body's axis is taken to point. No 0.2 result is known to
      depend on it, and none has been checked.
    resolution_status: resolved
    affected_versions: ">=0.1.0, <0.3.0.dev1"
    resolution_version: "0.3.0.dev1"
    verification:
      - "tests/oracles/test_drag.py::test_about_the_centre_the_cross_axis_coupling_collapses_and_the_opposite_shift_doubles_it"
      - "tests/oracles/test_drag.py::test_about_the_centre_the_resistance_stays_spd_and_its_axial_block_is_unchanged"
      - "tests/oracles/test_drag.py::test_a_body_turned_end_for_end_gets_the_mirror_image_shift"
      - "tests/differential/test_port_drag.py::test_about_the_centre_the_resistance_is_the_ports_with_exactly_the_declared_shift"
      - "tests/differential/test_script_a.py::test_script_a_matches_its_reference_with_exactly_the_declared_differences"
    affected_components:
      - "mlp_resistance (MLPResistanceNode)"
      - "entry: interaction drag 0.1.0, rung surrogate; in 0.3.0.dev0"
    workaround: "On the 0.2 line, read the surrogate's resistance as about the end of the body's axis; shift it by L/2 along the body's axis before using it about the centre"
    planned_resolution: "Done in drag 0.2.0; not fixed on the 0.2 line, which is frozen. Retraining about the centre is MIME-ANO-114's"

  - anomaly_id: MIME-ANO-113
    title: "RigidInertial's implicit step rounds a small load against the inertial term in float32"
    description: >
      RigidInertialNode solves (M/dt + R) V' = (M/dt) V + F for the twist
      after the step. In float32 a load F much smaller than the inertial term
      (M/dt) V is rounded at one unit in the last place of that term. For a
      body locked to a rotating field the rounding is the same at every step,
      so it does not average away: the lock absorbs it as a fixed offset in
      the phase lag, of up to ulp((I/dt) omega) / (m B). In script A (FL-9 at
      10 Hz, dt = 0.5 ms) the inertial term about the tube's axis is 1.30e-5
      N m and the torque 3.9e-8 N m: the bound is 4.5e-7 rad, and the float32
      lag sits 2.32e-7 rad from the float64 lag, the same to every digit
      wherever the body starts along the tube. Solving the same equation for
      the change in velocity, (M/dt + R) dV = F - R V, takes the offset to
      4.0e-9 rad and leaves float64 unchanged to 4e-16. Found by 0.3.0.dev1's
      phase 4c2 comparison of script A against its frozen 0.2 reference
      (tests/differential/test_script_a_float32.py), where the float32 lag
      missed its declared tolerance of 1e-7 rad. The 0.2 line's explicit step
      quantizes the same balance at one unit of omega (3.9e-7 rad in A).

      Resolved in 0.3.0.dev1: rigid_inertial 0.2.0 (phase 4c3) solves its
      step for the change in velocity, (M/dt + R) dV = F - R V, V' = V + dV,
      a change declared before it was measured
      (tests/differential/script_a_expected_differences.json, declared
      change velocity-increment-form). In float64 A moved by rounding only
      (at most 1.8e-15 relative, declared within 1e-12). In float32 the lag
      lies 3.97e-9 rad from the float64 lag, and every float32 quantity of A,
      the lag included, is gated again against the reference at its original
      tolerance (the lag's miss is 1.4e-8 rad against 1e-7). The control:
      0.1.0's form, planted, takes the lag back to -2.32e-7 rad from float64,
      and the gate fails.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      Only float32 runs are affected, and by a lag offset about 1e-5 of A's
      lag; the speed and the rotation rate hold their float32 tolerances. A
      study that fits a moment or a step-out threshold to a phase lag in
      float32 would inherit the offset, which matters only where that
      precision is relied on.
    resolution_status: resolved
    affected_versions: ">=0.3.0.dev0, <0.3.0.dev1"
    resolution_version: "0.3.0.dev1"
    verification:
      - "tests/differential/test_script_a_float32.py::test_script_a_in_float32_matches_its_float32_reference_with_the_declared_differences"
      - "tests/differential/test_script_a_float32.py::test_the_float32_lag_lies_on_the_float64_lag"
      - "tests/differential/test_script_a_float32.py::test_with_the_old_form_planted_the_float32_lag_misses_again"
      - "tests/differential/test_script_a.py::test_in_float64_the_increment_form_moves_a_by_rounding_only"
    affected_components:
      - "entry: dynamics rigid_inertial 0.1.0"
      - "node: RigidInertialNode"
    workaround: "None needed from rigid_inertial 0.2.0; with 0.1.0, study a locked body's phase lag in float64"
    planned_resolution: "Done in rigid_inertial 0.2.0: the step solved for the change in velocity"

  - anomaly_id: MIME-ANO-114
    title: "The drag surrogate misses the MRS it was checked against by up to 16% in swim speed, against the 0.2 line's stated 1%"
    description: >
      The Cholesky MLP drag surrogate (weights mlp_cholesky_weights_v2.npz,
      sha256 ac1fca5c...0a345), against the MRS resistances the 0.2 line
      checked it against: FL-9 in the 1/4" tube, the swim speed from the
      resistance at 10 Hz. MRS 3.483, 3.722, 3.902, 4.012, 4.037 and 23.09
      mm/s at offsets 0.20, 0.25, 0.28, 0.30, 0.32 and 0.35 of the tube's
      radius; the surrogate 3.573, 4.325, 4.299, 4.023, 3.703 and 3.819 mm/s.
      Errors 2.6%, 16.2%, 10.2%, 0.28% and 8.3% to 0.32 R, against the 1%
      the 0.2 line's docstring and metadata state; the 0.2 line's own test
      asserted 5% at 0.30 R only. Reproduced to rounding in 0.3.0.dev1's
      phase 4c1 (tests/oracles/test_drag.py, which holds these numbers so a
      change shows).

      Diagnosis: the training data hold this geometry only at offsets 0,
      0.024, 0.1, 0.2 and 0.3 of the radius. The errors at 0.25 and 0.28 fall
      in an unsampled gap, and 0.32 lies past the last sample. Script A's
      body rests at about 0.315 R. The MRS's own 23.09 mm/s at 0.35 R is not
      physical: a near-wall failure of the MRS itself, whose wall table
      (2026-05-21) was never checked against Fourier-Bessel series. What this
      bounds: the surrogate against that float32 MRS, not against the flow.

      **The near-wall check (phase 7i).** The corrected table is in place
      (MIME-ANO-117), so the check this record planned first was run through
      it: FL-9 resting on the floor of the 1/4 in tube, its closed surface,
      through Drag.MRS in the tube wall kind, in float64 on Modal CPU
      containers (commit fd6519d), at spacings 0.30, 0.24, 0.19, 0.15, 0.12
      and 0.10 mm (1716 to 15327 samples) and gaps from the body's outer
      radius to the wall of 0.02 to 0.5 mm
      (tests/differential/references/near_wall_check.json). **This record is
      on the screw kind 0.1.0's caps (MIME-ANO-119) and is not re-measured on
      0.2.0.** The fix moves the confined R_xx by +0.98% and the axial
      coupling by +1.11% at A (phase means), the size of the edge criterion's
      1% tolerance below, so the edges may move; whether they do is
      unmeasured. The generator refuses data while the edge is open, so
      nothing is generated from the record in the meantime, and it is not
      regenerated here. Declared before it ran: at each spacing but the finest, the relative error of each of
      eight quantities (the swim speed per unit spin, the six diagonal
      entries, the axial coupling) at a gap, beyond its error at the far
      gap (0.5 mm), the finest spacing the reference; a gap is resolved where
      that excess is within 1%; the edge is the smallest gap-to-spacing ratio
      above which every gap is resolved at every spacing. Measured on FL-9
      in the 1/4 in tube: for the whole resistance, 2.08 spacings (the grid
      brackets it between 2.0, where 0.15 mm at a 0.3 mm gap misses by 1.3%,
      and 2.5, where 0.12 mm at 0.3 mm is within, 0.64%), set by the
      translation normal to the wall and the pitching rotation. Their
      excess is 0.6% to 2.3% at the spacings 0.12 and 0.15 mm from about half a
      spacing out to at least two and a half, and 1.85% to 7.2% at 0.19 to
      0.30 mm over the same ratios (the review of the phase's PR, computed:
      the earlier statement of a plateau at 0.6% to 2.3% held at 0.12 and
      0.15 mm only), and it breaks to tens of per cent and more below about
      half a spacing. Read from the same data after it ran, the swim speed
      alone: 0.625 spacings.

      **The edge is open (the review of the phase's PR, finding B1).** The
      measured edges do not hold as a number of spacings. (i) They move with
      the far gap the analysis normalises by: for FL-9 in the 1/4 in tube,
      the whole resistance's edge is 2.083, 0.833 and 0.625 spacings and the
      swim speed's 0.625, 0.625 and 0.500 for far gaps of 0.5, 0.3 and 0.2 mm
      (computed from the committed record, and reproducing the review's).
      (ii) They differ by design: the review's run of FL-1 in the same tube
      under the declared analysis (spacings 0.19, 0.15, 0.12, 0.10 mm, on
      Modal) gives the swim speed 2.50 spacings and the whole resistance
      2.63, and 1.58 and 2.00 at a far gap of 0.3 mm, 0.79 and 1.05 at 0.2
      mm; the samples are not in this repository. (iii) The 3/16 in tube
      cannot run the analysis as declared (its room above the body is 0.306
      mm, below the far gap of 0.5 mm), and at the nearest far gap, 0.3 mm
      (the body 6 um off the axis), every excess at FL-9 is 9.6% to 12.6%. The
      review infers a gap-dependent discretisation error of the wall's share
      (this record's problem) and not a breakdown below a fixed number of
      spacings; the declared analysis cannot tell the two apart. The
      swim-speed-only edge is not the declared criterion, is noise-limited
      (its excess is not monotone, 0.28% to 1.43% between 0.26 and 0.53
      spacings, so the tolerance moves it) and is not a training edge: the
      domain no longer takes it. The criterion stays the declared one (eight
      quantities within 1%, committed at fd6519d). **The near-wall edge is
      the maintainer's decision, open**, with the options listed neutrally in
      the domain's record (a near-contact boundary-element capability; a
      declared accuracy per use with its edge measured before a run; the
      margin range narrowed to what resolves; the hand-over to Lubrication at
      a gap set by measurement), and the generator refuses to produce
      training data while it is open (generator.near-wall-edge-open). The
      measured edges are data in the domain's record
      (mime.surrogates.generator.MEASURED_NEAR_WALL_EDGES). The excess is
      relative to the finest spacing, itself unconverged, so it estimates the
      wall's share and bounds nothing. Separately, the body's own
      discretisation error is large at these spacings: the swim speed per
      unit spin at 0.15 mm lies 3.9% to 5.1% below the 0.10 mm value at
      every gap from 0.05 mm, and 17.7% to 19.1% at 0.30 mm (MIME-ANO-116),
      which the training spacing must answer before data are generated.

      **The margin to indefiniteness at A (phase 7j's study M3; measured
      again after MIME-ANO-119's fix).** At A's floored pose (FL-9 in the
      1/4 in tube, a contact margin of 0.1 mm, the closed surface at 0.178
      mm, blob 0.5) the MRS's resistance is positive definite at the nominal
      wall correction: its smallest non-dimensional eigenvalue is about 213
      to 222 over the eight phases, against a largest of about 2,000. With
      the correction scaled coherently it becomes indefinite at about x1.030
      (phase 6; x1.0325 at phase 0; a grid of steps of 0.0025), and the
      speed's pole lies at x1.054 to x1.062. The table's gate measured a
      worst read error of 0.002 of a block's largest entry at off-knot points
      across its readable range; its error at A's own sample pairs has not
      been measured (a planned study compares the table with its exact
      series at those pairs). Reading: the margin measures how close A sits
      to the MRS's near-wall resolution edge (a gap of 0.57 spacings).
      Whether it widens with refinement is to be measured along the
      free-space convergence ladder; if it does not, it becomes its own
      anomaly. Source: phase 7j's study M3, branch v0.3-7ja-m3 at 2ab663f.
      After MIME-ANO-119's fix (the screw kind 0.2.0, its caps in rings, one
      sample fewer a cap at A) the same scan gives the same onset at every phase
      (x1.030 at phase 6 and x1.0325 at phase 0; the least over the phases
      x1.030 before and after) and the same nominal eigenvalues to 0.1
      (scripts/sim2real/capfix.py, stage scan_fine, on an A100 in float64):
      the margin is not the caps'. The unchanged onset does not separate two
      candidates left: the wall table's resolution at A, and the lateral
      patch's open ends (MIME-ANO-120's negative mode is on those ends, about
      0.1 mm from the wall, and A's margin is 0.1 mm; the patch's closest pair
      at A is 0.265 spacings).

      **The generator and its protocol (phase 7i).**
      mime.surrogates.generator computes de Jongh's seventeen designs resting
      in his four tubes through Drag.MRS in the tube wall kind. Its domain
      has contact margins up to 0.20 mm, with the near-wall edge open (above)
      and what else lies outside named. Its held-out sets, once an edge is
      declared, are the gaps between the training margins, where this
      record's errors lay, and the body turned about its own axis (floored
      again at each roll), an input the surrogate does not read.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A swim speed wrong by up to 16% between 0.2 and 0.3 of the tube's
      radius, where a body on the wall of a tube like A's rests, misleads any
      study that relies on the surrogate's speed there (a time to target, a
      fitted moment or drag); one that uses the surrogate only to compare
      schemes or versions, as script A's reproduction does, is unaffected.
    resolution_status: open
    affected_versions: ">=0.1.0"
    affected_components:
      - "mlp_resistance (MLPResistanceNode)"
      - "entry: interaction drag, rung surrogate; weights dejongh_mlp_v2"
    verification:
      - "tests/oracles/test_drag.py::test_the_surrogate_against_the_mrs_values_it_was_checked_against"
      - "tests/differential/test_near_wall_check.py::test_the_domains_recorded_edges_for_fl9_are_the_records_at_each_far_gap"
      - "tests/differential/test_near_wall_check.py::test_the_edges_move_with_the_far_gap_in_the_record_itself"
      - "tests/differential/test_near_wall_check.py::test_control_an_excess_planted_above_the_edge_moves_it"
      - "tests/oracles/test_surrogate_generator.py::test_control_the_generator_refuses_by_name_to_produce_data_while_the_edge_is_open"
      - "tests/oracles/test_surrogate_generator.py::test_every_case_lies_inside_the_domain_the_tables_readable_radius_and_its_axial_reach"
    claims:
      - id: max_error
        quantity: "relative swim-speed error of the drag surrogate against the MRS values the 0.2 line checked it against (FL-9 in the 1/4 in tube, at 10 Hz)"
        value: 0.162
        unit: "1"
        basis: computed
        role: estimate
        oracle_kind: software oracle
        evidence:
          - "tests/oracles/test_drag.py::test_the_surrogate_against_the_mrs_values_it_was_checked_against"
        conditions:
          region: "the body's offset from the tube's axis, 0.20 to 0.32 of the tube's radius"
        domain: "offsets 0.20, 0.25, 0.28, 0.30 and 0.32 of the tube's radius"
        n: 5
        says: "the largest error over five offsets, against a float32 MRS whose wall table was not checked: it estimates the surrogate's error there and bounds nothing between or beyond those offsets, nor the error against the flow"
    workaround: "Read the surrogate's swim speed as known to about 16% between 0.2 and 0.32 of the tube's radius, and to its 0.28% only at 0.30; check a result that depends on it against the MRS"
    planned_resolution: "Done in phase 7i-a: the corrected table (MIME-ANO-117), the near-wall check through it and the generator with its held-out protocol (above), which refuses to produce data while the near-wall edge is open. Left, and blocked on the maintainer's decision of the edge: the near-wall check measured again on the screw kind 0.2.0's caps (the record is on 0.1.0's, MIME-ANO-119); a training spacing chosen by MIME-ANO-116's convergence (which a choice of spacing alone does not reach); the data on de Jongh's designs resting in his tubes; retraining under a new asset name, judged per use on the held-out sets, each over the gaps its use resolves. The order agreed (design #208): the near-wall edge is answered by a lubrication hand-over, designed at the FVM design pass (dev2) and placed by it in phase W2 of the dev2 plan (MIME-ANO-150, MIME-ANO-151); the surrogate is retrained after it, learning the far field with lubrication added analytically at run time. It is not retrained in dev1, and stays the 0.2 line's weights until then"

  - anomaly_id: MIME-ANO-115
    title: "A query on a table's one-point readable range that carries a tangent has a NaN forward derivative in every direction"
    description: >
      The table evaluator reads a readable range of one point as OpenMaterica's tables T12 and T13 specify: the
      value there, and no derivative (absent or NaN). It does so by multiplying the query's tangent by NaN
      (mime.core.switch.without_slope). A linear tangent rule cannot give NaN along one direction and a number along
      another, since 0 * NaN is NaN. Found by the coordinator's review of phase 7f's fix round.

      As found, a read's queries arrived as one stacked array, so a forward-mode derivative (jacfwd, jvp) of a read of
      a table with a one-point axis was NaN in every direction, the other axes included, once any query was traced
      and one sat in the one-point range.

      Narrowed by the maintainer's decision of 2026-10-28 (design log #169, item 3, option (b)): the evaluator takes
      one query argument per axis (mime.core.tables.evaluate(table, *at, owner=...)), each axis's position computed
      from its own argument, the stacked form removed (no caller needed it). A query on the one-point axis that
      carries no tangent in the mode used (a constant, or a jit argument the derivative is not taken in) leaves the
      derivatives along the other axes finite in forward and reverse mode, matching a finite difference, in float64
      and float32.

      What remains, kept as the specification's own NaN: a query on the one-point axis that carries a tangent (any
      query jacfwd traces, and one given to jvp even with a zero tangent). Along that axis it is NaN in reverse mode;
      in forward mode it is NaN in every direction, since a differentiated direction along another axis still
      multiplies this query's zero tangent by the NaN, and no linear rule gives NaN along one direction and a number
      along another. The other axes' reverse-mode derivatives are finite. Corrected wording (review of #169, Q-1):
      the boundary is the tangent, not whether the query is a tracer, so the workaround is open to a study that
      differentiates chosen arguments and not to one differentiating a whole step with respect to a state the
      one-point query is derived from.

      Unreleased code with no consumer yet: no read of a one-point table is differentiated in this tree.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      The result is NaN, not a plausible wrong number, so a study that differentiates such a read in forward mode
      with the one-point axis's query traced sees it fail rather than mislead. A study that drops NaN entries, or
      reads only the finite ones, would lose the derivative along the other axes with no sign that it was ever
      defined; that study should leave the one-point axis's query out of what it differentiates.
    resolution_status: partially_resolved
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "mime.core.tables (evaluate)"
      - "mime.core.switch (without_slope)"
    verification:
      - "tests/unit/test_tables.py::test_a_constant_query_on_a_one_point_axis_leaves_the_other_axis_derivative_finite_in_both_modes"
      - "tests/unit/test_tables.py::test_control_the_stacked_read_makes_a_constant_one_point_query_nan_in_forward_mode"
      - "tests/unit/test_tables.py::test_known_limit_a_traced_query_on_a_one_point_axis_is_nan_in_reverse_mode_along_it_and_in_every_direction_forward"
      - "tests/unit/test_tables.py::test_the_boundary_is_whether_the_one_point_query_carries_a_tangent_not_whether_it_is_traced"
    residual_risk: "A forward-mode derivative of a read whose one-point axis's query carries a tangent is NaN in every direction"
    workaround: "Leave the one-point axis's query out of what is differentiated (a constant, or a jit argument the derivative is not taken in), so that it carries no tangent; or use reverse mode, which keeps the NaN to the one-point axis"
    planned_resolution: "None: the NaN along a traced query on a point is the specification's, and no linear tangent rule can confine it to one direction in forward mode"

  - anomaly_id: MIME-ANO-116
    title: "The de Jongh helix's MRS resistance is not converged at the 0.2 line's counts, and the 0.3 kind's samples differ from the 0.2 mesh by up to 5.3%"
    description: >
      Drag.MRS samples a body's hull by its geometry kind: the de Jongh helix's exact surface points, Gauss-Legendre
      along the axis and the trapezoid rule round the turn. The 0.2 line's MRS sampled the same lateral surface by flat
      triangles between vertices of it, a point at each centroid. Against the 0.2 line's frozen resistance on its own
      meshes (tests/differential/test_port_mrs.py, the full-size cases marked slow), the kind's lateral samples at the
      same count give, at the surrogate's training mesh (3,120 samples), +1.9%, +1.9% and +2.3% in translation (across,
      across, along the axis), +4.2%, +4.9% and +5.3% in rotation, and -5.2% in the axial coupling; at G0's mesh (1,680
      samples) +3.5% to +10.6% and -12.7%. Closing the surface with the caps, sampled at the lateral spacing, moves the
      rotation about the axis by -0.9 points and the axial coupling by -2.9 at the training mesh, and the translation
      by under 0.2 points.

      Neither discretisation is converged there. Measured at five levels, 216 to 2,088 samples
      (tests/differential/test_mrs_convergence.py, recorded in references/mrs_convergence.json, found by phase 7g's
      review): on the diagonal the two approach the converged value from opposite sides at every level, the 0.2
      rule's rising and the kind's falling, so the converged value lies between them (under that monotone approach,
      an inference from five levels). A fit R + c1/sqrt(N) + c2/N to each sequence: in translation the fitted limits
      agree within 0.5%, and the kind's finest lies +0.5% to +1.0% from either against the 0.2 rule's -1.4% to -2.3%,
      so the kind's is the nearer; in rotation the fits disagree by 1.1% to 4.6% and the 0.2 rule's limit about the axis
      lies outside the bracket, so which is nearer is not established. The axial coupling is not bracketed: both grow
      in magnitude with the count, the 0.2 rule's ahead at every level, both still moving at 2,088 samples (the fits
      put them 16% to 21% short of their limits, which agree within 1%).

      **Near the wall, through the corrected tube table (phase 7i-a, the review of its PR, computed).** FL-9 resting in
      the 1/4 in tube, the swim speed per unit spin at a spacing of 0.15 mm lies 3.9% to 5.1% below its value at 0.10
      mm at every gap from 0.05 mm (ratios 0.9520, 0.9494, 0.9521, 0.9565, 0.9590, 0.9610, 0.9612), and 17.7% to
      19.1% below at a spacing of 0.30 mm at the gaps checked. The earlier wording ("4% to 5%", "18% to 19%") sat in
      MIME-ANO-114's text; this record is where the figures belong. The 0.10 mm spacing itself is still moving 1% to 2% a
      step, free space included (the second report of the tube-table rebuild, as the review read it), so no spacing
      reached is converged.

      **Drag 0.4.0's separated quadrature (phase 7m-b, computed).** The record above is the point forces' (drag 0.3.0,
      and 0.4.0 with quadrature_refinement=1). On the separated quadrature, FL-9 in free space meets the shipped
      free-space reference (tests/oracles/references/helix_fl9_free_space.json) within -6.1% at 206 force points,
      -1.3% at 567 and +0.1% at 1,714 (docs/choosing_spacing.md): the axial coupling's quadrature error, the term the
      helix reference found the point forces' larger by 25 to 1, is the one the separated quadrature removes. In the
      tube the confinement's own effect converges more slowly (MIME-ANO-130).
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A swim speed follows the axial coupling over the rotational resistance, the two least converged quantities, so
      a study that reads a speed from the mrs rung on the helix, or trains a surrogate on its resistances (phase 7i),
      at these counts inherits an error of several per cent that neither discretisation shows by itself. A study that
      compares bodies or settings at one count, or uses translation alone, is affected far less.
    resolution_status: open
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "entry: interaction drag, rung mrs; formerly the bem rung, on the de Jongh helix"
      - "node: MRSDragNode"
    verification:
      - "tests/differential/test_mrs_convergence.py::test_the_recorded_convergence_brackets_the_diagonal_and_the_kind_is_the_nearer_in_translation"
      - "tests/differential/test_mrs_convergence.py::test_the_kinds_path_through_the_node_is_bounded_by_the_02_rules_convergence"
      - "tests/differential/test_port_mrs.py::test_the_kinds_quadrature_and_its_caps_are_model_differences_from_the_02_lateral_mesh"
    residual_risk: "A resistance read at these counts is off the converged value by up to a few per cent on the diagonal and more in the axial coupling, and the sign of the rotation's error is not established"
    workaround: "Read a converged value as lying between the two discretisations at the same count; check a result that depends on the axial coupling at two counts or more"
    planned_resolution: "Before phase 7i trains on it: a convergence study at the training mesh's counts and beyond, the blob's share in the kind's bias tested, and the training data taken from the converged estimate, not from either discretisation. The review of phase 7i-a found that last step cannot be met by choosing a spacing among those reached (0.10 mm is still moving 1% to 2% a step), so phase 7i-b must say which it does: train on an unconverged discretisation, stated as such, or on an estimate extrapolated from several, with its own error stated"

  - anomaly_id: MIME-ANO-117
    title: "The 2026-05-21 wall tables hold an image that is not a Stokes flow for a force along the source's azimuthal direction, and are unconverged near the wall"
    description: >
      The v0.2 line's tables of the straight tube's image system (eleven files, NickERoy/mime-wall-tables, revision
      1f7b5a4e) were built by its direct Fourier-Bessel code (cylinder_greens_function_v2._assemble_image_only), and
      hold what that code computes at the radius each file names, to at worst 3.6e-4 of a block's largest component
      at drawn knots (phase 7h's check, tests/differential/check_wall_tables.py; the series at a large axial offset
      moves by 2.5e-5 between being computed at the table's radius and at radius 1, its rounding; the first axis is
      the target's radius, not the source's; the review of that check found one table (r30, 2.500) bitwise equal to
      the builder run at the radius the file names, at all 14 knots it tried). That code has a defect: for a point force along the source's azimuthal
      direction (the second column of each block) the image's radial and axial components go as sin(n dphi) and its
      azimuthal one as cos(n dphi), the opposite parity in the angle to a radial force's, and the code takes the
      radial force's modes for it (the same n where the parity makes it -n). The modes then meet the no-slip
      condition on the wall, which fixes their coefficients whatever the modes are, so a no-slip check passes
      (residual 4.5e-7 of the free Stokeslet), but they are not Stokes flows inside the tube: the image of that force
      is not divergence-free (6.4 of its own scale, against 7.8e-5 for the series with each column's own modes); on
      the axis, where the tube's symmetry makes the self-image across the axis the same in every direction, it gives
      1.80436 along x and -2.45101 along y (the defect-free series 1.80436 both, the coefficient k of
      F = 6 pi mu a U (1 + k a / R)); and the image is not reciprocal (G(x, y) against G(y, x)^T: 0.38 of a pair's
      largest component; on FL-9's lateral patch the antisymmetric part is 12% to 32% of the table's correction's
      Frobenius norm, where the v0.2 code's comment said about 1% and its symmetrisation of the resistance hid it).

      Separately, the tables' truncation (15 modes, 80 wavenumbers, 64 wall angles) is converged only away from the
      wall: against the series at 40, 160 and 128 at knots whose larger radius lies between 0.9 and 0.98 of the
      tube's, the tables are off by up to 3.3 times a block's largest component, and between 0.8 and 0.9 by 1.7. The
      de Jongh screw rides the tube's floor, where both matter.

      **The cause** (found by the review of phase 7h, in the v0.2 line's cylinder_greens_function_v2; the line numbers
      are those of the file as ported to MADDENING 0.4.1): the basis built once for the transverse force, ``M_t = _build_M(+1)`` and
      ``Bt_t = _build_B(+1)`` (lines 262 and 292), serves both transverse columns, in the solve for the wall's
      coefficients (line 314) and in the evaluation of the field (lines 335 to 337). The sign ``p`` handles the axial
      column's parity in z (k to -k); nothing handles the azimuthal column's parity in the angle (n to -n). Column 1's
      modes are column 0's turned by pi / (2n) about the axis, which maps the profile triple (f, g, h) of the (cos,
      sin, cos) pattern to (f, -g, h): the right basis for column 1 is D B with D = diag(1, -1, 1). Two sign flips
      correct it: ``wr[:, 1, 1] *= -1`` before the solve and ``u_trans[:, :, 1, 1] *= -1`` after the evaluation. In
      the source's frame they change columns 0 and 2 by 1.5e-15 and 0, and column 1 by order one; the form this
      repository's series uses (the modes of -n for the azimuthal force) agrees with the two flips to 8.4e-10. All
      three columns of the builder's basis are divergence-free; the defect is the choice of basis for column 1.

      **Independent confirmation** (the review of phase 7h, by its own finite differences, with the sources
      (0.5, 0, 0) and (0.2, -0.35, 0.3), four interior points, at the tables' truncation in the unit tube; the
      builder's image taken from the port's own code, the corrected one by the two flips above, the series of
      tests/tube_fourier_bessel.py as a third): the no-slip residual is the same for all (5.5e-7 for a source at
      0.3 R, 1.7e-4 at 0.6 R), so it cannot see the defect; the builder's image fails the divergence at 1.36 of the
      gradient's scale (flat in the step; the corrected 2.4e-6), the momentum equation lap(curl u) = 0 at 1.67 and
      1.86 at steps 0.04 and 0.02 (corrected 0.024 and 0.014), reciprocity at 0.32 (2.5e-7), and the self-image on the
      axis: 1.80436 along x and -2.45101 along y approached along phi = 0, and -0.3233 in both with an off-diagonal
      of 2.13 approached along 45 degrees (corrected 1.80436 in every direction), so it is not even single-valued
      there. Bohlin's axial coefficient, 2.1044438, is the same for all. A method of fundamental solutions, which
      shares no code with any Fourier-Bessel series (singular Stokeslets on a cylinder of radius 1.3 round the tube,
      strengths by least squares to the wall's no-slip condition, so a Stokes flow inside by construction), agrees
      with the corrected image to 3.5e-7 to 1.4e-5 at its finest (7,392 unknowns, its own wall residual 8e-6 to
      7e-4) and misses the builder's by 0.80 to 2.36; at three resolutions the corrected image's distance falls with
      the method's wall residual (off the axis 1.2e-4, 1.1e-4, 1.2e-6) while the builder's stays. The method's
      transverse coefficient on the axis is 1.804359, the series' 1.8043601. This repository keeps the divergence,
      momentum, reciprocity, axis and fundamental-solutions checks as tests (tests/oracles/test_tube_wall.py,
      test_tube_mfs.py), each with the builder's image as its control.

      **The size, corrected.** Against the defect-free series at the finer truncation, at the same 135 lateral
      samples of FL-9 (the body's radius 1.56 mm, every table at the confinement it names, centred and, where the
      body fits, 0.3 of the tube's radius off the axis), every one of the eleven tables misses the 1% declared before
      the check at every configuration. The review separated the defect from the truncation by computing the image
      directly (no table) for FL-9 in a 1/4-inch tube (2.035): on the axis (the samples reach 0.65 of the radius)
      the defect is all of the error: 24.7% in the resistance and 1.077 times in the swim, the truncation alone 0.000
      and 1.000, and the table's interpolation adds nothing visible. Off the axis (reach 0.95) both matter and the
      defect is not the larger: the defect alone is 98% (at the tables' truncation) to 118% (at the finer) and
      the truncation alone 266% (the series at 15, 80, 64 against 40, 160, 128), the 268% of the table check being
      their combination, not the defect. So **the sentence this record first carried, that the defect, not the radial
      grid, is the error, holds on the axis and only there**; the agreement of the r40 and r30 sets at 2.500 to three
      digits rules out the tables' radial grid, no more. On the axis the tables' miss is 11% (8.333) to 89% (1.526)
      of the diagonal's geometric mean, 25% at 2.035 (a 1/4-inch tube) and 2.500, and the force-free swim along the
      axis per unit spin is 1.97 times the series' at 1.526 (the samples reach 0.87), 1.08 times at 2.035 and within
      1.5% of it from 2.5 out. The off-axis figures of tests/differential/references/wall_table_check.json (12% to
      268% and 0.12 to 1.46 times in the swim) are the defect and the truncation together, in a proportion measured
      only at 2.035, and **are not estimates**: where FL-9 reaches 0.95 of the radius (2.035 off the axis, the 268%
      and 0.12 times) the reference itself (40, 160, 128) fails the no-slip condition by 11% for a source at 0.95
      (1.6% at 0.9, 1.7e-4 at 0.8; tests/oracles/test_tube_wall.py prints them) and its self-image is 3.5% off the
      series at 80, 320, 256, which itself leaves 1.8% there; between 0.8 and 0.9 of the radius (1.526 on the axis,
      2.500 off it) the reference's error lies between 1.7e-4 and 1.6% and was not measured at those reaches; at
      every other configuration the reach is 0.8 or less and the reference is converged to the 1% criterion. The
      per-table record is tests/differential/references/wall_table_check.json.

      **A constraint on the rebuild**: converging the image to 1% at 0.95 of the radius takes more than 80 modes
      (80, 320, 256 leaves a no-slip residual of 1.8% there, against 2.9e-4 at 0.9); capping the radius at which
      the table is read near 0.9 is the cheaper choice, and the rebuilt tables' truncation must be checked at the
      deepest reach they declare. A series evaluated exactly on the axis took the limits of its modes (the builder
      and this repository's series first gave coefficients of order 2e7 there, from the modes' zeroed limits at
      rho = 0); the rebuild's generator must take the limits or refuse rho = 0.

      **The corrected table (2026-10-29).** One table of the unit tube serves every tube radius (the image scales as
      G(x / R) / (R mu)): unit_tube_R0.997.npz, built from the defect-free series by the table's builder
      (scripts/tube_table/build.py and full.py) under one truncation for every source radius (2500 modes, 16000
      Gauss nodes, k_max 3000, 10834 wall points: the rule's factors times 1.5), on 31 radial knots from the axis to
      0.997 of the radius, 53 angle knots on [0, pi] and 57 axial knots to 5 radii; 209,038,089 bytes, sha256
      d2b4dbe4...51741c, uploaded to NickERoy/mime-wall-tables (CC0) at revision
      45a4add8fb407ed40cefa0550cd810352722b9ae, folder unit_tube_2026-10-29b, and shipped as the reference
      unit_tube_R0.997 (mime.data's assets/unit_tube_tables.json). The table at the first truncation (1667 modes,
      10667 nodes, k_max 2000, 10002 wall points; 209,038,165 bytes, sha256 7f1b31a0...615bf6, revision
      20f4803b178d2eb55c30f702615da4475657665e, folder unit_tube_2026-10-29) is kept as the reference
      unit_tube_R0.997_1667_modes, superseded and read by nothing, with the eleven 2026-05-21 references, labelled
      wrong and read by nothing. Its gate, five runs at tolerances declared before it existed, the defective series
      built on the same grid and truncation as its control: the read against the builder at off-knot points across
      the readable range, 4.6e-4 to 2.0e-3 of a block's largest component against 1% (the control 1.35 to 2.25),
      compared in the frame of the evaluator that ships (below); divergence 4.6e-4 to 8.7e-3 against 5e-2 (the
      control 0.078 to 1.2); Bohlin's axial coefficient 2.1044431 on the axis knot; the transverse coefficient on the
      axis 1.804360 along x and along y (the control -2.451008 along y). The 4D read's measured maximum is 0.23%
      (measured on the table at the first truncation; the grid is the same), and the truncation's share, measured
      against a build at 2.0 times the rule, is 6.1e-6 at the wall for this table, and was 4.4e-4 for the first (its
      own truncation error): a margin of about 4 times on 1%. Away from the wall (both radii below 0.95, and on the
      axis) the two tables agree to 5.4e-12; they differ by 4.5e-4 of a block's largest entry where both radii are at
      or above 0.99 (1141 blocks above 1e-5, 199 above 1e-4, all at the wall), 6.7e-12 for pairs between 0.95 and
      0.99. The gate's read figures were measured with the cylindrical read of the evaluator before F9 and, for the
      1792 points at most 0.12% off, on the per-source build's blocks; the review of the shipped read re-measured
      them on the first table (the largest error found 0.22%), so they carry over.

      **Reciprocity.** G(x, y) = G(y, x)^T was gated at 1e-8 on four interior points a run (radii 0.05 to 0.85),
      where both tables hold it to 1e-16 (1.4e-16 to 3.4e-16 for this one; the control 0.075 to 0.25), and the first
      table was described as reciprocal to rounding. That was wrong for the first table: at its knots the miss
      reached 2.0e-7 at (rho_t, rho_s, dphi, dz) = (0.997, 0.997, 2.19, 0), above 1e-8 at 129 knots (every one at a
      pair with both radii at or above 0.99) and above 1e-12 at 14,754 of 2,903,181, from the truncation at the most
      nearly singular pairs (a source and a target both within 1% of the wall); at that truncation the image of a
      source at 0.997 missed the no-slip condition by 1.1% at the nearest wall point (sources at 0.99, by 9.9e-8; at
      0.9 and inward, 5e-13 to 8e-13). The tolerance was not changed, the gate (scripts/tube_table/full.py) now
      measures every knot, and the table was rebuilt at 1.5 times the truncation (1.25 times met 1e-8 by 3%, 2.0
      times reaches the rounding floor, 3.5e-12). **The shipped table meets the declared 1e-8 at every one of its
      2,903,181 knots: the maximum is 8.4e-10 at (0.997, 0.997, 2.19, 0), none is above 1e-8, 6596 are above 1e-12,
      and for both radii below 0.95 it is at most 3.7e-14; the defective control's is 2.28, with 2,899,647 knots
      above 1e-8.** It is reciprocal to 12 times under the tolerance at the wall's edge, not to rounding there. The
      evaluator's own reciprocity is not a check of the table: every pair is blended with its reciprocal's read, at
      every pair and not only near the axis (F9: the turned reads alone differ from their transposes by their
      interpolation error, 1.4e-3 over 160 drawn point sets, 8.9e-5 on the review's), so a matrix it returns is
      reciprocal to rounding whatever the table holds, and a table planted non-reciprocal by 2e-3 reads as
      reciprocal to 1.9e-18 through it. Reciprocity is checked on the file's knots and on the unblended reads at
      knots (tests/oracles/test_tube_reciprocity.py, on the shipped asset; the planted table fails both every run in
      20).

      **The gate's read check** compared the table's raw read with the builder's cylindrical rows, the form of the
      evaluator before F9; against the evaluator that ships, whose table holds Cartesian rows in the source's frame,
      it read about 2 for the table and the control alike, so it checked nothing. It now compares in the evaluator's
      frame (full.read_errors); tests/oracles/test_tube_gate_read.py has a table passing it at the declared 1%
      and, in 20 of 20 runs, the table scaled by 1.05 and the old comparison failing it.

      **What the method of fundamental solutions (MFS) shows.** The gate's MFS agreement, 1.04e-3 against 1e-2 (the
      control 1.72), is consistent with the table, not a bound on it: the MFS's own wall residual is 3.8%, so it
      bounds the error at about 4%, and it calls tube_fourier_bessel.free_stokeslet, so "sharing no code with the
      series" overstates it. An MFS written for the review, sharing no code with it (wall residual for transverse
      forces 3.4e-5, 3.6e-4 and 2.4e-3 for sources at 0, 0.3 and 0.5 of the radius), agrees with the builder to
      1.6e-6 to 3.0e-5 (a source on the axis), 4.2e-4 (0.3) and 3.4e-3 (0.5), the agreement at its resolution; it
      did not converge for the axial force (residual 0.7% to 1.8%) and says nothing on that column, which Bohlin's
      coefficient and the series cover.

      **Notes on the read.** (a) From about 3 radii along the axis the read's error exceeds the tube's Green's
      function itself: at 4.09 radii (the 3/16-inch tube's span of FW-1) the whole Green's function is 2.2e-5 to
      6.3e-4 of the free Stokeslet and the read's error 1.1e-4 to 2.0e-4 of the image, 0.5 to 9 times the whole (up
      to 190 times at 4.6 radii); the read is exact at the 5-radius knot, and the 0.23% is relative to the image
      block. It is fine for a body's drag and not for long-range interactions (two bodies 3 to 5 radii apart, a
      slender body end to end), which carry order-one relative error. (b) A sample exactly at 0.997 of the radius
      can be refused by rounding: its distance from the axis, computed from its coordinates, can exceed the last
      knot by a unit in the last place, and the read is then NaN and not accepted; the readable range is the file's
      and is not widened. (c) The read's divergence error is 2.3e-2 near the axis (the first radial interval, 0 to
      0.157 of the radius, is the coarsest, the knots being graded towards the wall only) against 1.6e-3 to 3.2e-3
      elsewhere. The image plus the free Stokeslet at the axial reach is within 6e-5 of the free Stokeslet. The
      evaluator reads the table as the compiled step's argument, never its constant (D6), and through the axis
      (F9), its readable range the file's own (readable_rho, 0 to 0.997). The tube's wall kind (tube 0.1.0,
      mime.walls.TubeWall) is registered on this table: the method of regularised Stokeslets fetches nothing at run time and
      reads the asset from the cache (mime assets fetch unit_tube_R0.997), refused by name where it is missing, and
      CI stores it once per job. The drag surrogate (dejongh_mlp_v2) still inherits the defect through its
      training data until phase 7i retrains it.

      **Staleness is now mechanical (phase 7i).** The table carries a derivation record
      (mime.data's derivations/unit_tube_R0.997.json): its parameters, readable domain and gate's checks from
      its provenance arrays, and its builder the committed scripts/tube_table/full.py reading the committed spec
      (specs/unit_tube_R0.997.json, factor 1.5 on every truncation; the arrays name d8bf0a6, which is in no branch's
      history, and a variant of the builder kept outside the repository), at its commit on v0.3 with the hash of each
      source file; the committed spec is held to the arrays by tests/oracles/test_tube_provenance.py. dejongh_mlp_v2's record names, as its wall:tube inputs, the six 2026-05-21 tables its training data
      were computed through (the copies beside those data hash to the r40 references MIME ships), and
      mime.surrogates.staleness finds it stale against the table the tube wall kind reads now, as its record
      declares.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A resistance, a swim speed or a step-out frequency computed with these tables in a tube is wrong by tens of
      per cent, and its sign can be, without any check of the tables against the wall's no-slip condition showing
      it. No 0.3 build reads them: the tube's wall kind reads the corrected table; the v0.2 line's confined results carry
      the error, and so does the drag surrogate, whose training data the v0.2 line generated through these tables
      (scripts generate_mlp_training_data.py and generate_training_fill_v3.py; MIME-ANO-114), and with it script A's
      drag.
    resolution_status: open
    affected_versions: ">=0.1.0"
    affected_components:
      - "the 2026-05-21 wall tables (cylinder_wall_r40_*, cylinder_wall_r30_*)"
      - "v0.2 line: cylinder_greens_function_v2, cylinder_wall_table, StokesletFluidNode confined, dejongh_benchmark.compute_R_matrix"
    verification:
      - "tests/oracles/test_tube_wall.py::test_control_the_series_as_the_v02_builder_computed_it_meets_the_wall_and_fails_inside"
      - "tests/oracles/test_tube_wall.py::test_the_series_image_is_divergence_free_and_reciprocal"
      - "tests/oracles/test_tube_wall.py::test_on_the_axis_the_image_across_it_is_the_same_in_every_direction"
      - "tests/oracles/test_tube_wall.py::test_the_series_image_satisfies_the_momentum_equation"
      - "tests/oracles/test_tube_wall.py::test_a_point_exactly_on_the_axis_takes_the_limit_the_series_approaches"
      - "tests/oracles/test_tube_wall.py::test_the_finer_reference_is_converged_at_eight_tenths_of_the_radius_and_not_at_95_hundredths"
      - "tests/oracles/test_tube_mfs.py::test_the_series_image_is_the_mfs_solution_to_the_walls_residual"
      - "tests/oracles/test_tube_mfs.py::test_control_the_builders_image_misses_the_mfs_on_the_force_along_the_azimuth"
      - "tests/oracles/test_tube_reciprocity.py::test_control_a_planted_table_fails_the_pre_blend_check_and_passes_the_blend_every_run"
      - "tests/oracles/test_tube_reciprocity.py::test_the_files_knots_are_reciprocal_within_the_declared_tolerance_at_every_knot"
      - "tests/oracles/test_tube_gate_read.py::test_the_read_check_passes_the_table_in_the_evaluators_frame_and_fails_the_controls_every_run"
      - "tests/oracles/test_tube_kind.py::test_the_registered_tube_wall_kind_builds_runs_and_refuses_a_read_past_the_readable_range"
      - "tests/assets/test_derivation.py::test_the_tables_record_is_what_its_provenance_arrays_say_and_points_at_the_committed_builder"
      - "tests/assets/test_derivation.py::test_dejongh_mlp_v2_is_stale_through_the_2026_05_21_tables_and_says_why"
    residual_risk: "Any result of the v0.2 line in a tube, and the surrogate (dejongh_mlp_v2) through its training data, inherit the defect until phase 7i retrains it; the 2026-05-21 tables cannot be relied on anywhere. The corrected table is shipped as a reference and the tube wall kind reads it, within the read's 0.23% (a fit for drag, not for long-range interactions) and and its gate met at every knot"
    workaround: "The tube wall kind reads the corrected table. The defect-free series (tests/tube_fourier_bessel.py) computes the image directly, at a cost that grows with the pairs of samples, takes the limits on the axis, and is converged to 1% only where the body reaches 0.8 of the radius or less at 40, 160, 128"
    planned_resolution: "Done 2026-10-29: the corrected table (above). The tube wall kind is registered on it. Left: retrain the surrogate in phase 7i. The maintainer's decision was: build the tables again from the defect-free series, at a truncation that converges near the wall, and check them as phase 7h checks these; then register the tube's wall kind on them"

  - anomaly_id: MIME-ANO-118
    title: "FL-9 in the 3/16 in tube at a spacing of 0.10 mm and a 0.30 mm gap jumps 14% against its neighbours, and passes every check of the generator"
    description: >
      Found by the review of phase 7i-a's PR (computed on Modal, float64, the PR's own generator; reproduced bit for
      bit on a second run). FL-9 resting in the 3/16 in tube (inner radius 2.38125 mm) at a spacing of 0.10 mm and a
      gap of 0.30 mm to the wall, the body's centre 6.5 um off the tube's axis, through Drag.MRS in the tube wall
      kind: the swim speed per unit spin is 83.64 um/rad, against 75.05 at a 0.25 mm gap on the same spacing and 73.24
      at 0.30 mm on a spacing of 0.11 mm (14% above the latter). The axial translation is +17% and the axial coupling
      +34% against the 0.11 mm spacing, where the neighbouring gap differs by 3% to 4%. The resistance is symmetric
      and positive definite and every table read is accepted, so all four checks of the generator (wall_accepted,
      finite, asymmetry, smallest_eigenvalue) pass: the checks cannot see a jump confined to one spacing and gap.

      The mechanism is not isolated. Candidates, both inference: the tube wall kind's handling of a body centred on
      the axis (the table's axis knot and the blend near it), and the sample layout at this spacing. The pose lies
      outside the protocol (in this tube a gap of 0.2 mm keeps the centre 0.106 mm off the axis), so no training case
      meets it; the 3/16 in tube also cannot run the near-wall check as declared (MIME-ANO-114). Memory: at 0.10 mm
      XLA reported trying 15.8 GiB above its budget and rematerialising to 57.8 GiB on an 80 GB card, so a 40 GB card
      would not hold this case.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      The value is a plausible resistance, not a NaN, and it passes the checks that exist, so data drawn at such a
      pose would train a surrogate on a 14% error in the swim speed (larger in the axial coupling) with nothing to flag
      it. The pose is outside the declared protocol, which keeps the risk to a study that places a body near the axis of
      the narrowest tube at this spacing.
    resolution_status: open
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "entry: wall_kind tube; on the shipped table unit_tube_R0.997"
      - "entry: interaction drag, rung mrs; formerly the bem rung"
      - "node: MRSDragNode"
      - "mime.surrogates.generator (its per-case checks)"
    verification: []
    residual_risk: "A jump confined to one spacing and gap passes every check of the generator; the pose is outside the protocol, so the risk is to a study that reaches it"
    workaround: "Stay inside the protocol's poses; for a case near the axis of the 3/16 in tube, compute two neighbouring gaps and two spacings and compare before trusting it"
    planned_resolution: "Isolate the mechanism (the axis handling of the tube kind against the sample layout) by computing the neighbouring spacings and gaps at the pose; then add a smoothness check across gaps or across two spacings to the generator's checks, with this case as its control. The evidence so far is the review's Modal run, which CI cannot repeat (the case needs an 80 GB card), so there is no test yet"

  - anomaly_id: MIME-ANO-119
    title: "The closed screw surface's confined resistance matrix is singular in float64, and its derivative is not reproducible"
    description: >
      On the closed surface of the Screw kind (caps included) at 0.178 mm spacing, the crowded samples at each cap's
      centre (420 of 4,884 samples, 788 of 7,896 at 0.140 mm, have a neighbour closer than a tenth of the mean spacing;
      the closest is at 0.005 of it, the weights down to 7.8e-4 of the mean; the lateral surface's closest is at 0.25)
      make the free-space matrix singular to float64 (smallest eigenvalue -2.4e-9 against a largest of 1.5e8), and with
      the tube wall kind's correction added the matrix has 204 to 209 negative eigenvalues (down to -3.5e-3 against a
      largest of 1.25e8; condition number 4e17 to 9e18). Ten samples carry 32% to 53% of each negative mode, all on the
      caps, 0.29 to 0.34 R from the tube's axis and 2.1 to 2.2 mm from the wall. The forward speed survives (stable to
      about 1e-4 per phase; a 2-ulp change of the offset moves it by up to 1.85e-4 per phase, against 3e-15 on the
      lateral surface). The derivative does not: the phase-mean axial speed's derivative with respect to the body
      radius is +29.8 by automatic differentiation and +1.69 by central differences in one program, and 0.82 in
      another that agrees with it on the forward value to 1e-5 (the margin's: -1.19 and -7.5; the tube radius's: -5.30
      and +1.09). Neither factor alone does it: the same crowded samples in free space give automatic differentiation
      equal to finite differences to 5e-7, and dropping the samples closer than a tenth of the spacing (4,464 kept)
      with the tube restores it to 1.5e-6, converging as the step squared. The speed moves by +0.05% when they are
      dropped. Every derivative, secant-to-linear ratio and Fisher matrix computed on this surface with the tube is
      noise. The sampling is not changed here.

      **Resolved: the screw kind 0.2.0 samples each cap in rings.** A sample
      at the cap's centre and homothetic rings out to the rim, each ring's
      count a multiple of the starts growing with its radius (above 4 starts
      + 2, the second moments' degree round it), so that the samples are
      themselves after a turn by one start, as the section is, the outer
      ring set in from the rim, the radial
      weights exact for the area and the first and second moments; no two
      samples of a cap lie closer than 0.3 of the spacing (a declaration,
      above the lateral patch's closest pair at A, 0.27 of the spacing, on
      which the derivative agrees with finite differences, and above the
      tenth of the mean spacing whose removal restored the closed surface's).
      A cap carries as many samples as 0.1.0's polar grid, less the few its
      symmetry needs (its centre and whole rings: at A 887 against 888, the
      closed surface 4,882 against 4,884, the area the same to the last bit,
      the blob larger by 2e-4 of itself); the kind lowers a cap's count only
      for a section whose troughs and flanks are too narrow for it. At A the
      closed surface has no pair closer than a tenth of the spacing (472
      before); its caps' closest pair is 0.31 of the spacing and a cap's
      sample lies at least 0.36 from the lateral patch's (0.08 before), whose
      own closest pair, 0.27, is now the surface's. Measured at A on an
      A100-40GB in float64 at the highest matmul precision, with the
      predictions committed and pushed before the run
      (scripts/sim2real/predictions_capfix.json, scripts/sim2real/capfix.py):
      A + G has no negative eigenvalue at any of the eight phases (the least
      3.1e4 against a largest of 4.7e7 m/(N s), condition 1.5e3; 0.1.0's at
      phase 0 in the same run, the control, 210 negative, down to -2.3e-3),
      and its Cholesky factor exists at every phase (0.1.0's at none); A
      alone has a condition of 3.5e3 (0.1.0's: 133 eigenvalues negative at
      rounding, -2.4e-9 against 1.5e8). The derivative of the phase-mean
      axial speed passes DEFINITION 5.3's check (a relative step of 1e-6,
      tolerance 1e-4) for the body radius (1.67567, automatic against central
      differences 2.8e-10), the margin (-7.60948, 3.9e-10) and the tube
      radius (1.09847, 1.4e-10), its planted fault (the derivative off by 1%
      to 20%) caught 20 of 20; these agree with the review's central
      differences before the fix (+1.69, -7.5 and +1.09), so the automatic
      derivatives were the noise. The phase-mean axial speed is 4.8233 mm/s,
      +0.13% from 0.1.0's 4.8173 (reproduced in the same run to 6e-6); the
      confined R_xx and R_x,Omega_x each move by about 1% (+0.98% and +1.11%,
      phase means), the free-space resistance's diagonal by at most 0.04% and
      its axial coupling by 0.13%; the resistance's onset of indefiniteness
      under a scaled wall correction is unchanged at every phase (MIME-ANO-114).
      A first rule, rings of any count at 0.1.0's counts exactly, met the same
      predictions in a first run (4.8236 mm/s; the derivative's misses 1.9e-11
      to 6.6e-10; no negative eigenvalue); CI's check that a half turn leaves a
      two-start body's resistance unchanged found it broke the section's
      symmetry (7e-5 of the resistance's largest entry), so the rings' counts
      became multiples of the starts and the checks ran again on the final
      rule, whose numbers are these. Every closed-surface derivative computed
      on 0.1.0 with the tube stays invalid; on 0.2.0 they are available.
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A derivative that changes sign and size between programs with the same forward value, with nothing in a run
      to flag it, would steer a fit, a sensitivity ranking or a projected ascent on this surface to a wrong answer. The
      forward speeds are not affected beyond about 1e-4.
    resolution_status: resolved
    affected_versions: ">=0.3.0.dev0, <0.3.0.dev1"
    resolution_version: "0.3.0.dev1"
    affected_components:
      - "entry: geometry screw 0.1.0; its closed-surface cap quadrature (mime.scene.Screw caps, read by mime.nodes.hydro.mrs)"
      - "entry: interaction drag, rung mrs; formerly the bem rung, with the tube wall kind"
      - "node: MRSDragNode"
    verification:
      - "tests/scene/test_screw_caps.py::test_no_two_samples_of_a_cap_lie_closer_than_the_stated_separation"
      - "tests/scene/test_screw_caps.py::test_the_separation_holds_over_the_harness_grid"
      - "tests/scene/test_screw_caps.py::test_control_a_crowded_pair_re_inserted_fails_the_separation_check"
      - "tests/scene/test_screw_caps.py::test_control_the_polar_grid_fails_the_separation_check_at_every_setting"
      - "tests/scene/test_screw_caps.py::test_a_caps_free_space_matrix_is_well_conditioned_and_the_polar_grids_is_singular"
      - "tests/scene/test_screw_caps.py::test_each_caps_area_and_moments_are_as_accurate_as_the_polar_grids"
      - "tests/scene/test_screw_caps.py::test_fl9_keeps_the_polar_grids_count_at_an_mrs_rungs_spacings"
      - "tests/scene/test_screw_caps.py::test_a_caps_samples_are_themselves_after_a_turn_by_a_start"
      - "tests/oracles/test_surrogate_generator.py::test_a_half_turn_about_the_bodys_own_axis_leaves_the_resistance_unchanged_to_the_samplings_asymmetry"
    residual_risk: "The confined matrix at A is now positive definite and its derivative checked there only; at finer spacings the lateral patch's own closest pair, at its Gauss-Legendre ends, falls with the spacing (0.15 of it at 0.100 mm, 0.075 at 0.050 mm, computed), which the convergence ladder should watch"
    workaround: "None with the screw kind 0.2.0. Results computed on 0.1.0's closed surface with the tube: read its speeds as forward values only (at A they move by about 0.13%), never its derivatives"
    planned_resolution: "Done: the screw kind 0.2.0's cap rule (rings whose counts are multiples of the starts, no two samples closer than 0.3 of the spacing, 0.1.0's counts kept but for the symmetry's few) and the derivative check at A against finite differences with the tube, which passes, the matrix there with no negative eigenvalue"

  - anomaly_id: MIME-ANO-120
    title: "The lateral screw surface's confined resistance has one negative mode on its open ends, 0.10 to 0.14 mm from the wall"
    description: >
      On the lateral-only surface of the Screw kind (FL-9 floored at 0.315 R, margin 0.1 mm, 0.178 mm spacing, tube
      wall kind), the free-space matrix plus the wall's correction has exactly one negative eigenvalue at phase 6 of
      eight (-8.1e3 against a largest of 1.9e7; the resistance's own smallest eigenvalue -485 in units of the
      viscosity times the radius). Ten samples carry 93% of it, at the open ends (|x| / half-length 0.94 to 1.0), 0.10
      to 0.14 mm from the wall. At phases 0, 3 and 7 the matrix is positive definite and its minimum equals the
      free-space matrix's to 1e-4. The same surface is also indefinite at 0.32 R (phase 7) and with blob 0.7. A
      resistance dissipates, so it must be positive definite; the surface's axial reading at that phase is unaffected
      (it uses R_xx and R_x,Omega x), and the wall-held reading there is -18.3, so a phase mean over it is invalid.
      It is a different defect from MIME-ANO-118's (PR #60): that resistance was symmetric and positive
      definite, with no sample within 0.3 mm of the wall.

      A candidate cause, not tested (inference): the lateral patch's samples crowd at its Gauss-Legendre ends under
      refinement. Its closest pair, computed for FL-9 (the 2026-10 review of the cap fix, MIME-ANO-119), is 0.278,
      0.282, 0.265, 0.205, 0.150 and 0.075 spacings at 0.30, 0.24, 0.178, 0.14, 0.10 and 0.05 mm. The same kind of
      defect as MIME-ANO-119's crowded cap centres (0.005 spacings), milder, and 0.14 and 0.10 mm are the generator's
      training spacings. The mode sits on exactly these end samples; whether the crowding produces it is the
      planned resolution's first question. It also bears on MIME-ANO-114's margin at A (the patch is unchanged by
      MIME-ANO-119's fix).
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      An indefinite resistance in a body's implicit step is an energy source, and a reading that uses its indefinite
      block is not a speed. The check exists only in the phase-7j-a scripts, not in the node or the generator.
    resolution_status: open
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "entry: interaction drag, rung mrs; formerly the bem rung, with the tube wall kind, on an open (lateral-only) surface"
      - "node: MRSDragNode"
    verification: []
    residual_risk: "A study on the lateral surface at a gap under about 0.14 mm of the open ends can read an indefinite resistance; nothing in the node reports it"
    workaround: "Check the smallest eigenvalue of the resistance in the non-dimensional form at each pose; use the closed surface's forward values or a larger gap where it is negative"
    planned_resolution: "Isolate whether the open ends' edge samples (their crowding under refinement, above, included) or the wall correction's near-wall reach produces the mode (a spacing and gap scan at phase 6), then add a positive-definiteness flag to the node's published outputs"

  - anomaly_id: MIME-ANO-121
    title: "A wall read refused during a run produces NaN while the library documents that it stops the run"
    description: >
      mime/walls.py and the MRS node's documentation say that a read outside the wall table's range is refused
      (wall_accepted false), that the resistance is then not a number, and that the run stops on it. Nothing in src/mime
      reads wall_accepted, and the run continues on NaN. Observed on the lateral screw surface's dynamics (1.5 s on an
      A100, deterministic reductions): the resistance was indefinite at 84 steps from step 119 without divergence;
      the body's tilt grew to 0.042 rad by step 2073 (at most 0.023 before step 2000), moving the end by 0.155 mm
      against 0.09 mm from the nearest sample to the table's readable edge (0.997 R); the first non-finite state is
      step 2083 (t = 1.04 s), the same step as the first refused read, and wall_accepted stays false for the
      remaining 917 steps. The resistance was positive definite for the 7 steps before it. The failure time differs
      between the default and the flagged program (inference: a sensitive trajectory).
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A run that records NaN to its end without stopping, against a documentation that says it stops, can be taken for
      a finished run; the contact holds the centre's offset, not the tilted ends, so a body can leave the table's range
      while the contact is satisfied.
    resolution_status: open
    affected_versions: ">=0.3.0.dev1"
    affected_components:
      - "entry: interaction drag, rung mrs; formerly the bem rung, its wall_accepted"
      - "node: MRSDragNode"
      - "entry: wall_kind tube; its documentation (mime.walls)"
    verification: []
    residual_risk: "Any run whose body reaches the readable edge of a wall table continues on NaN without a stop"
    workaround: "Read wall_accepted in the run's recorded outputs and discard a run where it is false"
    planned_resolution: "Either a consumer that stops the run on wall_accepted false, or the documentation corrected to say it does not; with a dynamics test that drives a body past the edge as its control"

  - anomaly_id: MIME-ANO-122
    title: "The dynamic motor's rotor inertia about its axis rides on its stator without loading the arm"
    description: >
      The dynamic motor's rotor speed is relative to its stator, and its pose is the stator's turned by its angle. When
      the stator turns about the motor's axis (the arm's last joint turning, on A0, whose motor axis is that joint's),
      the rotor turns with it and no torque acts on either: the rotor's angular momentum about the axis changes by
      J alpha_stator with nothing to supply it, and the arm's mass matrix does not hold the rotor's inertia. On A0 the
      rotor's J = 1e-5 kg m^2 is 4.1 times link_6's own izz = 2.43e-6 kg m^2 (ar4.urdf), so the dynamic arm's joint 6
      turns with about a fifth of its physical inertia about its axis. The motor's oracle (what the stator passes plus
      what the rotor keeps is what acted on the motor) is an identity of one step of the motor's own algebra, not
      conservation of the arm's and motor's momentum together, so it cannot see this. The 0.2 line did the same, so
      nothing differs from A0's 0.3.1 reference here. Expected: the rotor's inertia about its axis added to the
      mounted link's, and -J e . alpha_stator in the rotor's equation (the coupled form). Found with it: the frame
      carried none of the rotor's mass either, nor any part's mounted on the arm (an apparatus part could not have a
      mass; checked at 64a3ee0, the arm's inertials equal with and without the magnet).
    severity: major
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      A run whose result depends on how fast the arm's last joint answers a torque (a controller tuned on the twin,
      the arm's own step-out under a load) sees a joint about five times lighter than the hardware's on A0; a run
      that drives only the rotor, or holds the arm still, is not affected.
    resolution_status: resolved
    # Within dev1: the dynamic motor 0.1.0 (phase 7a3) is affected, and motor 0.2.0 (phase 7a4) resolves it.
    affected_versions: ">=0.3.0.dev1"
    resolution_version: "0.3.0.dev1"
    affected_components:
      - "MIME-NODE-110"
      - "MIME-NODE-109"
      - "entry: dynamics motor, rung dynamic"
      - "node: DynamicMotorNode"
    verification:
      - "tests/oracles/test_spinner.py::test_the_axial_momentum_of_hub_and_rotor_is_conserved_to_the_integrators_order"
      - "tests/oracles/test_spinner.py::test_control_7a3s_relative_speed_fails_the_momentum_on_every_draw"
      - "tests/oracles/test_spinner.py::test_the_gyroscopic_coupling_does_no_work_over_ten_thousand_steps_at_every_step_size"
      - "tests/oracles/test_spinner.py::test_a_spinning_rotor_whose_axis_turns_at_a_rate_loads_its_host_by_j_omega_omega"
      - "tests/oracles/test_spinner.py::test_control_the_momentum_not_handed_or_flipped_fails_on_every_draw"
      - "tests/oracles/test_spinner_tree.py::test_on_a_joint_along_the_axis_the_spinner_converges_to_the_jointed_rotor_and_its_planted_faults_do_not"
      - "tests/oracles/test_spinner_tree.py::test_on_a_joint_across_the_axis_the_spinner_converges_to_the_jointed_rotor"
      - "tests/oracles/test_spinner_tree.py::test_on_a_gimbal_the_spinner_converges_to_the_jointed_rotor_and_its_gyroscopic_sign_flipped_does_not"
      - "tests/oracles/test_frame_rates.py::test_every_frames_published_rate_is_the_difference_of_its_poses_with_the_base_turned"
      - "tests/oracles/test_mounted_mass.py::test_a_payload_grafted_on_any_link_is_its_inertial_edited_by_hand"
      - "tests/oracles/test_mounted_mass.py::test_control_a_payload_at_the_wrong_offset_fails_on_every_draw"
      - "tests/oracles/test_mounted_mass.py::test_control_a_payload_not_turned_into_its_links_frame_fails_on_every_draw"
      - "tests/oracles/test_mounted_mass.py::test_through_the_build_each_mass_reaches_the_arm_as_graft_places_it"
      - "tests/build/test_mounted_refusals.py::test_a_tilted_rotor_is_refused_with_its_size_and_the_kinematic_arm_takes_it"
      - "tests/build/test_mounted_refusals.py::test_an_unbalanced_rotor_is_refused_with_its_size_and_the_kinematic_arm_takes_it"
      - "tests/build/test_mounted_refusals.py::test_a_real_offset_is_refused_by_its_rotating_force_and_a_cad_residue_is_accepted"
      - "tests/build/test_mounted_refusals.py::test_a_rotor_unequal_across_its_axis_is_carried_on_the_dynamic_arm"
    residual_risk: "What is not carried, each judged by the load it would make: a rotor's centre of mass off its axis (its rotating force m r Omega^2) and its inertia turned out of the axis (its rotating torque |I e x e| Omega^2), accepted on a dynamic arm only as residues, each at most a thousandth of the rotor's weight (on its radius of gyration, for the torque) at its declared top speed, which the build report gives for each rotor (a labelled decision, not a measured bound; 1e-9 m off A0's axis is 4e-7 of its weight); above that they are refused, not carried. Measured against the rotor as a jointed child (the review's full tree), the spinner converges at first order with no floor on A0's magnet spun about a diameter (joint velocities 2.8e-2 of their scale at 1 ms, 3.4e-3 at 0.125 ms, orders 1.02, 1.01, 1.00) and on a rod spun end over end (orders 1.05, 1.02, 1.01); before the inequality was carried, A0's flange joint sat at a floor 9.1 % off. An articulated mass is refused on a dynamic arm, not carried"
    workaround: "None needed for a rotor whose centre of mass is on its axis and whose inertia is not turned off it, symmetric or not. For an unbalanced, tilted or articulated one beyond a residue, the kinematic arm (its motion prescribed), or wait for jointed sub-trees grafted on a link"
    planned_resolution: "Done in dev1 phase 7a4 (design #185): the dynamic motor (motor 0.2.0) is a spinner carrying the rotor's absolute spin, so that J Omega_dot is the axial torques with no stator term, the host's angular velocity in, this step's; its momentum J Omega e out, whose gyroscopic torque the arm applies at its own velocity by a Cayley step, with no work at any step size; the rotor's mass and mean inertia across its axis, and every part with a mass mounted on the arm, are welded on their links as bodies of the arm's tree at build (mime.core.multibody.graft), and its half difference across the axis turns with it, in the arm's mass matrix at each step's start and end and in the spin as the torque (omega x e) . D omega (the review of PR #68, finding W2). Grafting jointed sub-trees, which would carry a tilted, unbalanced or articulated mass, is logged for later"
  - anomaly_id: MIME-ANO-123
    title: "The polar-grid caps of the capsule and the sphere crowd their poles"
    description: >
      The capsule's end caps and the sphere (the MRS rung's oracle body) are sampled on the polar grid
      the screw's caps used before the screw kind 0.2.0 (MIME-ANO-119): as many samples on the innermost ring, at
      the pole, as on the rim. The closest pair is 0.115 spacings for the capsule at 0.178 mm (computed by the
      cap-fix study), and for a unit sphere 0.206, 0.074 and 0.038 spacings at spacings 0.3, 0.1 and 0.05 (computed by
      the review of the cap fix; the code is the same grid, mime.scene._solids). On the screw this crowding made the
      confined resistance matrix singular in float64 and its derivative noise (MIME-ANO-119). Nothing has measured
      the sphere or the capsule for that: the sphere's forward comparisons with its closed forms pass, so what is at
      risk is a derivative, or a matrix conditioned with a wall's correction, and not a forward value. Not measured
      with the tube wall kind, and it is not known that the effect appears on a body of these shapes.
    severity: minor
    safety_relevance: context_dependent
    safety_relevance_rationale: >
      MIME-ANO-119 closes with the statement that derivatives on the screw's closed surface are available on 0.2.0,
      which invites the same use of the sphere and the capsule, whose poles are as crowded as the screw's caps were.
      A derivative that is noise, with the same forward value, would steer a fit or a sensitivity ranking to a wrong
      answer, with nothing in a run to flag it.
    resolution_status: resolved
    affected_versions: ">=0.3.0.dev0"
    resolution_version: "0.3.0.dev1"
    affected_components:
      - "entry: geometry capsule; its polar-grid sampling (mime.scene._solids), read by mime.nodes.hydro.mrs"
