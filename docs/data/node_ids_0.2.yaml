# The algorithm ids of the 0.2 line's nodes, frozen as the tag pre-0.3 holds them in src/mime/nodes: each with the node
# class that held it and that class's module there. An id names one node for good, so a 0.3 node takes one of these
# only if it is that node (the same class name), and a new node takes the next id after the largest in use.
# `mime docs check` reads this file.
node_ids:
  - {id: MIME-NODE-001, node: ExternalMagneticFieldNode, module: mime.nodes.actuation.external_magnetic_field}
  - {id: MIME-NODE-002, node: MagneticResponseNode, module: mime.nodes.robot.magnetic_response}
  - {id: MIME-NODE-003, node: RigidBodyNode, module: mime.nodes.robot.rigid_body}
  - {id: MIME-NODE-004, node: CSFFlowNode, module: mime.nodes.environment.csf_flow}
  - {id: MIME-NODE-005, node: PhaseTrackingNode, module: mime.nodes.robot.phase_tracking}
  - {id: MIME-NODE-006, node: FlexibleBodyNode, module: mime.nodes.robot.flexible_body}
  - {id: MIME-NODE-007, node: SurfaceContactNode, module: mime.nodes.robot.surface_contact}
  - {id: MIME-NODE-008, node: PermanentMagnetResponseNode, module: mime.nodes.robot.permanent_magnet_response}
  - {id: MIME-NODE-009, node: SuperparamagneticResponseNode, module: mime.nodes.robot.superparamagnetic_response}
  - {id: MIME-NODE-010, node: IBLBMFluidNode, module: mime.nodes.environment.lbm.fluid_node}
  - {id: MIME-NODE-011, node: MLPResistanceNode, module: mime.nodes.environment.stokeslet.mlp_resistance_node}
